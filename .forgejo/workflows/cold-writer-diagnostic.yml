name: cold-writer-diagnostic
on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Exact baseline source SHA; never an admission or release verdict'
        required: true
        type: string
      candidate:
        description: 'Optional exact candidate SHA for a second cold measurement on the SAME runner'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: cold-writer-diagnostic
  cancel-in-progress: false
jobs:
  cold-writer:
    runs-on: heavy
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      RUSTFLAGS: '-C link-arg=-fuse-ld=mold'
      OKILUM_SOURCE_COMMIT: ${{ inputs.source }}
      COLD_WRITER_TOOL_SOURCE: ${{ github.sha }}
      COLD_WRITER_TOOL_REF: ${{ github.ref }}
    steps:
      - name: Validate source
        env:
          SOURCE: ${{ inputs.source }}
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          [[ "$SOURCE" =~ ^[0-9a-f]{40}$ ]]
          [[ -z "$CANDIDATE" || "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: diagnostic-tools
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.source }}
          path: source
      - uses: https://code.forgejo.org/actions/checkout@v4
        if: inputs.candidate != ''
        with:
          persist-credentials: false
          ref: ${{ inputs.candidate }}
          path: candidate
      - name: Install canonical system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential cmake pkg-config curl git mold zstd python3-venv \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig-dev libfreetype-dev libxcb1-dev libasound2-dev
      - name: Install pinned toolchain
        working-directory: source
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/cargo" --version
      - name: Prepare exact source and Python dependencies
        env:
          SOURCE: ${{ inputs.source }}
          CANDIDATE: ${{ inputs.candidate }}
        run: |
          prepare() (
            cd "$1"
            test "$(git rev-parse HEAD)" = "$2"
            test ! -d target
            scripts/vendor-setup.sh
            scripts/vendor-setup.sh --verify
            bash scripts/ci/setup-python-tests.sh
          )
          prepare source "$SOURCE"
          if [[ -n "$CANDIDATE" ]]; then prepare candidate "$CANDIDATE"; fi
      - name: Observe original prelude and cold writer within 900 seconds
        id: baseline
        continue-on-error: true
        working-directory: source
        env:
          SOURCE: ${{ inputs.source }}
        run: |
          export TMPDIR="${RUNNER_TEMP:?}"
          # Reproduce the observed unavailable compiler cache, without changing
          # any host cache/server or adding a compiled-target restore.
          unset RUSTC_WRAPPER
          python3 ../diagnostic-tools/scripts/ci/cold-writer-diagnostic.py --source "$SOURCE"
      - name: Observe candidate cold writer on the same runner within 900 seconds
        id: candidate
        if: inputs.candidate != ''
        working-directory: candidate
        env:
          SOURCE: ${{ inputs.candidate }}
        run: |
          export TMPDIR="${RUNNER_TEMP:?}"
          unset RUSTC_WRAPPER
          test ! -d target
          python3 ../diagnostic-tools/scripts/ci/cold-writer-diagnostic.py --source "$SOURCE"
      - name: Preserve both measurement outcomes
        if: always()
        env:
          BASELINE: ${{ steps.baseline.outcome }}
          CANDIDATE: ${{ steps.candidate.outcome }}
          CANDIDATE_SOURCE: ${{ inputs.candidate }}
        run: |
          printf 'COLD_WRITER_PAIR baseline=%s candidate=%s\n' "$BASELINE" "$CANDIDATE"
          test "$BASELINE" = success
          if [[ -n "$CANDIDATE_SOURCE" ]]; then test "$CANDIDATE" = success; fi
