# Move an already published build from the `beta` channel to `stable`.
# The ZIP and its signature are unchanged; only the appcast item's channel moves.
name: macos-promote

on:
  workflow_dispatch:
    inputs:
      build:
        description: Build number to promote (CFBundleVersion, e.g. 5861)
        required: true
        type: string

concurrency:
  group: tessera-macos-release
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Promote to stable
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGEJO_URL: ${{ github.server_url }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          BUILD: ${{ inputs.build }}
        run: python3 scripts/updater/release.py --app tessera promote --build "$BUILD"
