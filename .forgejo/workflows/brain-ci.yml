# Brain is frozen: test relevant changes and the default branch each night.
name: brain-ci

on:
  pull_request:
    paths:
      - 'crates/okilum-brain/**'
      - 'crates/okilum-cored/**'
      - '.forgejo/workflows/brain-ci.yml'
      - '.github/workflows/forgejo-brain.yml'
      - 'scripts/ci/github-pr.py'
  push:
    branches: [main]
    paths:
      - 'crates/okilum-brain/**'
      - 'crates/okilum-cored/**'
      - '.forgejo/workflows/brain-ci.yml'
      - '.github/workflows/forgejo-brain.yml'
      - 'scripts/ci/github-pr.py'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: brain-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  brain-tests:
    if: >-
      github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || vars.OKILUM_PR_LANE == 'local'
    # Existing baldr Docker label: keep long builds off light/bridge waiters.
    runs-on: docker
    container:
      image: ghcr.io/catthehacker/ubuntu:act-24.04
    timeout-minutes: 45
    continue-on-error: true
    # Shared sccache on the LAN S3 backend (private runner operations runbook,
    # "CI pool expansion 2026-10-04"). The secrets are BeFeast org secrets; when
    # they are absent (fork PRs) the build simply runs without the wrapper.
    env:
      CARGO_INCREMENTAL: "0"
      # CI-only: retain backtrace lines; local and macOS profiles are unchanged.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      SCCACHE_BUCKET: ${{ vars.SCCACHE_BUCKET }}
      SCCACHE_ENDPOINT: ${{ vars.SCCACHE_ENDPOINT }}
      SCCACHE_REGION: ${{ vars.SCCACHE_REGION }}
      SCCACHE_S3_USE_SSL: "false"
      SCCACHE_S3_KEY_PREFIX: rust
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential cmake pkg-config curl git mold

      - name: Install Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Resolve pinned workspace path dependencies
        run: |
          scripts/vendor-setup.sh
          scripts/vendor-setup.sh --verify

      - name: Enable sccache
        run: |
          set -euo pipefail
          source scripts/ci/release-cache.sh
          for name in RUSTC_WRAPPER SCCACHE_SERVER_UDS SCCACHE_IDLE_TIMEOUT SCCACHE_IGNORE_SERVER_IO_ERROR; do
            printf '%s=%s\n' "$name" "${!name:-}" >> "$GITHUB_ENV"
          done
          if [ -n "${RUSTC_WRAPPER:-}" ]; then dirname "$RUSTC_WRAPPER" >> "$GITHUB_PATH"; fi

      - name: Restore Brain Cargo downloads cache
        uses: https://code.forgejo.org/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
          key: okilum-brain-v2-${{ runner.os }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.forgejo/workflows/brain-ci.yml') }}

      - name: Frozen Brain and daemon tests (non-blocking)
        # Keep every test and run every test binary even after a failure. Make
        # this job required again when Brain is unfrozen and its flakes fixed.
        run: cargo test -p okilum-brain -p okilum-cored --no-fail-fast

      - name: sccache stats
        if: always()
        run: if [ -n "${RUSTC_WRAPPER:-}" ]; then sccache --show-stats || true; fi

  brain-github:
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.OKILUM_PR_LANE != 'local'
    runs-on: bridge
    timeout-minutes: 125
    continue-on-error: true
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Wait for exact-head hosted brain
        env:
          MIRROR_TOKEN: ${{ secrets.OKILUM_GITHUB_MIRROR }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_LANE: brain
        run: python3 scripts/ci/github-pr.py
