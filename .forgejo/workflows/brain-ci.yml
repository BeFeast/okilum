# Brain is frozen: test relevant changes and the default branch each night.
name: brain-ci

on:
  schedule:
    - cron: '5 22 * * 2,6'
  workflow_dispatch:

concurrency:
  group: brain-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The only lane: the exact source runs on GitHub's hosted runner
  # (.github/workflows/forgejo-brain.yml). The former local job used the
  # `docker` label, which also matched baldr; Okilum left baldr (Oleg 14.11).
  brain-github:
    if: >-
      github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: bridge
    timeout-minutes: 125
    continue-on-error: true
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Wait for exact-head hosted brain
        env:
          MIRROR_TOKEN: ${{ secrets.OKILUM_GITHUB_MIRROR }}
          OKILUM_GITHUB_APP_ID: ${{ secrets.OKILUM_GITHUB_APP_ID }}
          OKILUM_GITHUB_APP_INSTALLATION_ID: ${{ secrets.OKILUM_GITHUB_APP_INSTALLATION_ID }}
          OKILUM_GITHUB_APP_KEY: ${{ secrets.OKILUM_GITHUB_APP_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.run_number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_LANE: brain
        run: python3 scripts/ci/github-pr.py
