# Brain is frozen: test relevant changes and the default branch each night.
name: brain-ci

on:
  pull_request:
    paths:
      - 'crates/tessera-brain/**'
      - 'crates/tessera-cored/**'
      - '.forgejo/workflows/brain-ci.yml'
  push:
    branches: [main]
    paths:
      - 'crates/tessera-brain/**'
      - 'crates/tessera-cored/**'
      - '.forgejo/workflows/brain-ci.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: brain-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  brain-tests:
    runs-on: light
    timeout-minutes: 45
    continue-on-error: true
    # Shared sccache on the LAN S3 backend (private runner operations runbook,
    # "CI pool expansion 2026-10-04"). The secrets are BeFeast org secrets; when
    # they are absent (fork PRs) the build simply runs without the wrapper.
    env:
      CARGO_INCREMENTAL: "0"
      # CI-only: retain backtrace lines; local and macOS profiles are unchanged.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      SCCACHE_BUCKET: ${{ vars.SCCACHE_BUCKET }}
      SCCACHE_ENDPOINT: ${{ vars.SCCACHE_ENDPOINT }}
      SCCACHE_REGION: ${{ vars.SCCACHE_REGION }}
      SCCACHE_S3_USE_SSL: "false"
      SCCACHE_S3_KEY_PREFIX: rust
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential cmake pkg-config curl git mold

      - name: Install Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Resolve pinned workspace path dependencies
        run: |
          scripts/vendor-setup.sh
          scripts/vendor-setup.sh --verify

      - name: Enable sccache
        run: |
          set -euo pipefail
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${SCCACHE_ENDPOINT:-}" ]; then
            echo "sccache credentials not available; building without it"
            exit 0
          fi
          curl -sSfL https://github.com/mozilla/sccache/releases/download/v0.18.0/sccache-v0.18.0-x86_64-unknown-linux-musl.tar.gz -o "$RUNNER_TEMP/sccache.tgz"
          echo "45f1447fbe231e3037bde351ef70677dd212216c8d62ae7ca409fecc4d6acc89  $RUNNER_TEMP/sccache.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/sccache.tgz" -C "$RUNNER_TEMP"
          sudo install "$RUNNER_TEMP"/sccache-v0.18.0-x86_64-unknown-linux-musl/sccache /usr/local/bin/sccache
          if sccache --start-server; then
            echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          else
            echo "sccache server did not start; building without it"
          fi

      - name: Restore Brain Cargo downloads cache
        uses: https://code.forgejo.org/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
          key: tessera-brain-v2-${{ runner.os }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.forgejo/workflows/brain-ci.yml') }}

      - name: Frozen Brain and daemon tests (non-blocking)
        # Keep every test and run every test binary even after a failure. Make
        # this job required again when Brain is unfrozen and its flakes fixed.
        run: cargo test -p tessera-brain -p tessera-cored --no-fail-fast

      - name: sccache stats
        if: always()
        run: if [ -n "${RUSTC_WRAPPER:-}" ]; then sccache --show-stats; fi
