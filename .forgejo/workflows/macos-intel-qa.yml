name: macos-intel-qa
on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * *"

concurrency:
  group: tessera-macos-intel-qa
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos
    timeout-minutes: 90
    env:
      SCCACHE_BUCKET: ${{ vars.SCCACHE_BUCKET }}
      SCCACHE_ENDPOINT: ${{ vars.SCCACHE_ENDPOINT }}
      SCCACHE_REGION: ${{ vars.SCCACHE_REGION }}
      SCCACHE_S3_USE_SSL: "false"
      SCCACHE_S3_KEY_PREFIX: rust
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
          github-server-url: ${{ vars.FORGEJO_CHECKOUT_URL || github.server_url }}
      - name: Cross-compile and Developer ID sign Intel QA bundle
        env:
          TESSERA_SIGNING_IDENTITY: ${{ vars.TESSERA_SIGNING_IDENTITY }}
        run: |
          export TESSERA_BUILD_VERSION=$((5000 + ${GITHUB_RUN_NUMBER:?}))
          bash scripts/build-macos-intel-qa.sh "$RUNNER_TEMP/intel-qa-$GITHUB_RUN_NUMBER"
      - uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: macos-intel-qa
          path: |
            ${{ runner.temp }}/intel-qa-${{ github.run_number }}/*.zip
            ${{ runner.temp }}/intel-qa-${{ github.run_number }}/metrics.txt
          retention-days: 14
