name: macos-native-verify
on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: 'Must be true: artifact-only native verification; never publishes'
        required: true
        default: 'true'
      source:
        description: 'Full exact green open PR head'
        required: true
      pr:
        description: 'Trusted same-repository open PR number'
        required: true
permissions:
  contents: read
concurrency:
  group: okilum-macos-build
  cancel-in-progress: false
jobs:
  verify-only:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'BeFeast/okilum' && github.ref == 'refs/heads/main' && inputs.verify_only == 'true'
    runs-on: bridge
    timeout-minutes: 105
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact authorized source on hosted macOS without publication
        env:
          VERIFY_ONLY: ${{ inputs.verify_only }}
          VERIFY_SOURCE: ${{ inputs.source }}
          VERIFY_PR: ${{ inputs.pr }}
          PRODUCT_SOURCE: ${{ inputs.source }}
          MIRROR_TOKEN: ${{ secrets.OKILUM_GITHUB_MIRROR }}
          OKILUM_GITHUB_APP_ID: ${{ secrets.OKILUM_GITHUB_APP_ID }}
          OKILUM_GITHUB_APP_INSTALLATION_ID: ${{ secrets.OKILUM_GITHUB_APP_INSTALLATION_ID }}
          OKILUM_GITHUB_APP_KEY: ${{ secrets.OKILUM_GITHUB_APP_KEY }}
          OKILUM_SIGNING_IDENTITY: ${{ vars.OKILUM_SIGNING_IDENTITY }}
          OKILUM_NOTARY_PROFILE: ${{ vars.OKILUM_NOTARY_PROFILE }}
        run: python3 scripts/ci/github-macos-shipping.py
