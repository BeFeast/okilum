# Explicit maintenance of legacy temporary public native-check refs.
name: github-macos-cleanup

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Closed PR whose legacy native-check refs should be retired'
        required: true

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: light
    timeout-minutes: 5
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          # Maintenance always uses main tooling.
          ref: main
          persist-credentials: false
      - name: Delete this PR's GitHub native-check refs
        env:
          MIRROR_TOKEN: ${{ secrets.OKILUM_GITHUB_MIRROR }}
          OKILUM_GITHUB_APP_ID: ${{ secrets.OKILUM_GITHUB_APP_ID }}
          OKILUM_GITHUB_APP_INSTALLATION_ID: ${{ secrets.OKILUM_GITHUB_APP_INSTALLATION_ID }}
          OKILUM_GITHUB_APP_KEY: ${{ secrets.OKILUM_GITHUB_APP_KEY }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: python3 scripts/ci/github-macos.py cleanup
