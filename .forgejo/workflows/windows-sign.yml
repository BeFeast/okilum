# Signing rehearsal on the Windows signer runner (#1104). Manual only; never publishes.
#
# Runs the production signing script (scripts/windows/package-release.sh) on a published
# beta payload, without a cross-build.
#   backend pkcs12-test   throwaway self-signed identity made inside the job
#   backend certum-pkcs11 the real certificate; needs an open SimplySign session
name: windows-sign

on:
  workflow_dispatch:
    inputs:
      backend:
        description: 'pkcs12-test (no secrets) or certum-pkcs11 (needs a SimplySign session)'
        type: choice
        options: [pkcs12-test, certum-pkcs11]
        default: pkcs12-test
      version:
        description: 'Beta version to re-sign, e.g. 0.1.10993; empty = current beta'
        required: false
        default: ''

concurrency:
  group: windows-signer
  cancel-in-progress: false

jobs:
  rehearse:
    runs-on: windows-signer
    timeout-minutes: 30
    env:
      OKILUM_WINDOWS_SIGN_BACKEND: ${{ inputs.backend }}
      OKILUM_WINDOWS_SIGN_PKCS11_CFG: /etc/okilum-signer/simplysign-pkcs11.cfg
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Stage the unsigned payload and the packager
        run: |
          echo "OKILUM_RELEASE_VERSION=$(python3 scripts/windows/payload-from-release.py target/windows-dist ${{ inputs.version }})" >> "$GITHUB_ENV"
          bash scripts/windows/install-vpk.sh "$RUNNER_TEMP/velopack" >/dev/null
          # Trust anchors for verification: the system roots plus Certum's public intermediate.
          cat /etc/ssl/certs/ca-certificates.crt scripts/windows/certs/certum-code-signing-2021-ca.pem > "$RUNNER_TEMP/ca.pem"
          echo "OKILUM_WINDOWS_SIGN_CA_FILE=$RUNNER_TEMP/ca.pem" >> "$GITHUB_ENV"
      - name: Throwaway identity (pkcs12-test)
        if: inputs.backend == 'pkcs12-test'
        run: |
          bash scripts/windows/make-test-signer.sh "$RUNNER_TEMP/test-signer" \
            | sed -n "s/^export \([A-Z_0-9]*\)='\{0,1\}\([^']*\)'\{0,1\}$/\1=\2/p" >> "$GITHUB_ENV"
      # Pins come from one step per backend, never from both (job env would shadow GITHUB_ENV).
      - name: Real identity (certum-pkcs11)
        if: inputs.backend == 'certum-pkcs11'
        env:
          ALIAS: ${{ vars.OKILUM_WINDOWS_SIGN_ALIAS }}
          SHA256: ${{ vars.OKILUM_WINDOWS_SIGN_CERT_SHA256 }}
          SUBJECT: ${{ vars.OKILUM_WINDOWS_SIGN_SUBJECT }}
        run: |
          printf 'OKILUM_WINDOWS_SIGN_ALIAS=%s\nOKILUM_WINDOWS_SIGN_CERT_SHA256=%s\nOKILUM_WINDOWS_SIGN_SUBJECT=%s\n' \
            "$ALIAS" "$SHA256" "$SUBJECT" >> "$GITHUB_ENV"
      # The production script (#1104): probe, sign, rebuild the ZIP, pack with the
      # template, verify every shipped program; a missing key fails the rehearsal.
      - name: Sign, package and verify (scripts/windows/package-release.sh)
        env:
          OKILUM_WINDOWS_UNSIGNED_POLICY: fail
        run: bash scripts/windows/package-release.sh "$RUNNER_TEMP/velopack" target/windows-dist target/windows-release
      - name: Keep the rehearsal output (not published)
        if: always()
        uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: windows-sign-${{ inputs.backend }}
          path: |
            target/windows-release/*Setup.exe
            target/windows-release/*-full.nupkg
            target/windows-dist/okilum-*-x86_64.zip
            target/windows-release/signing.json
          retention-days: 3
