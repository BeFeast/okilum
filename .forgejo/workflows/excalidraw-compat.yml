# #478 slice 2: check Excalidraw writer output with the Obsidian plugin's own
# loader. Test-only oracle: the AGPL-3.0 plugin source is fetched at test time
# (pinned commit, sha256-verified) and is not committed, packaged, uploaded or
# distributed. This job uploads no artifacts.
# Not a required check: GitHub/npm network trouble must never block a merge.
name: excalidraw-compat

on:
  schedule:
    - cron: '5 22 * * 2,6'
  workflow_dispatch:

concurrency:
  group: excalidraw-compat-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  plugin-oracle:
    # The exact source runs on GitHub's hosted runner
    # (.github/workflows/forgejo-excalidraw.yml). The former job used the `docker`
    # label, which also matched baldr; Okilum left baldr (Oleg 14.11). This
    # waiter compiles nothing.
    if: >-
      github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: bridge
    # 53 min shared queue/run budget + poll/cancel/cleanup, within the primary
    # bridge runner's 60 min ceiling (docs/fast-runner.md).
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Load writer output with the plugin loader on GitHub
        env:
          MIRROR_TOKEN: ${{ secrets.OKILUM_GITHUB_MIRROR }}
          OKILUM_GITHUB_APP_ID: ${{ secrets.OKILUM_GITHUB_APP_ID }}
          OKILUM_GITHUB_APP_INSTALLATION_ID: ${{ secrets.OKILUM_GITHUB_APP_INSTALLATION_ID }}
          OKILUM_GITHUB_APP_KEY: ${{ secrets.OKILUM_GITHUB_APP_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.run_number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_LANE: excalidraw
        timeout-minutes: 56
        run: python3 scripts/ci/github-pr.py
