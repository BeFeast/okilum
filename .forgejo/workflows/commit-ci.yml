# Heavy checks run in the public mirror; this job only pushes/waits/reports.
name: commit-ci
on:
  push:
    branches: ['ci/**']
  workflow_dispatch:
    inputs:
      lane:
        description: 'linux, linux-binary, native-core, native-sync, windows-release, arch, brain, or inbox'
        required: true
        default: linux
      baseline:
        description: 'Also build the current main snapshot (linux-binary only)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: commit-ci-${{ github.ref }}-${{ inputs.lane || 'linux' }}
  cancel-in-progress: false
jobs:
  hosted:
    # Do not use this unsigned entrypoint for main/release publication.
    if: startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main'
    runs-on: bridge
    timeout-minutes: 125
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Register hosted cancellation cleanup
        uses: ./.forgejo/actions/hosted-cleanup
        with:
          token: ${{ secrets.TESSERA_GITHUB_MIRROR }}
      - name: Run exact commit in hosted CI
        env:
          MIRROR_TOKEN: ${{ secrets.TESSERA_GITHUB_MIRROR }}
          PR_NUMBER: ${{ github.run_number }}
          PR_HEAD_SHA: ${{ github.sha }}
          CI_LANE: ${{ inputs.lane || 'linux' }}
        run: python3 scripts/ci/github-pr.py

  baseline:
    if: >-
      github.event_name == 'workflow_dispatch' && inputs.lane == 'linux-binary' &&
      (inputs.baseline == true || inputs.baseline == 'true') &&
      startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main'
    runs-on: bridge
    timeout-minutes: 125
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Pin main baseline source
        id: source
        run: |
          sha=$(git rev-parse HEAD)
          echo "Baseline source SHA: $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Register hosted cancellation cleanup
        uses: ./.forgejo/actions/hosted-cleanup
        with:
          token: ${{ secrets.TESSERA_GITHUB_MIRROR }}
      - name: Build exact main baseline without publication
        env:
          MIRROR_TOKEN: ${{ secrets.TESSERA_GITHUB_MIRROR }}
          PR_NUMBER: ${{ github.run_number }}
          PR_HEAD_SHA: ${{ steps.source.outputs.sha }}
          CI_LANE: linux-binary
        run: python3 scripts/ci/github-pr.py
