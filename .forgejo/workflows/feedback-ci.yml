# The portable harness imports production Feedback sources without linking GPUI.
# Run nightly or on demand; workers validate changes through GitHub checks.
name: feedback-ci
on:
  schedule:
    - cron: '45 22 * * *'
  workflow_dispatch:
concurrency:
  group: feedback-ci-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  feedback-model:
    # The exact source runs on GitHub's hosted runner
    # (.github/workflows/forgejo-feedback.yml). The former job used the `docker`
    # label, which also matched baldr; Okilum left baldr (Oleg 14.11). This
    # waiter compiles nothing.
    if: >-
      github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: bridge
    # 53 min shared queue/run budget + poll/cancel/cleanup, within the primary
    # bridge runner's 60 min ceiling (docs/fast-runner.md).
    timeout-minutes: 60
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Run the portable Feedback suite on GitHub
        env:
          MIRROR_TOKEN: ${{ secrets.OKILUM_GITHUB_MIRROR }}
          OKILUM_GITHUB_APP_ID: ${{ secrets.OKILUM_GITHUB_APP_ID }}
          OKILUM_GITHUB_APP_INSTALLATION_ID: ${{ secrets.OKILUM_GITHUB_APP_INSTALLATION_ID }}
          OKILUM_GITHUB_APP_KEY: ${{ secrets.OKILUM_GITHUB_APP_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.run_number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_LANE: feedback
        timeout-minutes: 56
        run: python3 scripts/ci/github-pr.py
