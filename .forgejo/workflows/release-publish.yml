# Separate workflow: a new main push can cancel builds, never public feed writes.
name: release-publish
on:
  workflow_dispatch:
    inputs:
      platform:
        required: true
        type: string
      run_id:
        required: true
        type: string
      attempt:
        description: 'Publication attempt for this build; set only by the bounded retry (#1559)'
        required: false
        default: '1'
# Also shares the unified stable promotion's lock. Publication is short and
# serialized across platforms; compilation uses independent cancellable groups.
concurrency:
  group: okilum-macos-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: publish
    container:
      image: archlinux:base-devel@sha256:51dd3d24f7fba779e7c471caeee7804c50e8c134ad948e19685a1c83a42facc3
    timeout-minutes: 20
    steps:
      - name: Install publication tools
        # openssl signs the GitHub App JWT for the Windows hosted-artifact fetch.
        run: pacman -Syu --noconfirm --needed nodejs git python ca-certificates openssl
      - name: Check out the exact source from the runner server
        shell: bash
        env:
          CHECKOUT_SHA: ${{ github.sha }}
          CHECKOUT_REPOSITORY: ${{ github.repository }}
          CHECKOUT_SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          if [[ ! "$CHECKOUT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Checkout source is not a full commit SHA: ${CHECKOUT_SHA:-<empty>}" >&2
            exit 1
          fi
          trap 'echo "::error::Source checkout failed at line $LINENO (exit $?)" >&2' ERR
          echo "Checking out exact source $CHECKOUT_SHA from runner origin"
          : "${CHECKOUT_SERVER_URL:?}" "${CHECKOUT_REPOSITORY:?}"
          [ -d .git ] || git init -q .
          git remote remove origin 2>/dev/null || true
          git remote add origin "${CHECKOUT_SERVER_URL%/}/${CHECKOUT_REPOSITORY}.git"
          # Keep origin/main and complete ancestry for source/provenance checks.
          shallow=()
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then shallow=(--unshallow); fi
          git fetch -q --force --prune --tags "${shallow[@]}" origin '+refs/heads/*:refs/remotes/origin/*' "$CHECKOUT_SHA"
          git checkout -q -f --detach "$CHECKOUT_SHA"
          git clean -q -ffdx
          test "$(git rev-parse HEAD)" = "$CHECKOUT_SHA"

      - name: Publish only a complete current-main build
        env:
          PLATFORM: ${{ inputs.platform }}
          SOURCE_RUN: ${{ inputs.run_id }}
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGEJO_URL: ${{ github.server_url }}
          ARCH_GPG_PRIVATE_KEY: ${{ secrets.ARCH_GPG_PRIVATE_KEY }}
          ARCH_GPG_FINGERPRINT: ${{ vars.ARCH_GPG_FINGERPRINT }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          # Read-only use: a Windows beta receipt names a hosted GitHub artifact,
          # fetched and re-verified here (scripts/releases/windows_handoff.py).
          MIRROR_TOKEN: ${{ secrets.OKILUM_GITHUB_MIRROR }}
          OKILUM_GITHUB_APP_ID: ${{ secrets.OKILUM_GITHUB_APP_ID }}
          OKILUM_GITHUB_APP_INSTALLATION_ID: ${{ secrets.OKILUM_GITHUB_APP_INSTALLATION_ID }}
          OKILUM_GITHUB_APP_KEY: ${{ secrets.OKILUM_GITHUB_APP_KEY }}
        run: if [ "$PLATFORM" = appimage ]; then python scripts/releases/appimage_handoff.py publish --run "$SOURCE_RUN"; else python scripts/releases/publication.py publish "$PLATFORM" --run "$SOURCE_RUN"; fi

  # Its own job: a failed refresh is visible but never re-runs a publication
  # that already succeeded (only a failed publish job is retried, #1559).
  refresh:
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: bridge
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Check out the exact source from the runner server
        shell: bash
        env:
          CHECKOUT_SHA: ${{ github.sha }}
          CHECKOUT_REPOSITORY: ${{ github.repository }}
          CHECKOUT_SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          if [[ ! "$CHECKOUT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Checkout source is not a full commit SHA: ${CHECKOUT_SHA:-<empty>}" >&2
            exit 1
          fi
          trap 'echo "::error::Source checkout failed at line $LINENO (exit $?)" >&2' ERR
          echo "Checking out exact source $CHECKOUT_SHA from runner origin"
          : "${CHECKOUT_SERVER_URL:?}" "${CHECKOUT_REPOSITORY:?}"
          [ -d .git ] || git init -q .
          git remote remove origin 2>/dev/null || true
          git remote add origin "${CHECKOUT_SERVER_URL%/}/${CHECKOUT_REPOSITORY}.git"
          # Keep origin/main and complete ancestry for source/provenance checks.
          shallow=()
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then shallow=(--unshallow); fi
          git fetch -q --force --prune --tags "${shallow[@]}" origin '+refs/heads/*:refs/remotes/origin/*' "$CHECKOUT_SHA"
          git checkout -q -f --detach "$CHECKOUT_SHA"
          git clean -q -ffdx
          test "$(git rev-parse HEAD)" = "$CHECKOUT_SHA"

      - name: Refresh GitHub rolling Beta after platform publication
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGEJO_URL: ${{ github.server_url }}
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'scripts/updater')
          from release import Forgejo
          Forgejo().call('POST', '/actions/workflows/releases.yml/dispatches',
                         {'ref': 'main', 'inputs': {}})
          PY

  # A failed publication of a completed build is re-dispatched from the same
  # artifacts (reuse, no rebuild), at most 3 attempts in all; the last failure
  # turns red and records itself, with the actual feed state, in the "Beta
  # publication failed" issue (#1559). A Mac publication resumes an attempt
  # that stopped part-way. A successful, cancelled or skipped publication, and
  # a failed refresh job, are never retried.
  retry:
    needs: publish
    if: always() && github.ref == 'refs/heads/main' && needs.publish.result == 'failure'
    runs-on: bridge
    timeout-minutes: 8
    permissions:
      actions: write
      contents: read
      issues: write
    steps:
      - name: Check out the exact source from the runner server
        shell: bash
        env:
          CHECKOUT_SHA: ${{ github.sha }}
          CHECKOUT_REPOSITORY: ${{ github.repository }}
          CHECKOUT_SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          if [[ ! "$CHECKOUT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Checkout source is not a full commit SHA: ${CHECKOUT_SHA:-<empty>}" >&2
            exit 1
          fi
          trap 'echo "::error::Source checkout failed at line $LINENO (exit $?)" >&2' ERR
          echo "Checking out exact source $CHECKOUT_SHA from runner origin"
          : "${CHECKOUT_SERVER_URL:?}" "${CHECKOUT_REPOSITORY:?}"
          [ -d .git ] || git init -q .
          git remote remove origin 2>/dev/null || true
          git remote add origin "${CHECKOUT_SERVER_URL%/}/${CHECKOUT_REPOSITORY}.git"
          # Keep origin/main and complete ancestry for source/provenance checks.
          shallow=()
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then shallow=(--unshallow); fi
          git fetch -q --force --prune --tags "${shallow[@]}" origin '+refs/heads/*:refs/remotes/origin/*' "$CHECKOUT_SHA"
          git checkout -q -f --detach "$CHECKOUT_SHA"
          git clean -q -ffdx
          test "$(git rev-parse HEAD)" = "$CHECKOUT_SHA"

      - name: Re-dispatch the failed publication of the same build
        env:
          PLATFORM: ${{ inputs.platform }}
          SOURCE_RUN: ${{ inputs.run_id }}
          ATTEMPT: ${{ inputs.attempt || '1' }}
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGEJO_URL: ${{ github.server_url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
        run: python3 scripts/releases/publication.py retry "$PLATFORM" --run "$SOURCE_RUN" --attempt "$ATTEMPT"
