name: live-preview-regressions
on:
  pull_request:
    paths:
      - 'crates/okilum-core/src/source_classifier*'
      - 'crates/okilum-core/src/source_classifier/**'
      - 'crates/okilum-core/src/source_projection*'
      - 'crates/okilum-core/src/source_projection/**'
      - 'crates/okilum-shell/src/source_presentation*'
      - 'crates/okilum-shell/src/source_presentation/**'
      - 'crates/okilum-shell/src/reader_editor*'
      - 'crates/okilum-shell/src/reader_editor/**'
      - 'scripts/patches/**'
      - 'scripts/ci/live-preview-tests.sh'
      - '.forgejo/workflows/live-preview-regressions.yml'
  workflow_dispatch:
concurrency:
  group: live-preview-regressions-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Dedicated baldr fast-only runner: capacity 4, four independent warm targets.
    runs-on: fast-linux
    timeout-minutes: 45
    env:
      OKILUM_LIVE_PREVIEW_TESTS: "1"
      OKILUM_FAST_SLOT_WAIT_SECONDS: "240"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      SCCACHE_BUCKET: ${{ vars.SCCACHE_BUCKET }}
      SCCACHE_ENDPOINT: ${{ vars.SCCACHE_ENDPOINT }}
      SCCACHE_REGION: ${{ vars.SCCACHE_REGION }}
      SCCACHE_S3_USE_SSL: "false"
      SCCACHE_S3_KEY_PREFIX: rust
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare local Linux toolchain
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          packages=(build-essential cmake pkg-config curl git mold zstd
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev
            libfontconfig-dev libfreetype-dev libxcb1-dev)
          if ! dpkg-query -W -f='${Status}\n' "${packages[@]}" 2>/dev/null | grep -vFx 'install ok installed' | grep -q . &&
             dpkg-query -W "${packages[@]}" >/dev/null 2>&1; then
            echo 'Local build dependencies already installed'
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends "${packages[@]}"
          fi
          test -x "$HOME/.cargo/bin/cargo"
          # Resolve/install the pinned toolchain before the bounded sccache probe.
          cargo --version
          rustc --version
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build Linux desktop and run Live Preview regression suites
        env:
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          bash scripts/ci/fast-local.sh
