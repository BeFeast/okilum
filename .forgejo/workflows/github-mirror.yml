# Mirror main (and release tags created from now on) to the public GitHub repository.
# Forgejo stays primary; this workflow mirrors only main and release tags.
# ci.yml separately publishes temporary trusted PR refs for the native gate.
name: github-mirror

on:
  push:
    branches: [main]
    tags: ["v0.1.*", "beta"]

concurrency:
  group: github-mirror
  cancel-in-progress: false

jobs:
  push:
    runs-on: light
    timeout-minutes: 10
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Push main and the selected release tag to GitHub
        env:
          MIRROR_TOKEN: ${{ secrets.TESSERA_GITHUB_MIRROR }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: bash scripts/releases/mirror.sh
