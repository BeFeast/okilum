name: windows-release

on:
  pull_request:
    paths:
      - 'scripts/windows/**'
      - 'scripts/windows-*.py'
      - 'scripts/build-windows-ci.sh'
      - 'packaging/**'
      - 'scripts/releases/**'
      - '.forgejo/workflows/windows-diagnostic.yml'
  # Fixed hourly window; the runner is free between ticks. Manual build now bypasses it.
  schedule:
    - cron: "0 * * * *"
  # Build any PR branch manually when shared dependencies need release validation.
  workflow_dispatch:

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  select:
    runs-on: ${{ github.event_name == 'pull_request' && 'light' || 'publish' }}
    timeout-minutes: 3
    outputs:
      build: ${{ steps.select.outputs.build }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select hourly or manual build
        id: select
        run: python3 scripts/releases/coalesce.py windows

  release:
    needs: select
    if: needs.select.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SCCACHE_BUCKET: ${{ vars.SCCACHE_BUCKET }}
      SCCACHE_ENDPOINT: ${{ vars.SCCACHE_ENDPOINT }}
      SCCACHE_REGION: ${{ vars.SCCACHE_REGION }}
      SCCACHE_S3_USE_SSL: "false"
      SCCACHE_S3_KEY_PREFIX: rust
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "4"
      XWIN_CACHE_DIR: ${{ github.workspace }}/target/xwin
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install cross-build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends clang lld llvm curl git python3-venv libcairo2
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          "$HOME/.cargo/bin/rustup" target add x86_64-pc-windows-msvc
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          python3 -m venv "$RUNNER_TEMP/icon-env"
          "$RUNNER_TEMP/icon-env/bin/pip" install CairoSVG==2.8.2
          echo "$RUNNER_TEMP/icon-env/bin" >> "$GITHUB_PATH"
          curl -fsSL https://github.com/rust-cross/cargo-xwin/releases/download/v0.23.1/cargo-xwin-v0.23.1.x86_64-unknown-linux-musl.tar.gz -o "$RUNNER_TEMP/cargo-xwin.tgz"
          echo "c492c6dfb7e5ac0eee586b796e0fc950ba13077e7f0bbb046f445d71790d5360  $RUNNER_TEMP/cargo-xwin.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/cargo-xwin.tgz" -C "$HOME/.cargo/bin"
      - name: Restore cross-build downloads
        uses: https://code.forgejo.org/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/xwin/
            vendor/gpui-component/
          key: tessera-windows-downloads-v1-${{ hashFiles('Cargo.lock', 'scripts/vendor-setup.sh', 'scripts/patches/*.diff', '.forgejo/workflows/windows-diagnostic.yml') }}
      - name: Prepare pinned vendor
        run: |
          scripts/vendor-setup.sh
          scripts/vendor-setup.sh --verify
      - name: Cross-compile Reader and install packager
        run: |
          export TESSERA_BUILD_VERSION="$((5000 + GITHUB_RUN_NUMBER))"
          export TESSERA_RELEASE_VERSION="0.1.$TESSERA_BUILD_VERSION"
          bash scripts/build-windows-ci.sh
          bash scripts/windows/install-vpk.sh "$RUNNER_TEMP/velopack"

      - name: Restore previous beta package for delta
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python3 scripts/windows/publish.py prepare --directory target/windows-release

      - name: Package Windows installer and update feed on Linux
        run: |
          export TESSERA_RELEASE_VERSION="0.1.$((5000 + GITHUB_RUN_NUMBER))"
          bash scripts/windows/pack.sh "$RUNNER_TEMP/velopack" target/windows-dist target/windows-release
          python3 -m unittest discover -s scripts/windows -p 'test_*.py'

      - name: Upload unsigned installer for Windows QA
        uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: tessera-windows-velopack
          path: target/windows-release/*
          retention-days: 30

      - name: Stage portable archive for publication
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: windows-portable
          path: target/windows-dist/tessera-*-x86_64.zip
          retention-days: 7

      - name: Dispatch protected publication
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGEJO_URL: ${{ github.server_url }}
        run: python3 scripts/releases/publication.py dispatch windows
