# Beta on every main push for the exact pushed commit (Oleg 05.11; no cron, no
# certification gate). Push builds stay unsigned; daily re-sign is unchanged.
name: windows-release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      hourly_source:
        description: 'Internal source-pinned retry of a manual run; newest first-parent main source'
        required: false
        default: ''
      cache-benchmark:
        description: 'Measure cold/warm SDK setup on this runner before building'
        type: boolean
        default: false
      source:
        description: 'Older main commit to build for the archive (#1040); empty builds the branch tip'
        required: false
        default: ''
      resign_build:
        description: 'With source: re-sign this existing Windows build of that commit (no compile; needs an open SimplySign session)'
        required: false
        default: ''

# A newer main push never cancels a running beta of an older commit; a queued
# stale push run skips in select.
# Manual, pinned, archive and re-sign dispatches keep their own groups and finish.
concurrency:
  group: windows-beta-${{ github.event_name == 'push' && 'main' || inputs.hourly_source || github.run_id }}
  # A running beta always finishes (manager 13.11). Forgejo queues this group
  # FIFO and never replaces a pending run, so the push run that starts cancels
  # older queued push runs and keeps the newest (hourly_beta.coalesce_queued_pushes);
  # a stale push run that starts anyway skips in select because main moved on.
  cancel-in-progress: false

jobs:
  select:
    runs-on: ${{ github.event_name == 'pull_request' && 'light' || 'publish' }}
    timeout-minutes: 3
    outputs:
      build: ${{ steps.select.outputs.build }}
      source: ${{ steps.select.outputs.source }}
      resign: ${{ steps.select.outputs.resign }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.source != '' && '0' || '1' }}
          persist-credentials: false
      - name: Select pushed or manual build
        id: select
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGEJO_URL: ${{ github.server_url }}
          HOURLY_SOURCE: ${{ inputs.hourly_source }}
          OKILUM_SOURCE: ${{ inputs.source }}
          OKILUM_RESIGN_BUILD: ${{ inputs.resign_build }}
        run: python3 scripts/releases/coalesce.py windows

  release:
    needs: select
    if: needs.select.outputs.build == 'true' && needs.select.outputs.resign == '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || vars.OKILUM_PR_LANE == 'local')
    # GitHub cross-compiles and, unless the signer packs, packs with Velopack
    # (.github/workflows/forgejo-windows-release.yml `windows-beta`, #2927); this
    # bridge waiter compiles nothing. Okilum left baldr's ubuntu-latest runner
    # (Oleg 14.11). The Forgejo build number 5000 + run_number travels in the
    # dispatch, so the package, the artifacts below and publication are unchanged.
    runs-on: bridge
    # Within the primary bridge runner's 60 min ceiling (docs/fast-runner.md).
    timeout-minutes: 60
    outputs:
      signed: ${{ steps.signing.outputs.on }}
    steps:
      # Orchestration always comes from this workflow commit (github.sha); only
      # the product source is pinned. An explicit older main commit (#1040) or a
      # pinned retry predates the hosted handoff, so it is never checked out here.
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # Main builds are signed on the windows-signer runner once OKILUM_WINDOWS_SIGN_BACKEND
      # is set (#1104); pull requests and an unset variable keep the unsigned path below.
      # The signer must also be known ready: maestro's heartbeat (main-red-poller's sibling,
      # windows-signer-heartbeat) stamps OKILUM_WINDOWS_SIGNER_READY every 5 minutes while
      # the runner is up and the SimplySign session presents the pinned certificate. A stale
      # stamp keeps this build on the unsigned path at once instead of queueing for a signer.
      - name: Decide signing
        id: signing
        env:
          BACKEND: ${{ github.event_name == 'workflow_dispatch' && inputs.hourly_source == '' && vars.OKILUM_WINDOWS_SIGN_BACKEND || '' }}
          READY: ${{ vars.OKILUM_WINDOWS_SIGNER_READY }}
        run: |
          on=false
          if [ -n "$BACKEND" ] && [ "$GITHUB_REF" = refs/heads/main ] && [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            age=$(( $(date +%s) - ${READY:-0} ))
            if [ "${READY:-0}" -gt 0 ] && [ "$age" -lt 900 ]; then on=true; else echo "Signer not ready (heartbeat ${age}s old): unsigned"; fi
          fi
          echo "on=$on" >> "$GITHUB_OUTPUT"
          echo "Windows signing on the signer runner: $on"

      - name: Build on GitHub and stage the payload or package
        env:
          # A push builds its own commit; an explicit older main commit (#1040)
          # or a pinned retry builds the source selected above.
          PRODUCT_SOURCE: ${{ (inputs.source != '' || inputs.hourly_source != '') && needs.select.outputs.source || github.sha }}
          MIRROR_TOKEN: ${{ secrets.OKILUM_GITHUB_MIRROR }}
          OKILUM_GITHUB_APP_ID: ${{ secrets.OKILUM_GITHUB_APP_ID }}
          OKILUM_GITHUB_APP_INSTALLATION_ID: ${{ secrets.OKILUM_GITHUB_APP_INSTALLATION_ID }}
          OKILUM_GITHUB_APP_KEY: ${{ secrets.OKILUM_GITHUB_APP_KEY }}
          # Embedded by the build (the Sync sidecar's Authenticode policy); not secrets.
          OKILUM_WINDOWS_SIGN_SUBJECT: ${{ vars.OKILUM_WINDOWS_SIGN_SUBJECT }}
          OKILUM_WINDOWS_SIGN_ISSUER_CHAIN: ${{ vars.OKILUM_WINDOWS_SIGN_ISSUER_CHAIN }}
          SIGNED: ${{ steps.signing.outputs.on }}
          ARCHIVE: ${{ inputs.source != '' }}
        timeout-minutes: 56
        # Signed: the signer packs (payload only). A main beta is packed with a delta;
        # an explicit older commit is archived, not appended to the delta chain.
        run: |
          set -euo pipefail
          tooling=$(git rev-parse HEAD)
          test "$tooling" = "$GITHUB_SHA"
          python3 scripts/releases/windows_handoff.py run --source "$PRODUCT_SOURCE" --tooling "$tooling" \
            --build "$((5000 + GITHUB_RUN_NUMBER))" --signed "$SIGNED" --archive "$ARCHIVE" \
            --directory target --budget 3180

      - name: Hand the unsigned payload to the signer
        if: steps.signing.outputs.on == 'true'
        uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: windows-payload
          path: target/windows-dist/
          retention-days: 1

      - name: Upload unsigned installer for Windows QA
        if: steps.signing.outputs.on != 'true'
        uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: okilum-windows-velopack
          path: target/windows-release/*
          retention-days: 30

      - name: Stage portable archive for publication
        if: steps.signing.outputs.on != 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: windows-portable
          path: target/windows-dist/okilum-*-x86_64.zip
          retention-days: 7

      - name: Dispatch protected publication
        if: steps.signing.outputs.on != 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGEJO_URL: ${{ github.server_url }}
        run: python3 scripts/releases/publication.py dispatch windows

  # Re-sign (#1104): stage the exact payload of an already published build (from its full
  # package) for the package job, so a stable candidate built unsigned is signed in minutes
  # once the owner opens a SimplySign session. Refuses when the signer is not ready.
  resign:
    needs: select
    if: needs.select.outputs.build == 'true' && needs.select.outputs.resign != ''
    runs-on: publish
    timeout-minutes: 10
    outputs:
      signed: 'true'
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.source }}
          persist-credentials: false
      - name: Require an open signing session
        # certum-ssign: okilum-sign-code opened the session; sign.sh --probe checks it is fresh.
        if: vars.OKILUM_WINDOWS_SIGN_BACKEND != 'certum-ssign'
        env:
          READY: ${{ vars.OKILUM_WINDOWS_SIGNER_READY }}
        run: |
          age=$(( $(date +%s) - ${READY:-0} ))
          if [ "${READY:-0}" -eq 0 ] || [ "$age" -ge 900 ]; then
            echo "Signer not ready (heartbeat ${age}s old): log in to SimplySign first, wait for the heartbeat, rerun" >&2
            exit 1
          fi
      - name: Stage the payload of build ${{ needs.select.outputs.resign }}
        run: |
          python3 scripts/windows/payload-from-release.py target/windows-dist "0.1.${{ needs.select.outputs.resign }}"
          # The portable ZIP carries the diagnostic README; the package's copy is the delivery one.
          cp docs/windows-diagnostic.md target/windows-dist/README.md
      - name: Hand the payload to the signer
        uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: windows-payload
          path: target/windows-dist/
          retention-days: 1

  # Signed main build (#1104): the payload from `release` is signed, packaged, verified and
  # handed to publication here. Only main reaches this runner; sign.sh refuses pull requests.
  package:
    needs: [select, release, resign]
    if: always() && (needs.release.outputs.signed == 'true' || needs.resign.result == 'success')
    runs-on: windows-signer
    # The signer runner has capacity 1, so signing jobs never overlap. Signing takes about a
    # minute; the timeouts in sign.sh fall back to an unsigned beta well before this limit.
    timeout-minutes: 20
    env:
      OKILUM_WINDOWS_SIGN_BACKEND: ${{ vars.OKILUM_WINDOWS_SIGN_BACKEND }}
      OKILUM_WINDOWS_SIGN_PKCS11_CFG: /etc/okilum-signer/simplysign-pkcs11.cfg
      OKILUM_WINDOWS_SIGN_ALIAS: ${{ vars.OKILUM_WINDOWS_SIGN_ALIAS }}
      OKILUM_WINDOWS_SIGN_CERT_SHA256: ${{ vars.OKILUM_WINDOWS_SIGN_CERT_SHA256 }}
      OKILUM_WINDOWS_SIGN_SUBJECT: ${{ vars.OKILUM_WINDOWS_SIGN_SUBJECT }}
      # certum-ssign: the account e-mail; the session comes from okilum-sign-code (Oleg's code).
      CERTUM_EMAIL: ${{ vars.OKILUM_CERTUM_EMAIL }}
      # A re-sign exists only to sign: without a key it fails instead of republishing unsigned.
      OKILUM_WINDOWS_UNSIGNED_POLICY: ${{ needs.select.outputs.resign != '' && 'fail' || vars.OKILUM_WINDOWS_UNSIGNED_POLICY }}
      DOTNET_SYSTEM_GLOBALIZATION_INVARIANT: "1"
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          # A re-sign packages with this workflow's scripts (the signer backends evolve); its
          # payload and recorded source are those of the build being re-signed.
          ref: ${{ needs.select.outputs.resign == '' && needs.select.outputs.source || '' }}
          persist-credentials: false
      - name: Receive the unsigned payload
        uses: https://code.forgejo.org/actions/download-artifact@v3
        with:
          name: windows-payload
          path: target/windows-dist
      - name: Restore previous beta package for delta
        if: inputs.source == ''
        env:
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python3 scripts/windows/publish.py prepare --directory target/windows-release
      - name: Sign, package and verify
        env:
          RESIGN_SOURCE: ${{ needs.select.outputs.resign != '' && needs.select.outputs.source || '' }}
        run: |
          export OKILUM_RELEASE_VERSION="0.1.$((5000 + GITHUB_RUN_NUMBER))"
          cat /etc/ssl/certs/ca-certificates.crt scripts/windows/certs/certum-code-signing-2021-ca.pem > "$RUNNER_TEMP/ca.pem"
          export OKILUM_WINDOWS_SIGN_CA_FILE="$RUNNER_TEMP/ca.pem"
          # certum-ssign: the session okilum-sign-code opened on this signer (tmpfs, owner-only).
          export XDG_RUNTIME_DIR=/run/okilum-ssign
          bash scripts/windows/install-vpk.sh "$RUNNER_TEMP/velopack" >/dev/null
          bash scripts/windows/package-release.sh "$RUNNER_TEMP/velopack" target/windows-dist target/windows-release
          if [ -n "${RESIGN_SOURCE}" ]; then
            echo "$RESIGN_SOURCE" > target/windows-release/release-source.txt
          else
            git rev-parse HEAD > target/windows-release/release-source.txt
          fi
          python3 -m unittest discover -s scripts/windows -p 'test_*.py'
      - name: Upload installer for Windows QA
        uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: okilum-windows-velopack
          path: target/windows-release/*
          retention-days: 30
      - name: Stage portable archive for publication
        uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: windows-portable
          path: target/windows-dist/okilum-*-x86_64.zip
          retention-days: 7
      - name: Dispatch protected publication
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGEJO_URL: ${{ github.server_url }}
        run: python3 scripts/releases/publication.py dispatch windows

  windows-release-github:
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.OKILUM_PR_LANE != 'local'
    runs-on: bridge
    timeout-minutes: 125
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Wait for exact-head hosted windows-release
        env:
          MIRROR_TOKEN: ${{ secrets.OKILUM_GITHUB_MIRROR }}
          OKILUM_GITHUB_APP_ID: ${{ secrets.OKILUM_GITHUB_APP_ID }}
          OKILUM_GITHUB_APP_INSTALLATION_ID: ${{ secrets.OKILUM_GITHUB_APP_INSTALLATION_ID }}
          OKILUM_GITHUB_APP_KEY: ${{ secrets.OKILUM_GITHUB_APP_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_LANE: windows-release
        run: python3 scripts/ci/github-pr.py

  shipping-status:
    needs: [select, release, resign, package, windows-release-github]
    # Push runs get native `windows-release / <job> (push)` statuses on their own commit.
    if: always() && needs.select.outputs.build == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: bridge
    timeout-minutes: 2
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Keep Stable selector contexts on the beta source commit
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGEJO_URL: ${{ github.server_url }}
          SOURCE: ${{ needs.select.outputs.source }}
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/releases/hourly_beta.py shipping-status windows
