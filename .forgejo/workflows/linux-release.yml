name: linux-release
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'scripts/arch/**'
      - 'packaging/**'
      - 'scripts/ci/release-cache.sh'
      - 'scripts/releases/**'
      - 'scripts/vendor-setup.sh'
      - 'scripts/patches/**'
      - 'scripts/brand-assets.py'
      - 'scripts/third-party-notices.py'
      - 'rust-toolchain.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/*/Cargo.toml'
      - 'crates/tessera-shell/build.rs'
      - 'crates/tessera-shell/assets/brand/**'
      - '.forgejo/workflows/linux-release.yml'
  workflow_dispatch:

concurrency:
  group: tessera-arch-build-${{ github.ref }}
  # Finish useful work even while main keeps advancing. Publication is monotonic.
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel@sha256:51dd3d24f7fba779e7c471caeee7804c50e8c134ad948e19685a1c83a42facc3
    timeout-minutes: 90
    env:
      SCCACHE_BUCKET: ${{ vars.SCCACHE_BUCKET }}
      SCCACHE_ENDPOINT: ${{ vars.SCCACHE_ENDPOINT }}
      SCCACHE_REGION: ${{ vars.SCCACHE_REGION }}
      SCCACHE_S3_USE_SSL: "false"
      SCCACHE_S3_KEY_PREFIX: rust
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
    steps:
      - name: Install Arch build and packaging tools
        run: |
          pacman -Syu --noconfirm --needed nodejs git python curl cmake clang mold \
            wayland libxkbcommon libxkbcommon-x11 fontconfig freetype2 libxcb \
            vulkan-icd-loader desktop-file-utils xorg-server-xvfb xorg-xauth xdotool vulkan-swrast dbus
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare build user
        run: useradd -m builder
      - name: Restore dependency downloads and pinned vendor
        uses: https://code.forgejo.org/actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            /home/builder/.cargo/registry/
            /home/builder/.cargo/git/
            vendor/gpui-component/
          key: tessera-arch-downloads-v1-${{ hashFiles('Cargo.lock', 'scripts/vendor-setup.sh', 'scripts/patches/*.diff') }}
      - name: Build package as an unprivileged user
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE" /home/builder
          # Only branch dispatch artifacts may contain the visual QA harness.
          harness=0
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            harness=1
          fi
          runuser -u builder -- env TESSERA_SETTINGS_UI_HARNESS="$harness" TESSERA_BUILD_VERSION="$((5000 + GITHUB_RUN_NUMBER))" bash scripts/arch/build.sh
      - name: Validate package and install without changing MIME defaults
        run: |
          desktop-file-validate scripts/arch/tessera.desktop
          pacman -U --noconfirm dist/arch/tessera-*.pkg.tar.zst
          tessera --help
          if ldd /usr/bin/tessera | grep 'not found'; then exit 1; fi
          python -m unittest discover -s scripts/arch -p 'test_*.py'
          xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/arch/smoke-x11.sh
      - uses: https://code.forgejo.org/actions/upload-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: arch-publication
          path: dist/arch/*.pkg.tar.zst
          retention-days: 7

      # Preview artifacts let native QA inspect UI before merge. They never
      # enter the protected publisher or any public update feed.
      - uses: https://code.forgejo.org/actions/upload-artifact@v3
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        with:
          name: arch-qa
          path: dist/arch/*.pkg.tar.zst
          retention-days: 7

      - name: Dispatch protected publication
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGEJO_URL: ${{ github.server_url }}
        run: python3 scripts/releases/publication.py dispatch linux
