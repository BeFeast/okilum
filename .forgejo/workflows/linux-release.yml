# Beta on every main push for the exact pushed commit (Oleg 05.11); no cron and
# no certification gate. Stable still requires shell-full on its exact source.
name: linux-release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      hourly_source:
        description: 'Internal source-pinned retry of a manual run; newest first-parent main source'
        required: false
        default: ''
      appimage_only:
        description: 'Reuse accepted source-pinned AppImage for beta; skip Arch compilation'
        required: false
        default: 'false'
      source:
        description: 'Older main commit to build for the archive (#1040); empty builds the branch tip'
        required: false
        default: ''

concurrency:
  # Every push run has its own group, keyed by its commit: a merge starts its beta
  # at once instead of queueing behind the previous merge's whole run (measured
  # 14.11: up to 23 min of queue on top of the build). Forgejo evaluates this
  # block before the run exists, so github.run_id is empty here
  # (services/actions/context.go generateGiteaContextForRun, RunID: ""); a group
  # keyed on it put every push run back into one FIFO `linux-beta-` group after
  # #2934. github.sha is set. A running beta still always finishes (manager
  # 13.11): nothing cancels it. Its exact-source GitHub producer runs in its own
  # per-ref group, a push run that starts after main moved on skips in select,
  # and release-publish serializes feed writes, filing an older build as
  # archive-only. Pinned retries share the push group of their source; other
  # dispatches keep their previous (shared) group and always finish.
  group: linux-beta-${{ github.event_name == 'push' && github.sha || inputs.hourly_source || github.run_id }}
  cancel-in-progress: false

jobs:
  select:
    runs-on: bridge
    timeout-minutes: 3
    outputs:
      build: ${{ steps.select.outputs.build }}
      source: ${{ steps.select.outputs.source }}
      arch: ${{ steps.freeze.outputs.arch }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.source != '' && '0' || '1' }}
          persist-credentials: false
      - name: Read durable pacman freeze marker
        id: freeze
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -A curl --max-time 30 -o "$RUNNER_TEMP/pacman-freeze.json" -w '%{http_code}' https://updates.befeast.com/okilum/arch/frozen.json)
          case "$status" in
            404) echo 'arch=true' >> "$GITHUB_OUTPUT" ;;
            200) python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d["state"] == "frozen" and d["build"] > 0' "$RUNNER_TEMP/pacman-freeze.json"; echo 'arch=false' >> "$GITHUB_OUTPUT" ;;
            *) echo "Cannot inspect pacman freeze marker: HTTP $status" >&2; exit 1 ;;
          esac
      - name: Select pushed or manual build
        id: select
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGEJO_URL: ${{ github.server_url }}
          HOURLY_SOURCE: ${{ inputs.hourly_source }}
          OKILUM_SOURCE: ${{ inputs.source }}
          APPIMAGE_ONLY: ${{ inputs.appimage_only }}
        run: |
          if [ "$APPIMAGE_ONLY" = true ]; then
            python3 - <<'PYSELECT'
          import os, sys
          sys.path.insert(0, 'scripts/releases')
          from coalesce import explicit_source
          source = explicit_source(os.environ['OKILUM_SOURCE'], 'linux', os.environ['GITHUB_REF'], os.environ['GITHUB_EVENT_NAME'])
          if source is None:
              raise ValueError('AppImage-only dispatch requires an explicit main source')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'build=true\nsource={source}\n')
          PYSELECT
          else
            python3 scripts/releases/coalesce.py linux
          fi

  release:
    needs: select
    if: needs.select.outputs.arch != 'false' && inputs.appimage_only != 'true' && needs.select.outputs.build == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || vars.OKILUM_PR_LANE == 'local')
    # GitHub builds and validates the exact source (.github/workflows/forgejo-arch-release.yml,
    # #2927); this bridge waiter compiles nothing. Okilum left baldr's
    # ubuntu-latest runner (Oleg 14.11). The Forgejo build number 5000 +
    # run_number travels in the write-once ref, so the package, the
    # `arch-publication` artifact and release-publish's pkgver check are unchanged.
    runs-on: bridge
    # 53 min shared queue/run budget + push/cleanup, within the primary bridge
    # runner's 60 min ceiling (docs/fast-runner.md). Hosted builds take 13-31 min.
    timeout-minutes: 60
    steps:
      # Orchestration always comes from this workflow commit (github.sha); only
      # the product source is pinned. An explicit older main commit (#1040) or a
      # pinned retry predates the hosted handoff, so it is never checked out here.
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build and validate the Arch package on GitHub
        env:
          # A push builds its own commit; an explicit older main commit (#1040)
          # or a pinned retry builds the source selected above.
          PRODUCT_SOURCE: ${{ (inputs.source != '' || inputs.hourly_source != '') && needs.select.outputs.source || github.sha }}
          MIRROR_TOKEN: ${{ secrets.OKILUM_GITHUB_MIRROR }}
          OKILUM_GITHUB_APP_ID: ${{ secrets.OKILUM_GITHUB_APP_ID }}
          OKILUM_GITHUB_APP_INSTALLATION_ID: ${{ secrets.OKILUM_GITHUB_APP_INSTALLATION_ID }}
          OKILUM_GITHUB_APP_KEY: ${{ secrets.OKILUM_GITHUB_APP_KEY }}
        timeout-minutes: 56
        run: |
          set -euo pipefail
          # Only branch dispatch artifacts may contain the visual QA harness.
          harness=0
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            harness=1
          fi
          tooling=$(git rev-parse HEAD)
          test "$tooling" = "$GITHUB_SHA"
          python3 scripts/releases/arch_handoff.py run --source "$PRODUCT_SOURCE" --tooling "$tooling" \
            --build "$((5000 + GITHUB_RUN_NUMBER))" --harness "$harness" --directory dist/arch --budget 3180
      - uses: https://code.forgejo.org/actions/upload-artifact@v3
        if: needs.select.outputs.build == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: arch-publication
          path: |
            dist/arch/*.pkg.tar.zst
            dist/arch/release-source.txt
          retention-days: 7

      # Preview artifacts let native QA inspect UI before merge. They never
      # enter the protected publisher or any public update feed.
      - uses: https://code.forgejo.org/actions/upload-artifact@v3
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        with:
          name: arch-qa
          path: dist/arch/*.pkg.tar.zst
          retention-days: 7

  appimage-reuse:
    outputs:
      accepted: ${{ steps.reuse.outputs.accepted }}
    needs: select
    # Frozen or failed Arch never holds the AppImage beta of the same push.
    if: needs.select.outputs.build == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: bridge
    # Mirror wait (10m) + bounded producer wait (90m) + acceptance wait (15m) + setup.
    timeout-minutes: 120
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Request the exact-source GitHub AppImage producer
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && inputs.source == '' && inputs.appimage_only != 'true'
        env:
          MIRROR_TOKEN: ${{ secrets.OKILUM_GITHUB_MIRROR }}
          OKILUM_GITHUB_APP_ID: ${{ secrets.OKILUM_GITHUB_APP_ID }}
          OKILUM_GITHUB_APP_INSTALLATION_ID: ${{ secrets.OKILUM_GITHUB_APP_INSTALLATION_ID }}
          OKILUM_GITHUB_APP_KEY: ${{ secrets.OKILUM_GITHUB_APP_KEY }}
          SOURCE: ${{ needs.select.outputs.source }}
        run: python3 scripts/releases/hourly_beta.py dispatch-linux
      - name: Resolve accepted exact-source AppImage without compiling
        id: reuse
        env:
          MIRROR_TOKEN: ${{ secrets.OKILUM_GITHUB_MIRROR }}
          OKILUM_GITHUB_APP_ID: ${{ secrets.OKILUM_GITHUB_APP_ID }}
          OKILUM_GITHUB_APP_INSTALLATION_ID: ${{ secrets.OKILUM_GITHUB_APP_INSTALLATION_ID }}
          OKILUM_GITHUB_APP_KEY: ${{ secrets.OKILUM_GITHUB_APP_KEY }}
          SOURCE: ${{ needs.select.outputs.source }}
        run: python3 scripts/releases/appimage_handoff.py stage --source "$SOURCE" --directory dist/appimage-publication --wait-seconds 5400
      - uses: https://code.forgejo.org/actions/upload-artifact@v3
        if: steps.reuse.outputs.accepted == 'true'
        with:
          name: appimage-publication
          path: dist/appimage-publication/
          retention-days: 7
      # Beta gate: the bytes above were taken while the producer's Ubuntu/Fedora
      # smoke and disposable-key signing checks still ran. Publication (needs
      # this job's success) waits for both; a failure never reaches the feed.
      - name: Wait for the producer's Ubuntu/Fedora smoke and signing checks
        if: steps.reuse.outputs.accepted == 'true'
        env:
          MIRROR_TOKEN: ${{ secrets.OKILUM_GITHUB_MIRROR }}
          OKILUM_GITHUB_APP_ID: ${{ secrets.OKILUM_GITHUB_APP_ID }}
          OKILUM_GITHUB_APP_INSTALLATION_ID: ${{ secrets.OKILUM_GITHUB_APP_INSTALLATION_ID }}
          OKILUM_GITHUB_APP_KEY: ${{ secrets.OKILUM_GITHUB_APP_KEY }}
        run: python3 scripts/releases/appimage_handoff.py await-acceptance --directory dist/appimage-publication --wait-seconds 900

  appimage-publication:
    needs: [select, appimage-reuse]
    if: always() && needs.select.result == 'success' && needs.appimage-reuse.outputs.accepted == 'true' && needs.appimage-reuse.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: bridge
    timeout-minutes: 3
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Dispatch independent protected AppImage beta publication
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGEJO_URL: ${{ github.server_url }}
        run: python3 scripts/releases/appimage_handoff.py dispatch

  publication:
    needs: [select, release]
    if: needs.select.result == 'success' && needs.release.result == 'success' && inputs.appimage_only != 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: bridge
    timeout-minutes: 3
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Dispatch protected Arch publication after accepted Arch release
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGEJO_URL: ${{ github.server_url }}
        run: python3 scripts/releases/publication.py dispatch linux

  arch-github:
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.OKILUM_PR_LANE != 'local'
    runs-on: bridge
    timeout-minutes: 125
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Wait for exact-head hosted arch
        env:
          MIRROR_TOKEN: ${{ secrets.OKILUM_GITHUB_MIRROR }}
          OKILUM_GITHUB_APP_ID: ${{ secrets.OKILUM_GITHUB_APP_ID }}
          OKILUM_GITHUB_APP_INSTALLATION_ID: ${{ secrets.OKILUM_GITHUB_APP_INSTALLATION_ID }}
          OKILUM_GITHUB_APP_KEY: ${{ secrets.OKILUM_GITHUB_APP_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_LANE: arch
        run: python3 scripts/ci/github-pr.py

  shipping-status:
    needs: [select, appimage-reuse, appimage-publication]
    # Push runs get native `linux-release / <job> (push)` statuses on their own
    # commit; only a dispatch needs them reported on the beta source.
    if: always() && needs.select.outputs.build == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: bridge
    timeout-minutes: 2
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Keep Stable selector contexts on the beta source commit
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGEJO_URL: ${{ github.server_url }}
          SOURCE: ${{ needs.select.outputs.source }}
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/releases/hourly_beta.py shipping-status linux
