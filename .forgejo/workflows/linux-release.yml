name: linux-release
on:
  # Coalesce main updates; workflow_dispatch is the immediate build-now path.
  schedule:
    - cron: "*/30 * * * *"
  pull_request:
    paths:
      - 'scripts/arch/**'
      - 'packaging/**'
      - 'scripts/releases/**'
      - '.forgejo/workflows/linux-release.yml'
      - '.github/workflows/forgejo-arch.yml'
      - 'scripts/ci/github-pr.py'
  # Build any PR branch manually when shared dependencies need release validation.
  workflow_dispatch:
    inputs:
      source:
        description: 'Older main commit to build for the archive (#1040); empty builds the branch tip'
        required: false
        default: ''

concurrency:
  group: okilum-arch-build-${{ github.ref }}
  # Finish useful work even while main keeps advancing. Publication is monotonic.
  cancel-in-progress: false

jobs:
  select:
    runs-on: bridge
    timeout-minutes: 3
    outputs:
      build: ${{ steps.select.outputs.build }}
      source: ${{ steps.select.outputs.source }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: ${{ inputs.source != '' && '0' || '1' }}
          persist-credentials: false
      - name: Select half-hourly or manual build
        id: select
        env:
          OKILUM_SOURCE: ${{ inputs.source }}
        run: python3 scripts/releases/coalesce.py linux

  release:
    needs: select
    if: needs.select.outputs.build == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository || vars.OKILUM_PR_LANE == 'local')
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel@sha256:51dd3d24f7fba779e7c471caeee7804c50e8c134ad948e19685a1c83a42facc3
    timeout-minutes: 120
    steps:
      - name: Install Arch build and packaging tools
        run: |
          pacman -Syu --noconfirm --needed nodejs git python curl cmake clang mold \
            wayland libxkbcommon libxkbcommon-x11 fontconfig freetype2 libxcb \
            vulkan-icd-loader librsvg desktop-file-utils xorg-server-xvfb xorg-xauth xdotool vulkan-swrast dbus
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject unsupported selected consumer tooling before checkout
        env:
          OKILUM_SELECTED_SOURCE: ${{ needs.select.outputs.source }}
        run: python3 scripts/arch/select-source.py "$OKILUM_SELECTED_SOURCE"
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          # An explicit older main commit (#1040) or a scheduled tick (main tip, chosen by
          # select) sets the checkout; manual and pull-request runs keep the default ref.
          ref: ${{ (inputs.source != '' || github.event_name == 'schedule') && needs.select.outputs.source || '' }}
          persist-credentials: false
      - name: Prepare build user
        run: useradd -m builder
      - name: Resolve exact required-CI production bytes
        env:
          OKILUM_SELECTED_SOURCE: ${{ needs.select.outputs.source }}
          MIRROR_TOKEN: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.OKILUM_GITHUB_MIRROR || '' }}
        run: |
          export PR_HEAD_SHA="$(git rev-parse HEAD)"
          test "$PR_HEAD_SHA" = "$OKILUM_SELECTED_SOURCE"
          python3 scripts/ci/github-linux.py resolve
      - name: Build package as an unprivileged user
        run: |
          chown -R builder:builder "$GITHUB_WORKSPACE" /home/builder
          runuser -u builder -- env OKILUM_SETTINGS_UI_HARNESS=0 OKILUM_PREBUILT_DIR="$GITHUB_WORKSPACE/dist/linux-production" bash scripts/arch/build.sh
          # Publication distinguishes selected source from packaging run commit.
          runuser -u builder -- git -C "$GITHUB_WORKSPACE" rev-parse HEAD > dist/arch/release-source.txt
      - name: Validate package and install without changing MIME defaults
        run: |
          desktop-file-validate scripts/arch/okilum.desktop
          pacman -U --noconfirm dist/arch/okilum-*.pkg.tar.zst
          okilum --help
          if ldd /usr/bin/okilum | grep 'not found'; then exit 1; fi
          python -m unittest discover -s scripts/arch -p 'test_*.py'
          xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/arch/smoke-x11.sh
      - uses: https://code.forgejo.org/actions/upload-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: arch-publication
          path: |
            dist/arch/*.pkg.tar.zst
            dist/arch/*.pkg.tar.zst.sig
            dist/arch/release-source.txt
            dist/arch/production-receipt.json
          retention-days: 7

      # Preview artifacts let native QA inspect UI before merge. They never
      # enter the protected publisher or any public update feed.
      - uses: https://code.forgejo.org/actions/upload-artifact@v3
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        with:
          name: arch-qa
          path: dist/arch/*.pkg.tar.zst
          retention-days: 7

      - name: Dispatch protected publication
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGEJO_URL: ${{ github.server_url }}
        run: python3 scripts/releases/publication.py dispatch linux

  arch-github:
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && vars.OKILUM_PR_LANE != 'local'
    runs-on: bridge
    timeout-minutes: 125
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Wait for exact-head hosted arch
        env:
          MIRROR_TOKEN: ${{ secrets.OKILUM_GITHUB_MIRROR }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_LANE: arch
        run: python3 scripts/ci/github-pr.py
