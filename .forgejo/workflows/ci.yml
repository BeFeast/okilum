# Full acceptance: daily at 04:00 UTC (06:00 Israel in winter), before the
# 09:00 Stable (Oleg 13.11 evening). Since 14.11 Okilum compiles nothing on
# baldr or idunn: the shared and Linux gates run the exact source on GitHub's
# hosted runners through the bridge waiters below. No PR/main-push trigger.
name: ci

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Select scope before either compiler job so native CI need not queue behind Linux.
  native-scope:
    # This host coordinator must not execute scripts from untrusted forks.
    if: >-
      github.event_name != 'push' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: bridge
    timeout-minutes: 3
    outputs:
      macos: ${{ steps.native-scope.outputs.macos }}
      # Read once per run: OKILUM_MACOS_LANE flips at 03:05 and 09:00 Israel time, and
      # two jobs reading it minutes apart could both skip (PR #1214).
      macos_lane: ${{ steps.native-scope.outputs.macos_lane }}
    steps:
      - name: Check out the exact source from the runner server
        shell: bash
        env:
          CHECKOUT_SHA: ${{ github.sha }}
          CHECKOUT_REPOSITORY: ${{ github.repository }}
          CHECKOUT_SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          if [[ ! "$CHECKOUT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Checkout source is not a full commit SHA: ${CHECKOUT_SHA:-<empty>}" >&2
            exit 1
          fi
          trap 'echo "::error::Source checkout failed at line $LINENO (exit $?)" >&2' ERR
          echo "Checking out exact source $CHECKOUT_SHA from runner origin"
          : "${CHECKOUT_SERVER_URL:?}" "${CHECKOUT_REPOSITORY:?}"
          [ -d .git ] || git init -q .
          git remote remove origin 2>/dev/null || true
          git remote add origin "${CHECKOUT_SERVER_URL%/}/${CHECKOUT_REPOSITORY}.git"
          git fetch -q --no-tags --depth 1 origin "$CHECKOUT_SHA"
          git checkout -q -f --detach "$CHECKOUT_SHA"
          git clean -q -ffdx
          test "$(git rev-parse HEAD)" = "$CHECKOUT_SHA"
      - name: Select native PR check
        id: native-scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          FULL_EVENT: ${{ github.event_name }}
          FORGEJO_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          MACOS_LANE: ${{ vars.OKILUM_MACOS_LANE }}
        run: |
          set -euo pipefail
          # In the M4 window a PR uses the M4 only while it is idle, otherwise hosted (2026-10-11).
          echo "macos_lane=$(python3 scripts/ci/macos-lane.py)" >> "$GITHUB_OUTPUT"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if [ "$FULL_EVENT" != pull_request ]; then needed=true; else
            needed=$(git diff --name-only -z "$BASE_SHA" HEAD | python3 scripts/ci/macos-scope.py)
          fi
          echo "macos=$needed" >> "$GITHUB_OUTPUT"

  # Shared Rust crates are independently required. The GUI/platform/release lanes
  # below still run in full, but cannot hold up a Mac-first merge (#1489).
  shared-select:
    runs-on: bridge
    timeout-minutes: 3
    outputs:
      lane: ${{ steps.select.outputs.lane }}
      measure: ${{ steps.select.outputs.measure }}
    steps:
      - name: Select shared lane once
        id: select
        env:
          SHARED_LANE: ${{ vars.OKILUM_SHARED_LANE }}
          EVENT: ${{ github.event_name }}
          TRUSTED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          MEASURE_UNTIL: ${{ vars.OKILUM_SHARED_MEASURE_UNTIL }}
          MEASURE_FIRST_RUN: ${{ vars.OKILUM_SHARED_MEASURE_FIRST_RUN }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PYSELECT'
          import os, time
          # Hosted is the only shared lane: Okilum left baldr's heavy runner
          # (14.11). Untrusted code selects nothing and the shared gate fails.
          trusted = os.environ['TRUSTED'] == 'true'
          lane, measure = ('hosted' if trusted else 'none'), False
          if trusted and os.environ['EVENT'] in ('push', 'pull_request'):
              if os.environ['SHARED_LANE'] == 'measure':
                  try:
                      deadline = int(os.environ['MEASURE_UNTIL'])
                      first = int(os.environ['MEASURE_FIRST_RUN'])
                      current = int(os.environ['RUN_NUMBER'])
                      now = time.time()
                      measure = now < deadline <= now + 86400 and 0 < first <= current < first + 10
                  except ValueError:
                      pass
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'lane={lane}\nmeasure={str(measure).lower()}\n')
          print(f'Shared required lane={lane}; independent hosted measurement={measure}')
          PYSELECT

  shared-github:
    needs: [shared-select]
    if: needs.shared-select.outputs.lane == 'hosted'
    runs-on: bridge
    timeout-minutes: 100
    outputs:
      result: ${{ steps.remote.outputs.result }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Run exact shared source on GitHub
        id: remote
        env:
          MIRROR_TOKEN: ${{ secrets.OKILUM_GITHUB_MIRROR }}
          OKILUM_GITHUB_APP_ID: ${{ secrets.OKILUM_GITHUB_APP_ID }}
          OKILUM_GITHUB_APP_INSTALLATION_ID: ${{ secrets.OKILUM_GITHUB_APP_INSTALLATION_ID }}
          OKILUM_GITHUB_APP_KEY: ${{ secrets.OKILUM_GITHUB_APP_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.run_id }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_LANE: shared
        run: python3 scripts/ci/github-pr.py

  shared-measure:
    needs: [shared-select]
    if: needs.shared-select.outputs.measure == 'true'
    runs-on: bridge
    timeout-minutes: 100
    outputs:
      result: ${{ steps.remote.outputs.result }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Run exact shared source on GitHub
        id: remote
        env:
          MIRROR_TOKEN: ${{ secrets.OKILUM_GITHUB_MIRROR }}
          OKILUM_GITHUB_APP_ID: ${{ secrets.OKILUM_GITHUB_APP_ID }}
          OKILUM_GITHUB_APP_INSTALLATION_ID: ${{ secrets.OKILUM_GITHUB_APP_INSTALLATION_ID }}
          OKILUM_GITHUB_APP_KEY: ${{ secrets.OKILUM_GITHUB_APP_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.run_id }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_LANE: shared
        run: python3 scripts/ci/github-pr.py

  shared:
    needs: [shared-select, shared-github]
    if: always()
    runs-on: bridge
    timeout-minutes: 3
    steps:
      - name: Require selected shared gate
        env:
          SELECTION: ${{ needs.shared-select.result }}
          LANE: ${{ needs.shared-select.outputs.lane }}
          HOSTED_JOB: ${{ needs.shared-github.result }}
          HOSTED_RESULT: ${{ needs.shared-github.outputs.result }}
        run: |
          set -euo pipefail
          test "$SELECTION" = success
          test "$LANE" = hosted
          test "$HOSTED_JOB" = success
          test "$HOSTED_RESULT" = success

  # The only Linux lane: the full gate (check-linux.sh) runs on GitHub's hosted
  # runner (.github/workflows/forgejo-linux.yml). Okilum left baldr (14.11).
  linux-github:
    if: >-
      github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: bridge
    # Must exceed github-linux.py queue_timeout + run_timeout (15 + 90 min).
    timeout-minutes: 110
    outputs:
      result: ${{ steps.remote.outputs.result }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Run exact source on GitHub Linux
        id: remote
        env:
          MIRROR_TOKEN: ${{ secrets.OKILUM_GITHUB_MIRROR }}
          OKILUM_GITHUB_APP_ID: ${{ secrets.OKILUM_GITHUB_APP_ID }}
          OKILUM_GITHUB_APP_INSTALLATION_ID: ${{ secrets.OKILUM_GITHUB_APP_INSTALLATION_ID }}
          OKILUM_GITHUB_APP_KEY: ${{ secrets.OKILUM_GITHUB_APP_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.run_number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci/github-linux.py

  # A red main is reported to its suspects and to the "main is red" issue; a green
  # one closes that issue. Keyed on the Linux lane itself: a superseded run is
  # cancelled and leaves `check` failed or pending without saying anything.
  main-health:
    needs: [linux-github]
    if: >-
      always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      (needs.linux-github.result == 'success' || needs.linux-github.result == 'failure')
    runs-on: bridge
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # Main as it is now: a newer commit may already be green (runs finish out of order).
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 60
      - name: Report main health
        env:
          FORGEJO_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
          RUN_ID: ${{ github.run_id }}
        run: python3 scripts/ci/main-health.py ${{ needs.linux-github.result == 'success' && 'green' || 'red' }}

  # Preserve ci/linux and existing downstream required contexts.
  linux:
    needs: [linux-github]
    if: always()
    runs-on: bridge
    timeout-minutes: 2
    steps:
      - name: Require the successful hosted Linux lane
        env:
          HOSTED_JOB: ${{ needs.linux-github.result }}
          HOSTED_RESULT: ${{ needs.linux-github.outputs.result }}
        run: |
          set -euo pipefail
          if [ "$HOSTED_JOB" != success ] || [ "$HOSTED_RESULT" != success ]; then
            echo "Missing or failed hosted Linux result: job=$HOSTED_JOB result=$HOSTED_RESULT" >&2
            exit 1
          fi

  macos-github:
    needs: native-scope
    if: >-
      needs.native-scope.outputs.macos_lane == 'hosted' &&
      github.event_name != 'push' &&
      needs.native-scope.outputs.macos == 'true' &&
      !github.event.pull_request.draft &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    # Configure only after the dedicated bridge runner is registered.
    runs-on: ${{ vars.MACOS_BRIDGE_RUNNER || 'light' }}
    # Must exceed github-macos.py QUEUE_TIMEOUT + RUN_TIMEOUT (180 + 75 min):
    # a queued GitHub runner is waiting, not a failure.
    timeout-minutes: 270
    outputs:
      result: ${{ steps.remote.outputs.result }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Run the exact PR head on GitHub macOS
        id: remote
        env:
          MIRROR_TOKEN: ${{ secrets.OKILUM_GITHUB_MIRROR }}
          OKILUM_GITHUB_APP_ID: ${{ secrets.OKILUM_GITHUB_APP_ID }}
          OKILUM_GITHUB_APP_INSTALLATION_ID: ${{ secrets.OKILUM_GITHUB_APP_INSTALLATION_ID }}
          OKILUM_GITHUB_APP_KEY: ${{ secrets.OKILUM_GITHUB_APP_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.run_number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci/github-macos.py run

  macos-local:
    needs: native-scope
    # The host runner has a signing keychain. Fork code must first be reviewed
    # and moved to a trusted same-repository branch; the final gate fails closed.
    if: >-
      needs.native-scope.outputs.macos_lane == 'local' &&
      github.event_name != 'push' &&
      needs.native-scope.outputs.macos == 'true' &&
      !github.event.pull_request.draft &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: macos
    timeout-minutes: 20
    # LAN cache credentials belong only to the trusted local fallback (#563).
    env:
      SCCACHE_BUCKET: ${{ vars.SCCACHE_BUCKET }}
      SCCACHE_ENDPOINT: ${{ vars.SCCACHE_ENDPOINT }}
      SCCACHE_REGION: ${{ vars.SCCACHE_REGION }}
      SCCACHE_S3_USE_SSL: "false"
      SCCACHE_S3_KEY_PREFIX: rust
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
    steps:
      - name: Check out the exact source from the runner server
        shell: bash
        env:
          CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CHECKOUT_REPOSITORY: ${{ github.repository }}
          CHECKOUT_SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          if [[ ! "$CHECKOUT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Checkout source is not a full commit SHA: ${CHECKOUT_SHA:-<empty>}" >&2
            exit 1
          fi
          trap 'echo "::error::Source checkout failed at line $LINENO (exit $?)" >&2' ERR
          echo "Checking out exact source $CHECKOUT_SHA from runner origin"
          : "${CHECKOUT_SERVER_URL:?}" "${CHECKOUT_REPOSITORY:?}"
          [ -d .git ] || git init -q .
          git remote remove origin 2>/dev/null || true
          git remote add origin "${CHECKOUT_SERVER_URL%/}/${CHECKOUT_REPOSITORY}.git"
          git fetch -q --no-tags --depth 1 origin "$CHECKOUT_SHA"
          git checkout -q -f --detach "$CHECKOUT_SHA"
          git clean -q -ffdx
          test "$(git rev-parse HEAD)" = "$CHECKOUT_SHA"
      - name: Compile Reader and run quick native regressions
        shell: bash
        env:
          # #1915 dedicated mount gate, only for this manager-approved P1 branch.
          OKILUM_NETWORK_WRITE_QA: ${{ (github.event.pull_request.head.ref == 'fix/1915-network-writes' || github.event.pull_request.head.ref == 'feat/1924-vault-trash') && '1' || '0' }}
          # Manager-approved #1934 native gate; dedicated QA mount only.
          OKILUM_ENCODING_REPAIR_QA: ${{ github.event.pull_request.head.ref == 'fix/1934-repair-approved' && '1' || '0' }}
        run: bash scripts/ci/check-macos.sh
      - name: Prepare the pinned upload action from the runner server
        if: always()
        continue-on-error: true
        shell: bash
        env:
          ACTION_SERVER_URL: ${{ github.server_url }}
          ACTION_SHA: ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5
        run: |
          set -euo pipefail
          : "${ACTION_SERVER_URL:?}"
          # Fixed local uses is supported; dynamic expressions in uses are not needed.
          [ ! -L .forgejo-local-actions ]
          action_dir=.forgejo-local-actions/upload-artifact
          rm -rf "$action_dir"
          mkdir -p "$action_dir"
          git init -q "$action_dir"
          git -C "$action_dir" fetch -q --no-tags --depth 1 "${ACTION_SERVER_URL%/}/BeFeast/actions-upload-artifact.git" "$ACTION_SHA"
          git -C "$action_dir" checkout -q -f --detach "$ACTION_SHA"
          test "$(git -C "$action_dir" rev-parse HEAD)" = "$ACTION_SHA"
      - name: Save native thumbnail evidence
        id: thumbnail-evidence
        # Diagnostic PNG transport must not mask the native compile/test result.
        continue-on-error: true
        if: always()
        uses: ./.forgejo-local-actions/upload-artifact # verified upstream v3 (MIT)
        with:
          name: native-thumbnail-evidence
          path: ${{ runner.temp }}/thumbnail-evidence/
      - name: Report missing diagnostic evidence
        if: always() && steps.thumbnail-evidence.outcome == 'failure'
        run: echo '::warning::Native thumbnail evidence upload failed; see upload logs. Compile/test results remain authoritative.'

  # This job preserves the required Forgejo `ci / macos` status. Only the
  # exact-head result from exactly one executed lane passes; no failure fallback.
  # #1110 / AGENTS 9a: the first-run Reader tests on native Windows, every
  # code PR (same scope as macOS; drafts wait like macOS).
  windows-github:
    needs: native-scope
    if: >-
      github.event_name != 'push' &&
      needs.native-scope.outputs.macos == 'true' &&
      !github.event.pull_request.draft &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: bridge
    timeout-minutes: 120
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Run the exact PR head's first-run tests on GitHub Windows
        env:
          MIRROR_TOKEN: ${{ secrets.OKILUM_GITHUB_MIRROR }}
          OKILUM_GITHUB_APP_ID: ${{ secrets.OKILUM_GITHUB_APP_ID }}
          OKILUM_GITHUB_APP_INSTALLATION_ID: ${{ secrets.OKILUM_GITHUB_APP_INSTALLATION_ID }}
          OKILUM_GITHUB_APP_KEY: ${{ secrets.OKILUM_GITHUB_APP_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.run_number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_LANE: native-shell
        run: python3 scripts/ci/github-pr.py

  # #1662: same-runner shipped input A/B; supplementary until calibration acceptance.
  perf-linux:
    needs: native-scope
    if: >-
      github.event_name != 'push' &&
      needs.native-scope.outputs.macos == 'true' &&
      !github.event.pull_request.draft &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: bridge
    timeout-minutes: 100
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Run main and PR input A/B in one GitHub Linux job
        env:
          MIRROR_TOKEN: ${{ secrets.OKILUM_GITHUB_MIRROR }}
          OKILUM_GITHUB_APP_ID: ${{ secrets.OKILUM_GITHUB_APP_ID }}
          OKILUM_GITHUB_APP_INSTALLATION_ID: ${{ secrets.OKILUM_GITHUB_APP_INSTALLATION_ID }}
          OKILUM_GITHUB_APP_KEY: ${{ secrets.OKILUM_GITHUB_APP_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.run_number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_LANE: perf-linux
        run: python3 scripts/ci/github-pr.py

  # Start the signed PR preview as soon as macOS passes; Linux/Windows do not
  # delay this coordinator. The serialized signer revalidates the current head.
  macos-preview:
    needs: [native-scope, macos]
    if: false
    runs-on: publish
    permissions:
      contents: read
      actions: write
    timeout-minutes: 3
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
          # The protected main selector must be deployed before PR previews start.
          # A PR cannot replace the coordinator on the publication runner.
          ref: main
      - name: Select the newest green Mac PR head
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGEJO_URL: ${{ github.server_url }}
          MACOS_PR_PREVIEWS_ENABLED: ${{ vars.OKILUM_MACOS_PR_PREVIEWS }}
          MACOS_PREVIEW_PR: ${{ github.event.pull_request.number || github.run_number }}
          MACOS_PREVIEW_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/releases/coalesce.py macos

  macos:
    needs: [native-scope, macos-github, macos-local]
    if: always() && github.event_name != 'push'
    runs-on: bridge
    timeout-minutes: 2
    steps:
      - name: Require a native result
        env:
          SCOPE_RESULT: ${{ needs.native-scope.result }}
          MACOS_REQUIRED: ${{ needs.native-scope.outputs.macos }}
          HOSTED_JOB: ${{ needs.macos-github.result }}
          HOSTED_RESULT: ${{ needs.macos-github.outputs.result }}
          LOCAL_RESULT: ${{ needs.macos-local.result }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          test "$SCOPE_RESULT" = success
          case "$MACOS_REQUIRED" in
            false) echo "Documentation-only PR: native runner not needed" ;;
            true)
              # Draft (WIP) PRs do not occupy the scarce hosted macOS slots.
              # Forgejo has no ready_for_review event: remove the WIP prefix,
              # then push (an empty commit is enough) to run the native check.
              if [ "${DRAFT:-false}" = true ]; then
                echo "Draft PR: the macOS check runs after WIP is removed and a new commit is pushed"
                exit 1
              fi
              # The repository variable may change while this run is queued.
              # Judge this run's actual jobs, never the currently selected lane.
              case "$HOSTED_JOB:$LOCAL_RESULT" in
                skipped:success) echo "Local native check passed" ;;
                success:skipped)
                  if [ "$HOSTED_RESULT" != success ]; then
                    echo "GitHub macOS unavailable or failed — rerun later"
                    exit 1
                  fi ;;
                *)
                  echo "Expected exactly one successful native lane; hosted=$HOSTED_JOB local=$LOCAL_RESULT"
                  exit 1 ;;
              esac ;;
            *) exit 1 ;;
          esac

  # Keep the protected context; only shared code and applicable macOS block it.
  # Main's Linux release health is still reported independently by main-health.
  check:
    needs: [shared, macos]
    if: always()
    runs-on: bridge
    timeout-minutes: 2
    steps:
      - name: Require shared code and applicable macOS checks
        env:
          EVENT: ${{ github.event_name }}
          SHARED_RESULT: ${{ needs.shared.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
        run: |
          set -euo pipefail
          test "$SHARED_RESULT" = success
          if [ "$EVENT" = pull_request ]; then
            test "$MACOS_RESULT" = success
          fi
