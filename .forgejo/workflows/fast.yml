name: fast
on:
  schedule:
    - cron: '35 22 * * *'
  workflow_dispatch:
    inputs:
      certification_source:
        description: 'Source-pinned main certification for a Stable candidate (on demand)'
        required: false
        default: ''
concurrency:
  # Certification runs must finish reporting both source-pinned release gates.
  # Ordinary manual retries supersede only other manual runs on the same ref.
  group: fast-${{ github.event_name }}-${{ github.ref }}-${{ inputs.certification_source != '' && github.run_id || 'ordinary' }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && inputs.certification_source == '' }}
jobs:
  check:
    # Beta's shipping check: the three Python suites and scripts/ci/fast.sh run
    # on GitHub's dedicated 4 vCPU runners (.github/workflows/forgejo-check.yml).
    # Co-tenant load on baldr pushed the build phase past its 540 s deadline
    # (#2589, run 31053). This waiter compiles nothing; the hosted run executes
    # the exact source's commands with their unchanged group and phase limits.
    runs-on: bridge
    # 2 min source validation + 56 min hosted bridge + 90 s margin, within the
    # primary bridge runner's 60 min ceiling (docs/fast-runner.md).
    timeout-minutes: 60
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      # Certification checks out an older product source; the bridge comes from
      # this workflow revision so every source gets the same transport.
      - name: Stage the hosted bridge from the workflow revision
        run: |
          set -euo pipefail
          bridge_root=$(mktemp -d "${RUNNER_TEMP:?}/check-bridge-XXXXXX")
          cp scripts/ci/github-pr.py scripts/ci/github-macos.py scripts/ci/github_auth.py \
            scripts/ci/gate_log_evidence.py scripts/ci/fast_evidence.py "$bridge_root/"
          echo "OKILUM_HOSTED_BRIDGE=$bridge_root" >> "$GITHUB_ENV"
      - name: Validate hourly certification source before compiling
        if: inputs.certification_source != ''
        env:
          CERTIFICATION_SOURCE: ${{ inputs.certification_source }}
          FORGEJO_URL: ${{ github.server_url }}
        timeout-minutes: 2
        run: |
          set -euo pipefail
          # Exact-product checkout may predate the supervisors. Keep workflow
          # tooling outside that checkout before the validator changes HEAD.
          supervisor_root=$(mktemp -d "${RUNNER_TEMP:?}/fast-supervisor-XXXXXX")
          cp scripts/ci/test-group.sh scripts/ci/test-group.py "$supervisor_root/"
          OKILUM_TEST_GROUP="$supervisor_root/test-group.sh"
          echo "OKILUM_TEST_GROUP=$OKILUM_TEST_GROUP" >> "$GITHUB_ENV"
          bash "$OKILUM_TEST_GROUP" certification-source 90 python3 scripts/releases/hourly_beta.py certify-source
      - name: Run the fast check on GitHub
        env:
          MIRROR_TOKEN: ${{ secrets.OKILUM_GITHUB_MIRROR }}
          OKILUM_GITHUB_APP_ID: ${{ secrets.OKILUM_GITHUB_APP_ID }}
          OKILUM_GITHUB_APP_INSTALLATION_ID: ${{ secrets.OKILUM_GITHUB_APP_INSTALLATION_ID }}
          OKILUM_GITHUB_APP_KEY: ${{ secrets.OKILUM_GITHUB_APP_KEY }}
          CI_LANE: check
          PR_NUMBER: ${{ github.run_number }}
          PR_HEAD_SHA: ${{ inputs.certification_source || github.sha }}
        # 60 s history + 53 min shared queue/run budget + 2 min poll/cancel/cleanup.
        timeout-minutes: 56
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          if ! git cat-file -e "HEAD:.github/workflows/forgejo-check.yml" 2>/dev/null; then
            echo "::error::Source $PR_HEAD_SHA predates hosted check (#2589); certify a newer main commit" >&2
            exit 1
          fi
          # A shallow commit can be pushed only if GitHub already mirrors it.
          # Connect it to full history so a not-yet-mirrored main still pushes.
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            timeout 60 git fetch -q --no-tags --unshallow origin "$PR_HEAD_SHA"
          fi
          python3 "$OKILUM_HOSTED_BRIDGE/github-pr.py"

  shell-full:
    # Full runtime coverage never occupies a PR admission slot. The suite runs on
    # GitHub's dedicated 4 vCPU runner (.github/workflows/forgejo-shell-full.yml):
    # co-tenant load on baldr pushed it past every in-repo deadline (#2589).
    # This waiter compiles nothing; the hosted job executes the exact source's
    # scripts/ci/shell-full.sh with its unchanged phase deadlines.
    needs: [check]
    runs-on: bridge
    # 2 min source validation + 56 min hosted bridge + 90 s margin, within the
    # primary bridge runner's 60 min ceiling (docs/fast-runner.md).
    timeout-minutes: 60
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      # Certification checks out an older product source; the bridge comes from
      # this workflow revision so every source gets the same transport.
      - name: Stage the hosted bridge from the workflow revision
        run: |
          set -euo pipefail
          bridge_root=$(mktemp -d "${RUNNER_TEMP:?}/shell-full-bridge-XXXXXX")
          cp scripts/ci/github-pr.py scripts/ci/github-macos.py scripts/ci/github_auth.py \
            scripts/ci/gate_log_evidence.py scripts/ci/fast_evidence.py "$bridge_root/"
          echo "OKILUM_HOSTED_BRIDGE=$bridge_root" >> "$GITHUB_ENV"
      - name: Validate hourly certification source before compiling
        if: inputs.certification_source != ''
        env:
          CERTIFICATION_SOURCE: ${{ inputs.certification_source }}
          FORGEJO_URL: ${{ github.server_url }}
        timeout-minutes: 2
        run: |
          set -euo pipefail
          # Exact-product checkout may predate the supervisors. Keep workflow
          # tooling outside that checkout before the validator changes HEAD.
          supervisor_root=$(mktemp -d "${RUNNER_TEMP:?}/fast-supervisor-XXXXXX")
          cp scripts/ci/test-group.sh scripts/ci/test-group.py "$supervisor_root/"
          OKILUM_TEST_GROUP="$supervisor_root/test-group.sh"
          echo "OKILUM_TEST_GROUP=$OKILUM_TEST_GROUP" >> "$GITHUB_ENV"
          bash "$OKILUM_TEST_GROUP" certification-source 90 python3 scripts/releases/hourly_beta.py certify-source
      - name: Run the complete Linux shell binary suite on GitHub
        env:
          MIRROR_TOKEN: ${{ secrets.OKILUM_GITHUB_MIRROR }}
          OKILUM_GITHUB_APP_ID: ${{ secrets.OKILUM_GITHUB_APP_ID }}
          OKILUM_GITHUB_APP_INSTALLATION_ID: ${{ secrets.OKILUM_GITHUB_APP_INSTALLATION_ID }}
          OKILUM_GITHUB_APP_KEY: ${{ secrets.OKILUM_GITHUB_APP_KEY }}
          CI_LANE: shell-full
          PR_NUMBER: ${{ github.run_number }}
          PR_HEAD_SHA: ${{ inputs.certification_source || github.sha }}
        # 60 s history + 53 min shared queue/run budget + 2 min poll/cancel/cleanup.
        timeout-minutes: 56
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          if ! git cat-file -e "HEAD:.github/workflows/forgejo-shell-full.yml" 2>/dev/null; then
            echo "::error::Source $PR_HEAD_SHA predates hosted shell-full (#2589); certify a newer main commit" >&2
            exit 1
          fi
          # A shallow commit can be pushed only if GitHub already mirrors it.
          # Connect it to full history so a not-yet-mirrored main still pushes.
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            timeout 60 git fetch -q --no-tags --unshallow origin "$PR_HEAD_SHA"
          fi
          python3 "$OKILUM_HOSTED_BRIDGE/github-pr.py"

  certification-status:
    # Report check as soon as it finishes, never behind shell-full's queue slot
    # and 20-minute runner ceiling. Beta never waits for it (Oleg 05.11).
    needs: [check]
    if: always() && inputs.certification_source != ''
    runs-on: bridge
    timeout-minutes: 2
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Report the beta gate on the requested main commit
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGEJO_URL: ${{ github.server_url }}
          CERTIFICATION_SOURCE: ${{ inputs.certification_source }}
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/releases/hourly_beta.py certification-status

  shell-full-status:
    # The Stable gate; a red or timed-out shell-full never holds Beta.
    needs: [shell-full]
    if: always() && inputs.certification_source != ''
    runs-on: bridge
    timeout-minutes: 2
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Report the full runtime suite for Stable
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGEJO_URL: ${{ github.server_url }}
          CERTIFICATION_SOURCE: ${{ inputs.certification_source }}
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/releases/hourly_beta.py certification-status

  sync-source-sharing:
    # Keep this additional compiler/daemon load outside the bounded desktop gate.
    # The acceptance runs on GitHub's hosted runner
    # (.github/workflows/forgejo-sync-source-sharing.yml); it formerly ran on
    # baldr's fast-linux host runner, which Okilum left (Oleg 14.11). This
    # waiter compiles nothing; the hosted job runs the exact source's
    # scripts/ci/sync-source-sharing-fast.sh with its unchanged group limits.
    needs: [check]
    if: inputs.certification_source == ''
    runs-on: bridge
    # 56 min hosted bridge + margin, within the primary bridge runner's 60 min
    # ceiling (docs/fast-runner.md).
    timeout-minutes: 60
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Stage the hosted bridge from the workflow revision
        run: |
          set -euo pipefail
          bridge_root=$(mktemp -d "${RUNNER_TEMP:?}/sync-bridge-XXXXXX")
          cp scripts/ci/github-pr.py scripts/ci/github-macos.py scripts/ci/github_auth.py \
            scripts/ci/gate_log_evidence.py scripts/ci/fast_evidence.py "$bridge_root/"
          echo "OKILUM_HOSTED_BRIDGE=$bridge_root" >> "$GITHUB_ENV"
      - name: Run source sharing and network policy on GitHub
        env:
          MIRROR_TOKEN: ${{ secrets.OKILUM_GITHUB_MIRROR }}
          OKILUM_GITHUB_APP_ID: ${{ secrets.OKILUM_GITHUB_APP_ID }}
          OKILUM_GITHUB_APP_INSTALLATION_ID: ${{ secrets.OKILUM_GITHUB_APP_INSTALLATION_ID }}
          OKILUM_GITHUB_APP_KEY: ${{ secrets.OKILUM_GITHUB_APP_KEY }}
          CI_LANE: sync-source-sharing
          PR_NUMBER: ${{ github.run_number }}
          PR_HEAD_SHA: ${{ github.sha }}
        # 60 s history + 53 min shared queue/run budget + 2 min poll/cancel/cleanup.
        timeout-minutes: 56
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          # A shallow commit can be pushed only if GitHub already mirrors it.
          # Connect it to full history so a not-yet-mirrored main still pushes.
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            timeout 60 git fetch -q --no-tags --unshallow origin "$PR_HEAD_SHA"
          fi
          python3 "$OKILUM_HOSTED_BRIDGE/github-pr.py"
