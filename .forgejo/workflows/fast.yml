name: fast
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # baldr's persistent host executor; no ephemeral four-core Docker build.
    runs-on: heavy
    timeout-minutes: 5
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      SCCACHE_BUCKET: ${{ vars.SCCACHE_BUCKET }}
      SCCACHE_ENDPOINT: ${{ vars.SCCACHE_ENDPOINT }}
      SCCACHE_REGION: ${{ vars.SCCACHE_REGION }}
      SCCACHE_S3_USE_SSL: "false"
      SCCACHE_S3_KEY_PREFIX: rust
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Prepare local Linux toolchain
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          packages=(build-essential cmake pkg-config curl git mold zstd
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev
            libfontconfig-dev libfreetype-dev libxcb1-dev)
          if ! dpkg-query -W -f='${Status}\n' "${packages[@]}" 2>/dev/null | grep -vFx 'install ok installed' | grep -q . &&
             dpkg-query -W "${packages[@]}" >/dev/null 2>&1; then
            echo 'Local build dependencies already installed'
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends "${packages[@]}"
          fi
          test -x "$HOME/.cargo/bin/cargo"
          # Resolve/install the pinned toolchain before the bounded sccache probe.
          cargo --version
          rustc --version
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build Linux desktop and run fast unit tests
        env:
          GITHUB_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          export CARGO_TARGET_DIR="$HOME/.cache/okilum-fast/target"
          mkdir -p "$CARGO_TARGET_DIR"
          # One persistent local target, independent of checkout cleanup. Never
          # overwrite another builder's cache or contend on an unbounded lock. Waiting shares the five-minute job budget.
          exec 9>"$HOME/.cache/okilum-fast/build.lock"
          echo "Waiting for local fast target (bounded to 240s)"
          flock -w 240 9 || { echo "Local fast target remained busy; no compile/test verdict"; exit 1; }
          source scripts/ci/release-cache.sh
          bash scripts/ci/fast.sh
      - name: Compiler cache receipt
        if: always()
        run: |
          if command -v sccache >/dev/null; then sccache --show-stats; fi
