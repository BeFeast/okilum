name: fast
on:
  schedule:
    - cron: '35 22 * * *'
  workflow_dispatch:
    inputs:
      certification_source:
        description: 'Internal hourly main certification; must match the run commit'
        required: false
        default: ''
concurrency:
  # Certification runs must finish reporting both source-pinned release gates.
  # Ordinary manual retries supersede only other manual runs on the same ref.
  group: fast-${{ github.event_name }}-${{ github.ref }}-${{ inputs.certification_source != '' && github.run_id || 'ordinary' }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && inputs.certification_source == '' }}
jobs:
  check:
    # Dedicated warm runner for main certification only.
    # Workers validate their own exact HEAD through GitHub agent checks.
    runs-on: fast-linux
    # Core changes rebuild the desktop AND workspace test targets (#2378).
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      SCCACHE_BUCKET: ${{ vars.SCCACHE_BUCKET }}
      SCCACHE_ENDPOINT: ${{ vars.SCCACHE_ENDPOINT }}
      SCCACHE_REGION: ${{ vars.SCCACHE_REGION }}
      SCCACHE_S3_USE_SSL: "false"
      SCCACHE_S3_KEY_PREFIX: rust
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Validate hourly certification source before compiling
        if: inputs.certification_source != ''
        env:
          CERTIFICATION_SOURCE: ${{ inputs.certification_source }}
          FORGEJO_URL: ${{ github.server_url }}
        run: python3 scripts/releases/hourly_beta.py certify-source
      - name: Prepare local Linux toolchain
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          packages=(build-essential cmake pkg-config curl git mold zstd python3 gnupg
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev
            libfontconfig-dev libfreetype-dev libxcb1-dev)
          if ! dpkg-query -W -f='${Status}\n' "${packages[@]}" 2>/dev/null | grep -vFx 'install ok installed' | grep -q . &&
             dpkg-query -W "${packages[@]}" >/dev/null 2>&1; then
            echo 'Local build dependencies already installed'
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends "${packages[@]}"
          fi
          test -x "$HOME/.cargo/bin/cargo"
          # Resolve/install the pinned toolchain before the bounded sccache probe.
          cargo --version
          rustc --version
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Run the full CI tooling Python suite
        timeout-minutes: 5
        run: python3 -I -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - name: Run the full releases Python suite
        timeout-minutes: 5
        run: python3 -I -m unittest discover -s scripts/releases -p 'test_*.py' -v
      - name: Run the full updater Python suite
        timeout-minutes: 5
        run: python3 -I -m unittest discover -s scripts/updater -p 'test_*.py' -v
      - name: Build Linux desktop and run fast unit tests
        env:
          GITHUB_SHA: ${{ inputs.certification_source || github.sha }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          bash scripts/ci/fast-local.sh

  shell-full:
    # Full runtime coverage never occupies a PR admission slot.
    needs: [check]
    runs-on: fast-linux
    # Run 20932: test compilation 335s + >394s execution before check timed out.
    # Give this job the runner's full 20m ceiling; record two loaded runs before
    # adding its reporting context to main protection (docs/fast-runner.md).
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      SCCACHE_BUCKET: ${{ vars.SCCACHE_BUCKET }}
      SCCACHE_ENDPOINT: ${{ vars.SCCACHE_ENDPOINT }}
      SCCACHE_REGION: ${{ vars.SCCACHE_REGION }}
      SCCACHE_S3_USE_SSL: "false"
      SCCACHE_S3_KEY_PREFIX: rust
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Validate hourly certification source before compiling
        if: inputs.certification_source != ''
        env:
          CERTIFICATION_SOURCE: ${{ inputs.certification_source }}
          FORGEJO_URL: ${{ github.server_url }}
        run: python3 scripts/releases/hourly_beta.py certify-source
      - name: Prepare local Linux toolchain
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          packages=(build-essential cmake pkg-config curl git mold zstd
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev
            libfontconfig-dev libfreetype-dev libxcb1-dev)
          if ! dpkg-query -W -f='${Status}\n' "${packages[@]}" 2>/dev/null | grep -vFx 'install ok installed' | grep -q . &&
             dpkg-query -W "${packages[@]}" >/dev/null 2>&1; then
            echo 'Local build dependencies already installed'
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends "${packages[@]}"
          fi
          test -x "$HOME/.cargo/bin/cargo"
          # Resolve/install the pinned toolchain before the bounded sccache probe.
          cargo --version
          rustc --version
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Run the complete Linux shell binary suite
        env:
          GITHUB_SHA: ${{ inputs.certification_source || github.sha }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          bash scripts/ci/fast-local.sh shell-full

  certification-status:
    # Beta gates on check alone: report and dispatch as soon as it finishes,
    # never behind shell-full's queue slot and 20-minute runner ceiling.
    needs: [check]
    if: always() && inputs.certification_source != ''
    runs-on: bridge
    timeout-minutes: 2
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Report the beta gate on the requested main commit
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGEJO_URL: ${{ github.server_url }}
          CERTIFICATION_SOURCE: ${{ inputs.certification_source }}
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/releases/hourly_beta.py certification-status

  shell-full-status:
    # Stable information only; a red or timed-out shell-full never holds Beta.
    needs: [shell-full]
    if: always() && inputs.certification_source != ''
    runs-on: bridge
    timeout-minutes: 2
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Report the full runtime suite for Stable
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGEJO_URL: ${{ github.server_url }}
          CERTIFICATION_SOURCE: ${{ inputs.certification_source }}
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/releases/hourly_beta.py certification-status

  sync-source-sharing:
    # Keep this additional compiler/daemon load outside the bounded desktop gate.
    needs: [check]
    if: inputs.certification_source == ''
    runs-on: fast-linux
    timeout-minutes: 15
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "3"
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Allocate job-owned fixture directory
        run: |
          fixture_root=$(mktemp -d "${RUNNER_TEMP:?}/sync-fixtures-XXXXXX")
          echo "OKILUM_SYNC_FIXTURE_ROOT=$fixture_root" >> "$GITHUB_ENV"
          echo "TMPDIR=$fixture_root" >> "$GITHUB_ENV"
      - name: Verify ordinary source sharing with two pinned managed runtimes
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          export CARGO_TARGET_DIR="$HOME/.cache/okilum-sync-source-sharing/target"
          mkdir -p "$CARGO_TARGET_DIR"
          exec 9>"$HOME/.cache/okilum-sync-source-sharing/gate.lock"
          flock -w 600 9
          scripts/vendor-setup.sh 9>&-
          scripts/vendor-setup.sh --verify 9>&-
          bash scripts/ci/sync-source-sharing.sh --runs 2 --parallel 2 9>&-
          bash scripts/ci/sync-network-policy.sh 9>&-
      - name: Reject and reap surviving job fixture daemons
        if: always()
        run: |
          if [[ -n "${OKILUM_SYNC_FIXTURE_ROOT:-}" ]]; then
            python3 scripts/ci/sync-fixture-processes.py --root "$OKILUM_SYNC_FIXTURE_ROOT" --cleanup
          fi
