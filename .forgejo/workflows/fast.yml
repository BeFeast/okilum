name: fast
on:
  schedule:
    - cron: '35 22 * * *'
  workflow_dispatch:
    inputs:
      certification_source:
        description: 'Internal hourly main certification; must match the run commit'
        required: false
        default: ''
concurrency:
  # Certification runs must finish reporting both source-pinned release gates.
  # Ordinary manual retries supersede only other manual runs on the same ref.
  group: fast-${{ github.event_name }}-${{ github.ref }}-${{ inputs.certification_source != '' && github.run_id || 'ordinary' }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' && inputs.certification_source == '' }}
jobs:
  check:
    # Dedicated warm runner for main certification only.
    # Workers validate their own exact HEAD through GitHub agent checks.
    runs-on: fast-linux
    # Additive phases plus three 5m Python step ceilings (#2536), setup/cleanup.
    timeout-minutes: 55
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
      SCCACHE_BUCKET: ${{ vars.SCCACHE_BUCKET }}
      SCCACHE_ENDPOINT: ${{ vars.SCCACHE_ENDPOINT }}
      SCCACHE_REGION: ${{ vars.SCCACHE_REGION }}
      SCCACHE_S3_USE_SSL: "false"
      SCCACHE_S3_KEY_PREFIX: rust
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      # Install from the workflow revision before certification checks out an
      # older product source that may not contain the dependency setup helper.
      - name: Install Python venv support
        run: |
          if ! dpkg-query -W -f='${Status}' python3-venv 2>/dev/null | grep -q 'install ok installed'; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends python3-venv
          fi
      - name: Prepare isolated Python test dependencies
        run: bash scripts/ci/setup-python-tests.sh
      - name: Validate hourly certification source before compiling
        if: inputs.certification_source != ''
        env:
          CERTIFICATION_SOURCE: ${{ inputs.certification_source }}
          FORGEJO_URL: ${{ github.server_url }}
        timeout-minutes: 2
        run: |
          set -euo pipefail
          # Exact-product checkout may predate the supervisors. Keep workflow
          # tooling outside that checkout before the validator changes HEAD.
          supervisor_root=$(mktemp -d "${RUNNER_TEMP:?}/fast-supervisor-XXXXXX")
          cp scripts/ci/test-group.sh scripts/ci/test-group.py "$supervisor_root/"
          OKILUM_TEST_GROUP="$supervisor_root/test-group.sh"
          echo "OKILUM_TEST_GROUP=$OKILUM_TEST_GROUP" >> "$GITHUB_ENV"
          bash "$OKILUM_TEST_GROUP" certification-source 90 python3 scripts/releases/hourly_beta.py certify-source
      - name: Prepare local Linux toolchain
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          packages=(build-essential cmake pkg-config curl git mold zstd python3 python3-venv gnupg
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev
            libfontconfig-dev libfreetype-dev libxcb1-dev)
          if ! dpkg-query -W -f='${Status}\n' "${packages[@]}" 2>/dev/null | grep -vFx 'install ok installed' | grep -q . &&
             dpkg-query -W "${packages[@]}" >/dev/null 2>&1; then
            echo 'Local build dependencies already installed'
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends "${packages[@]}"
          fi
          test -x "$HOME/.cargo/bin/cargo"
          # Resolve/install the pinned toolchain before the bounded sccache probe.
          cargo --version
          rustc --version
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Run the full CI tooling Python suite
        timeout-minutes: 5
        run: bash "${OKILUM_TEST_GROUP:-scripts/ci/test-group.sh}" ci-python 180 python3 -I -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - name: Run the full releases Python suite
        timeout-minutes: 5
        run: bash "${OKILUM_TEST_GROUP:-scripts/ci/test-group.sh}" releases-python 90 python3 -I -m unittest discover -s scripts/releases -p 'test_*.py' -v
      - name: Run the full updater Python suite
        timeout-minutes: 5
        run: bash "${OKILUM_TEST_GROUP:-scripts/ci/test-group.sh}" updater-python 90 python3 -I -m unittest discover -s scripts/updater -p 'test_*.py' -v
      - name: Build Linux desktop and run fast unit tests
        env:
          GITHUB_SHA: ${{ inputs.certification_source || github.sha }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          bash "${OKILUM_TEST_GROUP:-scripts/ci/test-group.sh}" fast-local-check 2100 bash scripts/ci/fast-local.sh

  shell-full:
    # Full runtime coverage never occupies a PR admission slot. The suite runs on
    # GitHub's dedicated 4 vCPU runner (.github/workflows/forgejo-shell-full.yml):
    # co-tenant load on baldr pushed it past every in-repo deadline (#2589).
    # This waiter compiles nothing; the hosted job executes the exact source's
    # scripts/ci/shell-full.sh with its unchanged phase deadlines.
    needs: [check]
    runs-on: bridge
    # 2 min source validation + 56 min hosted bridge + 90 s margin, within the
    # primary bridge runner's 60 min ceiling (docs/fast-runner.md).
    timeout-minutes: 60
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      # Certification checks out an older product source; the bridge comes from
      # this workflow revision so every source gets the same transport.
      - name: Stage the hosted bridge from the workflow revision
        run: |
          set -euo pipefail
          bridge_root=$(mktemp -d "${RUNNER_TEMP:?}/shell-full-bridge-XXXXXX")
          cp scripts/ci/github-pr.py scripts/ci/github-macos.py scripts/ci/github_auth.py \
            scripts/ci/gate_log_evidence.py scripts/ci/fast_evidence.py "$bridge_root/"
          echo "OKILUM_HOSTED_BRIDGE=$bridge_root" >> "$GITHUB_ENV"
      - name: Validate hourly certification source before compiling
        if: inputs.certification_source != ''
        env:
          CERTIFICATION_SOURCE: ${{ inputs.certification_source }}
          FORGEJO_URL: ${{ github.server_url }}
        timeout-minutes: 2
        run: |
          set -euo pipefail
          # Exact-product checkout may predate the supervisors. Keep workflow
          # tooling outside that checkout before the validator changes HEAD.
          supervisor_root=$(mktemp -d "${RUNNER_TEMP:?}/fast-supervisor-XXXXXX")
          cp scripts/ci/test-group.sh scripts/ci/test-group.py "$supervisor_root/"
          OKILUM_TEST_GROUP="$supervisor_root/test-group.sh"
          echo "OKILUM_TEST_GROUP=$OKILUM_TEST_GROUP" >> "$GITHUB_ENV"
          bash "$OKILUM_TEST_GROUP" certification-source 90 python3 scripts/releases/hourly_beta.py certify-source
      - name: Run the complete Linux shell binary suite on GitHub
        env:
          MIRROR_TOKEN: ${{ secrets.OKILUM_GITHUB_MIRROR }}
          OKILUM_GITHUB_APP_ID: ${{ secrets.OKILUM_GITHUB_APP_ID }}
          OKILUM_GITHUB_APP_INSTALLATION_ID: ${{ secrets.OKILUM_GITHUB_APP_INSTALLATION_ID }}
          OKILUM_GITHUB_APP_KEY: ${{ secrets.OKILUM_GITHUB_APP_KEY }}
          CI_LANE: shell-full
          PR_NUMBER: ${{ github.run_number }}
          PR_HEAD_SHA: ${{ inputs.certification_source || github.sha }}
        # 60 s history + 53 min shared queue/run budget + 2 min poll/cancel/cleanup.
        timeout-minutes: 56
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          if ! git cat-file -e "HEAD:.github/workflows/forgejo-shell-full.yml"; then
            echo "::error::Source $PR_HEAD_SHA predates hosted shell-full (#2589); certify a newer main commit" >&2
            exit 1
          fi
          # A shallow commit can be pushed only if GitHub already mirrors it.
          # Connect it to full history so a not-yet-mirrored main still pushes.
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
            timeout 60 git fetch -q --no-tags --unshallow origin "$PR_HEAD_SHA"
          fi
          python3 "$OKILUM_HOSTED_BRIDGE/github-pr.py"

  certification-status:
    # Beta gates on check alone: report and dispatch as soon as it finishes,
    # never behind shell-full's hosted queue and run.
    needs: [check]
    if: always() && inputs.certification_source != ''
    runs-on: bridge
    timeout-minutes: 2
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Report the beta gate on the requested main commit
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGEJO_URL: ${{ github.server_url }}
          CERTIFICATION_SOURCE: ${{ inputs.certification_source }}
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/releases/hourly_beta.py certification-status

  shell-full-status:
    # Stable information only; a red or timed-out shell-full never holds Beta.
    needs: [shell-full]
    if: always() && inputs.certification_source != ''
    runs-on: bridge
    timeout-minutes: 2
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Report the full runtime suite for Stable
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGEJO_URL: ${{ github.server_url }}
          CERTIFICATION_SOURCE: ${{ inputs.certification_source }}
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/releases/hourly_beta.py certification-status

  sync-source-sharing:
    # Keep this additional compiler/daemon load outside the bounded desktop gate.
    needs: [check]
    if: inputs.certification_source == ''
    runs-on: fast-linux
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_BUILD_JOBS: "3"
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Allocate job-owned fixture directory
        run: |
          fixture_root=$(mktemp -d "${RUNNER_TEMP:?}/sync-fixtures-XXXXXX")
          echo "OKILUM_SYNC_FIXTURE_ROOT=$fixture_root" >> "$GITHUB_ENV"
          echo "TMPDIR=$fixture_root" >> "$GITHUB_ENV"
      - name: Install Python venv support
        run: |
          if ! dpkg-query -W -f='${Status}' python3-venv 2>/dev/null | grep -q 'install ok installed'; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends python3-venv
          fi
      - name: Prepare isolated Python test dependencies
        run: bash scripts/ci/setup-python-tests.sh
      - name: Verify ordinary source sharing with two pinned managed runtimes
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          bash scripts/ci/test-group.sh sync-local 1500 bash scripts/ci/sync-source-sharing-fast.sh
      - name: Reject and reap surviving job fixture daemons
        if: always()
        run: |
          if [[ -n "${OKILUM_SYNC_FIXTURE_ROOT:-}" ]]; then
            python3 scripts/ci/sync-fixture-processes.py --root "$OKILUM_SYNC_FIXTURE_ROOT" --cleanup
          fi
