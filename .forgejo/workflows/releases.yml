# Beta is automatic; stable requires an explicit owner-approved build.
name: releases
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      build:
        description: 'Owner-approved macOS build (Linux build with linux_only); empty refreshes Beta only (or see source)'
        required: false
        default: ''
      source:
        description: 'Full main SHA required with linux_only; otherwise request all-platform builds (#1040)'
        required: false
        default: ''
      linux_only:
        description: 'Owner-approved Linux only: exact Linux build AND full source SHA; no builds or other platform writes (#1432)'
        type: boolean
        default: false
      linux_rollback:
        description: 'With linux_only/build/source: restore the exact previous Linux feed from its receipt'
        type: boolean
        default: false
      windows_only:
        description: 'With build: put the re-signed Windows build of that stable build on stable; Mac, Linux, tag and notes unchanged (#1104)'
        type: boolean
        default: false
      skip_windows:
        description: 'With build: promote Mac and Linux only; stable keeps its signed Windows build until windows_only (#1378)'
        type: boolean
        default: false
      supersede_pending:
        description: 'Owner-approved recovery only: supersede interrupted promotion with a NEWER build'
        required: false
        type: boolean
        default: false

# Explicit stable promotion shares the appcast lock with macos-release.
# Scheduled Beta never edits the appcast or queues against the M4 release.
# Platform beta publishers finish independently; Beta mirrors each current public platform head.
concurrency:
  # A source request only dispatches builds and returns; it must not hold the publication lock.
  group: ${{ inputs.build != '' && 'okilum-macos-release' || (inputs.source != '' && 'okilum-release-request' || 'okilum-github-beta') }}
  cancel-in-progress: false
jobs:
  github-mirror:
    if: github.ref == 'refs/heads/main'
    runs-on: publish
    container:
      image: archlinux:base-devel@sha256:51dd3d24f7fba779e7c471caeee7804c50e8c134ad948e19685a1c83a42facc3
    timeout-minutes: 20
    steps:
      - name: Install publication tools (no compiler work)
        run: pacman -Syu --noconfirm --needed nodejs git python ca-certificates
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish selected release (Linux only when explicitly requested)
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGEJO_URL: ${{ github.server_url }}
          MIRROR_TOKEN: ${{ secrets.OKILUM_GITHUB_MIRROR }}
          # '1' once Windows signing is live: an unsigned Windows build never reaches stable (#1104).
          OKILUM_WINDOWS_STABLE_REQUIRE_SIGNED: ${{ vars.OKILUM_WINDOWS_STABLE_REQUIRE_SIGNED }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          ARCH_GPG_PRIVATE_KEY: ${{ secrets.ARCH_GPG_PRIVATE_KEY }}
          ARCH_GPG_FINGERPRINT: ${{ vars.ARCH_GPG_FINGERPRINT }}
          PROMOTE_BUILD: ${{ inputs.build }}
          PROMOTE_SOURCE: ${{ inputs.source }}
          SUPERSEDE_PENDING: ${{ inputs.supersede_pending }}
          LINUX_ONLY: ${{ inputs.linux_only }}
          LINUX_ROLLBACK: ${{ inputs.linux_rollback }}
          WINDOWS_ONLY: ${{ inputs.windows_only }}
          SKIP_WINDOWS: ${{ inputs.skip_windows }}
        run: |
          # Handle Linux before the all-platform request/build path. Never dispatch builds.
          if [ "$LINUX_ONLY" = true ]; then
            if [ -z "$PROMOTE_BUILD" ] || [ -z "$PROMOTE_SOURCE" ]; then
              echo 'linux_only requires both build and full source SHA' >&2
              exit 1
            fi
            if [ "$WINDOWS_ONLY" = true ] || [ "$SKIP_WINDOWS" = true ] || [ "$SUPERSEDE_PENDING" = true ]; then
              echo 'linux_only excludes windows_only, skip_windows and supersede_pending' >&2
              exit 1
            fi
            args=()
            if [ "$LINUX_ROLLBACK" = true ]; then args+=(--rollback); fi
            exec python scripts/releases/linux.py --source "$PROMOTE_SOURCE" --build "$PROMOTE_BUILD" "${args[@]}"
          fi
          if [ "$LINUX_ROLLBACK" = true ]; then
            echo 'linux_rollback requires linux_only' >&2
            exit 1
          fi
          if [ -n "$PROMOTE_SOURCE" ] && [ -z "$PROMOTE_BUILD" ]; then
            # Builds what is missing for that commit; the last publication starts the promotion.
            exec python scripts/releases/prepare.py request "$PROMOTE_SOURCE"
          fi
          args=()
          if [ "$SKIP_WINDOWS" = true ] && [ "$WINDOWS_ONLY" = true ]; then
            echo 'skip_windows and windows_only exclude each other' >&2
            exit 1
          fi
          if [ "$WINDOWS_ONLY" = true ]; then
            test -n "$PROMOTE_BUILD"
            exec python scripts/releases/publish.py --build "$PROMOTE_BUILD" --windows-only
          fi
          if [ "$SUPERSEDE_PENDING" = true ]; then
            test -n "$PROMOTE_BUILD"
            args+=(--supersede-pending)
          fi
          if [ "$SKIP_WINDOWS" = true ]; then
            test -n "$PROMOTE_BUILD"
            args+=(--skip-windows)
          fi
          if [ -n "$PROMOTE_BUILD" ]; then
            python scripts/releases/publish.py --build "$PROMOTE_BUILD" "${args[@]}"
          else
            python scripts/releases/publish.py
          fi
