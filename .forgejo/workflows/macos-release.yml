# The latest main becomes a signed, notarized Sparkle beta about once an hour. A manual run on another branch builds and signs but publishes nothing.
# See docs/macos-auto-update.md.
name: macos-release

on:
  # Fixed hourly window; the runner is free between ticks. Manual build now bypasses it.
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

# Finish the selected hourly/manual snapshot even when main advances.
concurrency:
  group: tessera-macos-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select:
    runs-on: light
    timeout-minutes: 3
    outputs:
      build: ${{ steps.select.outputs.build }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select hourly or manual build
        id: select
        run: python3 scripts/releases/coalesce.py macos

  release:
    needs: select
    if: needs.select.outputs.build == 'true'
    runs-on: macos
    timeout-minutes: 90
    env:
      SCCACHE_BUCKET: ${{ vars.SCCACHE_BUCKET }}
      SCCACHE_ENDPOINT: ${{ vars.SCCACHE_ENDPOINT }}
      SCCACHE_REGION: ${{ vars.SCCACHE_REGION }}
      SCCACHE_S3_USE_SSL: "false"
      SCCACHE_S3_KEY_PREFIX: rust
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          persist-credentials: false
          github-server-url: ${{ vars.FORGEJO_CHECKOUT_URL || github.server_url }}

      - name: Build, sign and notarize
        shell: bash
        env:
          TESSERA_SIGNING_IDENTITY: ${{ vars.TESSERA_SIGNING_IDENTITY }}
          TESSERA_NOTARY_PROFILE: ${{ vars.TESSERA_NOTARY_PROFILE }}
          SPARKLE_PUBLIC_ED_KEY: TH/Jc6vRfSSFtR3R2rLqBGBnFylMUWdKJ6dr18Ys8CY=
        run: |
          # Monotonic and above the last hand-numbered build (4792).
          export TESSERA_BUILD_VERSION=$((5000 + ${GITHUB_RUN_NUMBER:?}))
          bash scripts/build-macos-ci.sh "$RUNNER_TEMP/release"

      - name: Check the macOS pasteboard adapter on an isolated named pasteboard
        shell: bash
        run: |
          if [ -f "$HOME/.cargo/env" ]; then . "$HOME/.cargo/env"; fi
          export CC=/usr/bin/clang CXX=/usr/bin/clang++
          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          export SDKROOT
          export CARGO_TARGET_DIR="$HOME/.cache/tessera-macos/1.96.1-arm64"
          export CARGO_INCREMENTAL=0
          # The test binary runs outside Tessera.app; use the verified source framework.
          env DYLD_FRAMEWORK_PATH="$PWD/vendor/sparkle" cargo +1.96.1 test --release --locked --target aarch64-apple-darwin -p tessera-shell platform::exact_macos_clipboard::native_tests -- --test-threads=1
          # #471: real-vault sidecars/invalid UTF-8 cannot abort rename or enter search.
          cargo +1.96.1 test --release --locked --target aarch64-apple-darwin -p tessera-core --lib link_rewrite::tests::sidecars_and_invalid_utf8_do_not_abort_move_or_enter_search -- --exact
          # #453: synchronous lock release, pending-writer exclusion and 128 reopen iterations.
          for lock_test in \
            completed_exchange_before_journal_acknowledgement_recovers_without_conflict \
            immediate_reopen_releases_lock_despite_an_inherited_descriptor \
            pending_draft_retains_exclusion_until_it_finishes_then_reopens_immediately \
            destination_reservation_protects_orphaned_drafts_and_active_writers; do
            cargo +1.96.1 test --release --locked --target aarch64-apple-darwin -p tessera-core --lib "file_editor::tests::$lock_test" -- --exact
          done
          # #398: exercise release-mode UTF-8 guards and native pointer routing.
          env DYLD_FRAMEWORK_PATH="$PWD/vendor/sparkle" cargo +1.96.1 test --release --locked --target aarch64-apple-darwin -p tessera-shell text_ranges::tests -- --test-threads=1
          env DYLD_FRAMEWORK_PATH="$PWD/vendor/sparkle" cargo +1.96.1 test --release --locked --target aarch64-apple-darwin -p tessera-shell reader_editor::tests -- --test-threads=1
          env DYLD_FRAMEWORK_PATH="$PWD/vendor/sparkle" cargo +1.96.1 test --release --locked --target aarch64-apple-darwin -p tessera-shell reader_create::tests -- --test-threads=1
          env DYLD_FRAMEWORK_PATH="$PWD/vendor/sparkle" cargo +1.96.1 test --release --locked --target aarch64-apple-darwin -p tessera-shell reader_move::tests -- --test-threads=1
          # Manual branch validation stress-repeats the real FSEvents test (#459).
          # Main releases retain a single run; failures are never retried away.
          replay_runs=1
          if [ "${GITHUB_REF:-}" != "refs/heads/main" ]; then replay_runs=20; fi
          for ((attempt = 1; attempt <= replay_runs; attempt++)); do
            echo "FSEvents replay stress $attempt/$replay_runs"
            env DYLD_FRAMEWORK_PATH="$PWD/vendor/sparkle" cargo +1.96.1 test --release --locked --target aarch64-apple-darwin -p tessera-shell reader_replay::native::tests -- --test-threads=1 || exit "$?"
          done

      - name: Stage signed update for publication
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          set -a
          . "$RUNNER_TEMP/release/release.env"
          set +a
          SIGNATURE="$(printf '%s\n' "$SPARKLE_ED_PRIVATE_KEY" | "$SIGN_UPDATE" --ed-key-file - -p "$ARCHIVE")"
          export SIGNATURE
          python3 scripts/releases/macos-artifact.py stage "$RUNNER_TEMP/publish"
      - uses: https://code.forgejo.org/actions/upload-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          name: macos-publication
          path: ${{ runner.temp }}/publish/*
          retention-days: 7

      - name: Dispatch protected publication
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGEJO_URL: ${{ github.server_url }}
        run: python3 scripts/releases/publication.py dispatch macos
