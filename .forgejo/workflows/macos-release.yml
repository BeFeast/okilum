# Signed Mac beta ticks until 2026-10-26 03:00 UTC, then only daily 10:30 UTC.
# A lightweight tick dispatches main so artifact and workflow provenance stay equal.
# See docs/macos-auto-update.md.
name: macos-release

on:
  # Daily window outside corporate VPN hours; the runner is free between ticks. Manual build now bypasses it.
  schedule:
    - cron: "30 10 * * *"
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      beta_tick:
        description: 'Internal automatic selector: frequent or daily; empty keeps manual behavior'
        required: false
        default: ''
      source:
        description: 'Exact main ancestor for a manual hosted shipping artifact; empty selects workflow SHA'
        required: false
        default: ''

# Finish the selected daily/manual snapshot even when main advances.
concurrency:
  group: ${{ github.event_name == 'schedule' && 'okilum-macos-select' || 'okilum-macos-build' }}
  cancel-in-progress: false

jobs:
  select:
    runs-on: publish
    timeout-minutes: 3
    outputs:
      build: ${{ steps.select.outputs.build }}
      lane: ${{ steps.route.outputs.lane }}
      source: ${{ steps.route.outputs.source }}
    steps:
      - name: Check out the exact source from git.oklabs.uk
        shell: bash
        env:
          CHECKOUT_SHA: ${{ github.sha }}
          CHECKOUT_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$CHECKOUT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ -d .git ] || git init -q .
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://git.oklabs.uk/${CHECKOUT_REPOSITORY}.git"
          # Keep origin/main and complete ancestry for source/provenance checks.
          shallow=()
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then shallow=(--unshallow); fi
          git fetch -q --force --prune --tags "${shallow[@]}" origin '+refs/heads/*:refs/remotes/origin/*' "$CHECKOUT_SHA"
          git checkout -q -f --detach "$CHECKOUT_SHA"
          git clean -q -ffdx
          test "$(git rev-parse HEAD)" = "$CHECKOUT_SHA"

      - name: Select unpublished main or dispatch a source-pinned run
        id: select
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGEJO_URL: ${{ github.server_url }}
          MACOS_BETA_TICK: ${{ inputs.beta_tick }}
          RELEASE_SCHEDULE: ${{ github.event.schedule }}
        run: python3 scripts/releases/coalesce.py macos
      - name: Select delivery route without a local fallback
        id: route
        if: steps.select.outputs.build == 'true'
        env:
          # The temporary approved M4 window must not follow the workday hosted lane.
          # After expiry the original daily/manual routing is unchanged.
          MACOS_LANE: ${{ steps.select.outputs.local == 'true' && 'local' || vars.OKILUM_MACOS_LANE }}
          PRODUCT_SOURCE: ${{ inputs.source }}
        run: python3 scripts/releases/macos-hosted.py route

  release:
    needs: select
    if: needs.select.outputs.build == 'true' && needs.select.outputs.lane == 'local'
    runs-on: macos
    timeout-minutes: 90
    env:
      SCCACHE_BUCKET: ${{ vars.SCCACHE_BUCKET }}
      SCCACHE_ENDPOINT: ${{ vars.SCCACHE_ENDPOINT }}
      SCCACHE_REGION: ${{ vars.SCCACHE_REGION }}
      SCCACHE_S3_USE_SSL: "false"
      SCCACHE_S3_KEY_PREFIX: rust
      AWS_ACCESS_KEY_ID: ${{ secrets.SCCACHE_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCCACHE_AWS_SECRET_ACCESS_KEY }}
    steps:
      - name: Check out the exact source from git.oklabs.uk
        shell: bash
        env:
          CHECKOUT_SHA: ${{ github.sha }}
          CHECKOUT_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$CHECKOUT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ -d .git ] || git init -q .
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://git.oklabs.uk/${CHECKOUT_REPOSITORY}.git"
          git fetch -q --no-tags --depth 1 origin "$CHECKOUT_SHA"
          git checkout -q -f --detach "$CHECKOUT_SHA"
          git clean -q -ffdx
          test "$(git rev-parse HEAD)" = "$CHECKOUT_SHA"

      - name: Build, sign and notarize
        shell: bash
        env:
          OKILUM_SIGNING_IDENTITY: ${{ vars.OKILUM_SIGNING_IDENTITY }}
          OKILUM_NOTARY_PROFILE: ${{ vars.OKILUM_NOTARY_PROFILE }}
          SPARKLE_PUBLIC_ED_KEY: TH/Jc6vRfSSFtR3R2rLqBGBnFylMUWdKJ6dr18Ys8CY=
        run: |
          # Monotonic and above the last hand-numbered build (4792).
          export OKILUM_BUILD_VERSION=$((5000 + ${GITHUB_RUN_NUMBER:?}))
          bash scripts/build-macos-ci.sh "$RUNNER_TEMP/release"

      - name: Check the macOS pasteboard adapter on an isolated named pasteboard
        shell: bash
        run: |
          if [ -f "$HOME/.cargo/env" ]; then . "$HOME/.cargo/env"; fi
          export CC=/usr/bin/clang CXX=/usr/bin/clang++
          SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          export SDKROOT
          export CARGO_TARGET_DIR="$HOME/.cache/okilum-macos/reader-arm64"
          export CARGO_INCREMENTAL=0
          # The test binary runs outside Okilum.app; use the verified source framework.
          env DYLD_FRAMEWORK_PATH="$PWD/vendor/sparkle" cargo test --release --locked --target aarch64-apple-darwin -p okilum-shell platform::exact_macos_clipboard::native_tests -- --test-threads=1
          # #471: real-vault sidecars/invalid UTF-8 cannot abort rename or enter search.
          cargo test --release --locked --target aarch64-apple-darwin -p okilum-core --lib link_rewrite::tests::sidecars_and_invalid_utf8_do_not_abort_move_or_enter_search -- --exact
          # #453: synchronous lock release, pending-writer exclusion and 128 reopen iterations.
          for lock_test in \
            completed_exchange_before_journal_acknowledgement_recovers_without_conflict \
            immediate_reopen_releases_lock_despite_an_inherited_descriptor \
            pending_draft_retains_exclusion_until_it_finishes_then_reopens_immediately \
            destination_reservation_protects_orphaned_drafts_and_active_writers; do
            cargo test --release --locked --target aarch64-apple-darwin -p okilum-core --lib "file_editor::tests::$lock_test" -- --exact
          done
          # #398: exercise release-mode UTF-8 guards and native pointer routing.
          env DYLD_FRAMEWORK_PATH="$PWD/vendor/sparkle" cargo test --release --locked --target aarch64-apple-darwin -p okilum-shell text_ranges::tests -- --test-threads=1
          env DYLD_FRAMEWORK_PATH="$PWD/vendor/sparkle" cargo test --release --locked --target aarch64-apple-darwin -p okilum-shell reader_editor::tests -- --test-threads=1
          env DYLD_FRAMEWORK_PATH="$PWD/vendor/sparkle" cargo test --release --locked --target aarch64-apple-darwin -p okilum-shell reader_create::tests -- --test-threads=1
          env DYLD_FRAMEWORK_PATH="$PWD/vendor/sparkle" cargo test --release --locked --target aarch64-apple-darwin -p okilum-shell reader_move::tests -- --test-threads=1
          # Manual branch validation stress-repeats the real FSEvents test (#459).
          # Main releases retain a single run; failures are never retried away.
          replay_runs=1
          if [ "${GITHUB_REF:-}" != "refs/heads/main" ]; then replay_runs=20; fi
          for ((attempt = 1; attempt <= replay_runs; attempt++)); do
            echo "FSEvents replay stress $attempt/$replay_runs"
            env DYLD_FRAMEWORK_PATH="$PWD/vendor/sparkle" cargo test --release --locked --target aarch64-apple-darwin -p okilum-shell reader_replay::native::tests -- --test-threads=1 || exit "$?"
          done

      - name: Stage signed update for publication
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          set -a
          . "$RUNNER_TEMP/release/release.env"
          set +a
          SIGNATURE="$(printf '%s\n' "$SPARKLE_ED_PRIVATE_KEY" | "$SIGN_UPDATE" --ed-key-file - -p "$ARCHIVE")"
          export SIGNATURE
          python3 scripts/releases/macos-artifact.py stage "$RUNNER_TEMP/publish"
      - uses: https://git.oklabs.uk/BeFeast/actions-upload-artifact@ff15f0306b3f739f7b6fd43fb5d26cd321bd4de5 # upstream v3 (MIT)
        if: github.ref == 'refs/heads/main'
        with:
          name: macos-publication
          path: ${{ runner.temp }}/publish/*
          retention-days: 7

      - name: Dispatch protected publication
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORGEJO_URL: ${{ github.server_url }}
        run: python3 scripts/releases/publication.py dispatch macos

  hosted-artifact:
    needs: select
    if: needs.select.outputs.build == 'true' && needs.select.outputs.lane == 'hosted' && github.event_name == 'workflow_dispatch'
    runs-on: bridge
    timeout-minutes: 105
    steps:
      - name: Check out the exact source from git.oklabs.uk
        shell: bash
        env:
          CHECKOUT_SHA: ${{ github.sha }}
          CHECKOUT_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$CHECKOUT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ -d .git ] || git init -q .
          git remote remove origin 2>/dev/null || true
          git remote add origin "https://git.oklabs.uk/${CHECKOUT_REPOSITORY}.git"
          # Keep origin/main and complete ancestry for source/provenance checks.
          shallow=()
          if [ "$(git rev-parse --is-shallow-repository)" = true ]; then shallow=(--unshallow); fi
          git fetch -q --force --prune --tags "${shallow[@]}" origin '+refs/heads/*:refs/remotes/origin/*' "$CHECKOUT_SHA"
          git checkout -q -f --detach "$CHECKOUT_SHA"
          git clean -q -ffdx
          test "$(git rev-parse HEAD)" = "$CHECKOUT_SHA"

      - name: Produce a source-pinned hosted shipping artifact
        env:
          MIRROR_TOKEN: ${{ secrets.OKILUM_GITHUB_MIRROR }}
          PRODUCT_SOURCE: ${{ needs.select.outputs.source }}
          OKILUM_SIGNING_IDENTITY: ${{ vars.OKILUM_SIGNING_IDENTITY }}
          OKILUM_NOTARY_PROFILE: ${{ vars.OKILUM_NOTARY_PROFILE }}
        run: python3 scripts/ci/github-macos-shipping.py
