# #3261 (from #3244): a floating Wayland window with client-side decorations
# keeps the window geometry of the old shadow inset after a UI zoom change.
# The inset is 20 px x zoom: 40 at the restored 200%, 20 after Ctrl+Shift+0.
# The surface keeps its size, so the window sway sees must grow by 2 x 20 px
# per axis; with the bug sway keeps the 200% outline and the content sits
# 20 px up-left of where a fresh start puts it.
note: |
  # Zoom acceptance

  The quick brown fox stays readable while the interface grows.
preferences:
  ui_zoom: 2.0
rig:
  output_scale: 1.3
  # A floating client-decorated window, as on GNOME. 800x500 logical px
  # fits the 1366x768 output at 1.3 (1050x590 logical).
  floating: [800, 500]
region: [0, 0, 1366, 768]
ready_text: quick brown fox
steps:
  # Control: the restored 200% window is the size sway configured.
  - id: restored
    wait: 1.5
    ui_scale: 2.0
    window: {field: rect}
  - id: reset
    # wtype needs the shifted keysym; "0" would synthesize Ctrl+0 (text zoom).
    keys: [parenright]
    mods: [ctrl, shift]
    wait: 1.5
    ui_scale: 1.0
    text: quick brown fox
    window: {field: rect, from: restored, width: 40, height: 40}
