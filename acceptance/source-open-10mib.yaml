# #3073: open a 10 MiB Markdown note in Source, then jump to its last line.
# The note is generated into the isolated vault at run time (exact size, first
# and last line markers). `max_ms` is measured from the key press to the first
# frame that shows the last line. The paired launch-to-Source-frame control of
# #2094 is not covered by this runner (it reports launch_to_first_frame_seconds).
generate:
  - path: ten-mib.md
    kind: markdown
    mib: 10
    first_line: Ten mebibytes of field notes
    last_line: End of the field notes
open: ten-mib.md
preferences: {note_open_mode: edit}
region: [300, 90, 780, 678]
ready_text: Ten mebibytes of field notes
steps:
  - id: focus-source
    click: [700, 180]
    text: Ten mebibytes of field notes
  - id: source-end
    keys: [End]
    mods: [ctrl]
    text: End of the field notes
    max_ms: 1000
