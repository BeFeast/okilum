# Open the capture with Now selected and check the lifecycle context groups.
vault: tests/fixtures/lifecycle-vault
open: inbox/Capture.md
sidebar_state:
  left_mode: now
  now_enabled: true
  now_collapsed: [changes, pins]
generate:
  - path: state/dev/garden/@index.md
    kind: text
    text: |
      ---
      kind: project
      status: active
      ---
      # Garden journal
  - path: state/dev/orchard/@index.md
    kind: text
    text: |
      ---
      kind: project
      status: active
      ---
      # Orchard journal
  - path: state/health/@index.md
    kind: text
    text: |
      ---
      type: project
      status: active
      ---
      # Health domain note
mtime:
  inbox/Capture.md: 0
  sources/web/2026/11/24/Reference.md: 0
  knowledge/evening-light.md: 0
  state/health/sleep/@index.md: 0
  state/dev/garden/@index.md: 0
  state/dev/orchard/@index.md: 0
  state/health/@index.md: 0
  log/health/sleep/decisions/2026-11-24-lights-out.md: 0
  log/health/sleep/final/Retired.md: 0
  state/health/sleep/Archive/2026-11-24-lights-out.md: 0
  sources/video/2026/11/24/summary.md: 0
  sources/video/2026/11/24/transcript.md: 0
appearance: light
rig:
  persistent_pointer: true
preferences:
  note_open_mode: read
region: [265, 85, 950, 550]
ready_text: Lifecycle entry
steps:
  - id: now-open
    wait: 1.5
    text: Rescan
    region: [0, 45, 279, 690]
  - id: active-context-groups
    text_order: [garden, Dev, orchard, Dev, sleep, Health, health]
    region: [0, 145, 279, 265]
    text_absent: Projects
    pixels:
      # The em dash on the unassigned context heading is too small for OCR.
      region: [7, 341, 18, 16]
      expression: "r<0.6 && g<0.6 && b<0.6 ? 1 : 0"
      min: 3
      max: 25
  - id: decision-group
    click: [75, 665]
    wait: 0.7
    text: decisions
    region: [0, 45, 279, 690]
  - id: updated-status
    vault_replace:
      path: state/health/sleep/@index.md
      before: 'status: active'
      after: 'status: parked'
    text: parked
    region: [0, 145, 279, 200]
  - id: quick-open-alias
    keys: [k]
    mods: [ctrl]
    wait: 0.5
  - id: find-physical-log-note
    keys: [e, v, e, n, i, n, g, m, a, r, k, e, r]
    wait: 0.9
    text: Choose a bedtime
    text_absent: Active state note
    region: [285, 48, 780, 320]
  - id: open-log-result
    keys: [Return]
    wait: 0.7
    text: Choose a bedtime
  - id: reveal-log-result
    keys: [l]
    mods: [ctrl, shift]
    wait: 0.7
    text: decisions
    region: [0, 45, 279, 690]
