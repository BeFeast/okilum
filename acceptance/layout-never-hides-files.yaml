  - {path: AGENTS.md, kind: text, text: "# Agents\n"}
  - {path: "@Index.md", kind: text, text: "# Index\n"}
  - {path: inbox/Capture.md, kind: text, text: "# Capture\n"}
  - {path: knowledge/Evening light.md, kind: text, text: "# Evening light\n"}
  - {path: sources/files/2026/11/24/legacy/runbooks/sample-unit/readme.md, kind: text, text: "# Sample unit\n"}
