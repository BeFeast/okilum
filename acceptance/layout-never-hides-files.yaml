# The gardener's Grove layout block (roots, domains, nested_roots) on a
# Grove-shaped vault. Layout may group the sidebar but never hide a file:
# Areas lists the domains, each expands into its folder on disk, and
# All files lists the whole vault as the Tree does. Before the fix Areas
# showed only the domain names.
