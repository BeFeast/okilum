class="list-row row between"><span>Canonical source notes</span><strong>3</strong></div><div class="list-row row between"><span>Selected root</span><span class="badge">Managed</span></div>${b('Browse the brain →','brain','quiet full')}</div><div class="panel panel-pad"><h3>One connection needs care</h3><p class="small muted" style="margin:9px 0">Todoist credentials are missing. Existing knowledge is still available.</p>${b('Review connections','connections')}</div></aside></div>`;if(S.goals[0].state==='complete'){markup=markup.replace(/<article class="attention-card">[\s\S]*?<\/article>/,'');markup=markup.replace('Two things need a decision.','One thing needs a decision.');}else if(['result','running','prepared'].includes(S.goals[0].state)){const x=S.goals[0];markup=markup.replace('Decision needed',x.state==='result'?'Result needs review':x.state==='running'?'T3 working':'Stage ready');markup=markup.replace('The scope is ready. Create a linked task and hand the preparation stage to T3.',x.state==='result'?'The engine succeeded. Read the saved evidence and record your review.':x.state==='running'?'The backend is preparing the checklist. Routine progress stays in execution details.':'Frozen source context is prepared. Start the stage explicitly when ready.');}if(Object.values(S.connections).every(x=>x==='reachable')){markup=markup.replace('One connection needs care','Connections are ready').replace('Todoist credentials are missing. Existing knowledge is still available.','Saved mock connections are reachable. Existing provider identities remain pinned.')}return markup}

function context(){return `<aside class="context stack"><section class="panel panel-pad"><div class="section-label"><h3>Goal context</h3></div><p class="small muted">Sources available to this discussion</p><div class="list-row">${b('▤ Launch readiness ↗','read-source','quiet full')}<span class="small muted">engineering/launch-readiness.md</span></div><div class="list-row">${b('▤ Project boundary ↗','read-readme','quiet full')}<span class="small muted">README.md</span></div><details><summary>Source snapshots & identity</summary><p class="small muted">Synthetic goal ${S.goal+1} · source snapshot fixed when a stage is prepared. Source identity remains its root-relative path.</p></details></section><section class="panel panel-pad"><h3>What counts as done</h3><ul class="checklist small"><li>${g().review?'✓':'○'} Checklist cites the selected sources</li><li>${g().review?'✓':'○'} Scope separates preparation from observed launch</li><li>${g().review?'✓':'○'} Alex reviews the saved artifact</li></ul><p class="small muted">A successful engine turn does not verify this goal.</p></section><section class="panel panel-pad"><h3>Linked task</h3><p class="small muted" style="margin:8px 0">${g().task?'Todoist · open (mock)':'No linked task yet'}</p>${g().task?b('Inspect task','task-details','quiet'):b('Create Todoist task','create-task')}<p class="footnote">Todoist is the task authority. Local review does not close the provider task.</p></section></aside>`}
function discussion(){return `${g().chatInterrupted?`<div class="callout warn"><strong>Response interrupted</strong><p class="small">The saved partial remains below. Reconnecting has not resent your message.</p><div style="margin-top:10px">${b('Continue explicitly','continue-chat')} ${b('Inspect saved partial','partial','quiet')}</div></div>`:''}<div class="message"><header><div class="avatar">AL</div><strong>You</strong><span>Today, 09:14</span></header><div class="body"><p>Help me turn the launch notes into a short checklist. Keep actual build and launch verification separate from preparation.</p></div></div><div class="message"><header><div class="avatar">AI</div><strong>Okilum</strong><span>2 sources used</span></header><div class="body"><p>I’ll prepare a checklist grounded in the engineering notes, with a clear handoff to the operator.</p><ul><li>Pin the source revision and signing prerequisites.</li><li>List build, install, and observation steps.</li><li>Make unverified checks visible rather than marking them done.</li></ul><div class="callout"><strong>Suggested next step</strong><span>Link a Todoist task, then prepare a bounded T3 stage.</span></div><div style="margin-top:14px">${!g().task?b('Create Todoist task','create-task','primary'):['discuss','blocked'].includes(g().state)?b('Prepare T3 stage →','prepare','primary'):b('View execution →','tab-execution','primary')}</div></div></div>${g().messages.map(x=>`<div class="message"><header><div class="avatar">${x.role==='You'?'AL':'AI'}</div><strong>${x.role}</strong><span>Just now · mock</span></header><div class="body">${esc(x.text)}</div></div>`).join('')}<form class="composer" id="chat-form"><label class="screenreader" for="chat-input">Message this goal</label><textarea id="chat-input" placeholder="Think it through, with this goal’s context…">${esc(g().compose)}</textarea><footer><span class="small muted">2 sources · ${g().chatInterrupted?'interrupted':'ready'}</span><button class="primary" type="submit">Send message</button></footer></form><details><summary>Prototype controls: conversation recovery</summary>${b('Simulate interrupted response','interrupt')}</details>`}
function execution(){let x=g();return `<div class="panel panel-pad"><div class="row between">${badge(x.state==='running'?'T3 is working':x.state==='blocked'?'Blocked':x.state==='prepared'?'Ready to start':['result','complete'].includes(x.state)?'Engine succeeded':'Not started',x.state==='blocked'?'warn':'info')}<span class="small muted">Stage ${x.stage} · checklist preparation</span></div><h2 style="margin:20px 0 10px">${x.state==='blocked'?'One boundary needs your decision.':x.state==='running'?'Preparing your launch-readiness checklist.':['result','complete'].includes(x.state)?'The stage finished. The result is retained.':'A bounded stage, ready for your handoff.'}</h2><p class="muted">T3 prepares an artifact from selected sources. It has no authority to build, deploy, or change the original project.</p>${x.state==='running'?'<div class="progressline"><span></span></div><p class="small muted">Backend-owned execution · safe to close the desktop</p>':''}${x.state==='blocked'?`<div class="callout warn" style="margin-top:20px"><strong>Which scope should the checklist cover?</strong><p>Preparation only is consistent with the selected sources. Actual build and launch require an operator.</p><div style="margin-top:12px">${b('Use preparation-only scope','resolve-blocker','primary')}</div></div>`:''}<div class="row wrap" style="margin-top:22px">${x.state==='prepared'?b('Start T3 stage','start','primary'):x.state==='discuss'?b('Prepare T3 stage','prepare','primary'):['result','complete'].includes(x.state)?b('Read saved outcome →','tab-outcome','primary'):b('Open actual thread ↗','thread')}${b('Inspect frozen scope','scope','quiet')}</div><details><summary>Stage details and event history</summary><div class="timeline"><div><strong>Sources selected</strong><p class="small muted">README.md + engineering/launch-readiness.md</p></div><div><strong>Stage ${x.stage} scope prepared</strong><p class="small muted">Preparation only · retained source snapshot</p></div>${x.state!=='prepared'?'<div><strong>Dispatch tracked</strong><p class="small muted">The existing operation identity is reused for reconciliation. Opening this screen creates no new work.</p></div>':''}</div></details></div><details><summary>Prototype controls: execution states</summary><div class="row wrap" style="margin-top:12px">${b('Simulate running','sim-running')}${b('Simulate blocker','sim-blocker')}${b('Simulate saved result','sim-result')}${b('Simulate desktop reconnect','reconnect-stage')}</div></details>${prior()}`}
function prior(){return g().prior.length?`<section class="panel panel-pad" style="margin-top:22px"><h3>Prior stages are retained</h3>${g().prior.map((p,i)=>`<div class="list-row row between"><span>Stage ${p.stage} · ${p.review?'reviewed':'saved result'}</span>${b('Read prior outcome','prior-'+i,'quiet')}</div>`).join('')}</section>`:''}
function outcome(){let x=g();if(!['result','complete'].includes(x.state))return `<div class="panel screenstate"><div class="eyebrow">Nothing has been claimed complete</div><h2>The saved outcome will appear here.</h2><p class="muted">The current stage has not produced a terminal result.</p><div style="margin-top:20px">${b('Return to execution','tab-execution')}</div></div>${prior()}`;return `<div class="callout ${x.review?'':'warn'}"><strong>${x.review?'Goal verified · review recorded':'Engine succeeded · goal still incomplete'}</strong><p class="small">${x.review?'Alex reviewed this saved result. You do not need to confirm it again.':'Read the saved evidence and record your review before this goal can be considered complete.'}</p></div><article class="panel panel-pad" style="margin-top:22px"><div class="row between"><span class="eyebrow">Saved outcome · stage ${x.stage}</span>${badge('Markdown retained','good')}</div><h2 style="margin:20px 0 12px">Launch-readiness checklist</h2><p>The preparation stage produced a source-grounded handoff. No build, install, or device launch was performed.</p><ul class="checklist"><li>✓ Source revision and prerequisites documented</li><li>✓ Operator build and signing steps listed</li><li>○ Real-device install and launch — operator action, outside this goal</li></ul><div class="row wrap">${b('Read canonical result','result-source')}${b('Open source evidence','evidence','quiet')}</div><details><summary>Evidence, actor, and review history</summary><pre>Result: synthetic-stage-${x.stage}-result\nEngine: succeeded\nBuild/install/launch: not performed\nGoal review: ${x.review?'Alex · '+esc(x.reviewTime)+' · current saved result':'unverified'}\nTodoist task: open · provider authority retained\nCheckpoint/diff: unavailable for this planning stage</pre></details></article><div style="margin-top:20px">${x.review?b('Prepare a follow-up stage','followup'):b('Review saved result','review','primary')}</div>${prior()}`}
function goal(){return heading('Goal / '+(S.goal+1),g().title,'Your sources, discussion, and delegated work — one continuous thread.')+`<div class="flow"><span>Thought</span><span>→</span><span class="${S.tab==='discussion'?'current':''}">Discussion</span><span>→</span><span>Task</span><span>→</span><span class="${S.tab==='execution'?'current':''}">Execution</span><span>→</span><span class="${S.tab==='outcome'?'current':''}">Knowledge</span></div><div class="cols"><section><nav class="tabbar" aria-label="Goal sections">${['discussion','execution','outcome'].map(t=>`<button data-action="tab-${t}" class="${S.tab===t?'active':''}" aria-current="${S.tab===t?'page':'false'}">${t[0].toUpperCase()+t.slice(1)}${t==='execution'?' · '+g().stage:''}</button>`).join('')}</nav>${({discussion,execution,outcome})[S.tab]()}</section>${context()}</div>`}
function preview(raw){return raw.replace(/^---\n[\s\S]*?\n---\n/,'').split('\n').map(l=>l.startsWith('# ')?`<h1>${esc(l.slice(2))}</h1>`:l.startsWith('## ')?`<h2>${esc(l.slice(3))}</h2>`:l.startsWith('- ')?`<p>• ${esc(l.slice(2))}</p>`:`<p>${esc(l).replace(/\[\[([^\]]+)\]\]/g,(_,p)=>`<button class="quiet small" data-link="${esc(p)}">${esc(p)} ↗</button>`)}</p>`).join('')}
function brain(){return heading('Markdown source',S.draft.match(/^# (.+)$/m)?.[1]||S.source.split('/').pop().replace('.md',''),'Managed engineering copy · exact source and rendered preview.',`<div class="row">${badge(S.dirty?'Unsaved draft':'Saved',S.dirty?'warn':'good')}</div>`)+`<div class="note-layout"><aside class="panel filetree"><div class="eyebrow" style="padding:8px">Halenote / brain</div>${Object.keys(sources).map(p=>`<button data-source="${p}" class="${S.source===p?'selected':''}">▤ ${p.replace('engineering/','')}</button>`).join('')}<details><summary>Workspace root</summary><p class="small mono">/synthetic/halenote-brain</p><p class="small muted">Writable engineering copy. Original project remains outside this root.</p></details></aside><div>${S.conflict?conflict():`<div class="panel"><div class="row between" style="padding:12px 20px;border-bottom:1px solid var(--border)"><span class="small mono">${esc(S.source)}</span>${badge('Source + preview')}</div><div class="editor-grid"><section><div class="eyebrow" style="margin-bottom:16px">Exact Markdown</div><label class="screenreader" for="source-editor">Markdown source</label><textarea id="source-editor" class="editor" spellcheck="false">${esc(S.draft)}</textarea></section><section><div class="eyebrow">Rendered preview · mock subset</div><div class="prose" id="preview">${preview(S.draft)}</div></section></div></div>`}<details><summary>Prototype controls: revision safety</summary><div class="row wrap" style="margin-top:12px">${b('Simulate external change','external')}${b('Open ambiguous link','ambiguous')}${b('Open unavailable link','missing-link')}</div><p class="small muted">External edit simulation changes only this in-memory fixture. Unsaved drafts are retained through blocked navigation, not browser reload.</p></details></div></div>`}
function conflict(){return `<div class="callout danger"><strong>${S.incoming>S.displayed?'A newer version arrived. Review it before saving.':'This source changed since you opened it.'}</strong><p class="small">Your draft is retained. Saving a resolution uses the revision you inspected; another write creates another conflict.</p></div><div class="panel panel-pad" style="margin-top:18px"><div class="conflict-grid"><section><h3>Current on disk · revision ${S.displayed}</h3><pre>${esc(S.displayedText||sources[S.source])}</pre></section><section><h3>Your resolution draft</h3><label class="screenreader" for="resolution">Resolved Markdown draft</label><textarea id="resolution" class="mono">${esc(S.draft)}</textarea></section></div><details><summary>${S.base?'Inspect exact loaded base':'Base unavailable — no history invented'}</summary>${S.base?`<pre>${esc(S.base)}</pre>`:'<p class="small muted">Compare the retained draft with the current source explicitly.</p>'}</details><div class="row wrap" style="margin-top:18px">${S.incoming>S.displayed?b('Review latest version','review-latest','primary'):b('Save resolved draft','resolve-save','primary')}${b('Simulate newer incoming','newer')}${b('Use current; discard my draft','use-current','danger')}</div></div>`}
function connections(){return heading('Workspace settings','Connections','Saved settings stay with this workspace. Credentials remain outside the brain.')+`<div class="stack">${Object.entries(S.connections).map(([name,state])=>`<section class="panel panel-pad"><div class="row between"><div><h2>${name}</h2><p class="small muted">${name==='CLIProxyAPI'?'AI discussion':name==='Todoist'?'Task authority':'Delegated execution'}</p></div>${badge(state,state==='reachable'?'good':'warn')}</div><div class="field"><label for="ref-${name}">Credential reference <span class="small muted">· no secret values</span></label><input id="ref-${name}" value="file:/external/credentials/${name.toLowerCase()}.token" autocomplete="off" spellcheck="false"></div><div class="row wrap">${b('Check connection','check-'+name)}${b('Save and connect','connect-'+name,'primary')}</div><p class="small muted" style="margin-top:12px">${state==='authentication-required'?'Credential reference is missing or expired. Restore the external credential, then reconnect. Existing task status is unknown; it is not completed.':state==='identity mismatch'?'This account differs from retained work. Restore the original account; operations remain disabled.':'Connection check is read-only. Saved history and interrupted conversations will not be resent.'}</p><details><summary>Saved identity and recovery scenarios</summary><div class="field"><label>Endpoint / target</label><input aria-label="${name} retained endpoint" value="${name==='T3'?'https://t3.example.invalid / Halenote engineering':name==='Todoist'?'https://api.todoist.com / synthetic-account':'https://chat.example.invalid/v1'}" readonly></div><p class="small muted">Provider identity is pinned by existing history. To use a different established account or project, select a separate managed workspace.</p><div class="row wrap">${b('Simulate missing credential','missing-'+name)}${b('Simulate identity mismatch','mismatch-'+name)}${b('Restore original identity','restore-'+name)}</div></details></section>`).join('')}</div>`}
function exportView(){return heading('Portable knowledge','Export this brain','Take your saved Markdown and attachments with you. Original bytes and relative paths stay intact.')+`<div class="cols"><section class="panel panel-pad"><h2>Halenote engineering brain</h2><p class="small mono muted" style="margin-top:10px">/synthetic/halenote-brain</p><div class="list-row row between"><span>Canonical source notes</span><strong>${Object.keys(sources).length}</strong></div><div class="list-row row between"><span>Conversation, goal & result records</span><strong>Included when saved</strong></div><div class="list-row row between"><span>File/revision manifest</span><strong>SHA-256</strong></div><div class="callout ${S.exportState==='failure'?'danger':''}" style="margin:22px 0"><strong>${S.exportState==='success'?'Archive prepared and verified · synthetic fixture':S.exportState==='failure'?'Export failed. No complete archive was published.':S.exportState==='working'?'Checking saved files and revisions…':'Saved knowledge only'}</strong><p class="small">${S.exportState==='failure'?'A file changed during the second inventory. Retry prepares a fresh archive; the failed attempt is discarded.':S.exportState==='success'?'A downloadable tar contains mock canonical files and a file/revision manifest. Extract brain/ independently.':'Unsaved drafts, credentials, indexes, and execution journals are excluded. Opening an extracted copy never resumes provider work.'}</p></div><div class="row wrap">${b(S.exportState==='failure'?'Retry export':S.exportState==='success'?'Prepare another export':'Prepare exact export','prepare-export','primary')}${S.exportState==='success'?b('Download fixture .tar','download-export')+b('Inspect manifest','manifest','quiet'):''}</div><p class="footnote">Browser download demonstrates packaging of synthetic data. Production uses the native save dialog, bounded transfer, full-hash verification, and atomic publication.</p><details><summary>Prototype controls: export consistency</summary>${b(S.exportFail?'Failure simulation enabled':'Simulate changed-file failure','export-fail')}<p class="small muted">Toggle then prepare. Retry uses a fresh inventory.</p></details></section><aside class="panel panel-pad"><h3>Know what travels</h3><div class="list-row"><strong>Included</strong><p class="small muted">Saved notes, synthetic attachment, and canonical goal, conversation, and result records.</p></div><div class="list-row"><strong>Excluded</strong><p class="small muted">Secrets, configuration, caches, drafts, and execution state.</p></div><div class="list-row"><strong>Dependencies are explicit</strong><p class="small muted">Missing, ambiguous, and external links are identified; unrelated files are never imported.</p></div></aside></div>`}
const states=[['empty','Nothing needs your attention','Capture a thought when it comes. Your sources remain available.','Capture a thought','capture'],['loading','Loading saved workspace','Retrieving the existing goal and stage identities. No work is being started.','Show loading screen','state-loading'],['error','Workspace could not be read','Restore the saved backend endpoint, then retry. No request was repeated.','Inspect recovery','state-error'],['offline','Desktop disconnected','Backend work can continue. Last known task status is not live evidence.','Show offline screen','state-offline'],['warning','Missing credentials','Only the affected connector is disabled. Source reading and editing remain available.','Connections','connections'],['warning','Dirty draft','A note or goal switch requires save, explicit discard, or keep editing.','Try dirty navigation','demo-dirty'],['warning','Interrupted response','Saved partial is retained. Reconnect never resends the prompt.','Open interrupted chat','demo-interrupted'],['warning','Engine succeeded ≠ goal complete','Saved result awaits actual evidence review.','Open unverified result','demo-result'],['success','Verified goal complete','Recorded review replaces the confirmation action.','Open completed goal','demo-complete'],['warning','Newer incoming source','A stale resolution cannot silently overwrite the new version.','Open newer conflict','demo-conflict'],['success','Prior result retained','Explicit follow-up keeps its predecessor’s evidence and actor.','Open retained stage','demo-prior'],['error','Export changed-file failure','No complete archive exists. A retry prepares a new inventory.','Open failed export','demo-export']];
function library(){return heading('Design review / component states','Component states','Interactive examples of the states that change what you can safely do. Theme and density controls apply to every surface.')+`<div class="row wrap" style="margin-bottom:22px">${badge('Current alpha','info')}${badge('Decision needed','warn')}${badge('Verified','good')}${badge('Unavailable','danger')}${b('Primary action','component-demo','primary')}${b('Secondary action','component-demo')}<button disabled>Unavailable action</button></div><div class="state-grid">${states.map(([type,title,desc,label,a])=>`<section class="panel">${badge(type,type==='error'?'danger':type==='warning'?'warn':type==='success'?'good':'info')}<h3>${title}</h3><p class="muted small" style="margin-bottom:18px">${desc}</p>${b(label,a)}</section>`).join('')}</div>`}
function mobile(){return heading('Future proposal / not current alpha','Mobile capture','Limited mobile capture and attention concept. No mobile editor, connection, or delivery is implemented.')+`<div class="phone"><div class="row between"><strong>9:41</strong><span class="small">Future concept</span></div><h2 style="margin:30px 0 8px">Halenote</h2><p class="muted small">Keep the thought. Return to the work.</p><form id="mobile-form" class="composer"><label for="mobile-thought" class="eyebrow">Capture a thought</label><textarea id="mobile-thought" placeholder="What’s on your mind?" style="margin-top:15px"></textarea><button class="primary full" type="submit">Keep on this device</button></form><p class="small muted" id="mobile-status" style="margin-top:10px">Concept: locally queued, not delivered.</p><h3 style="margin:28px 0 14px">Needs attention</h3><div class="callout warn"><strong>Checklist ready to review</strong><p class="small">Open the saved outcome on desktop.</p></div><div class="callout" style="margin-top:16px"><strong>T3 is still working</strong><p class="small">Closing a screen does not stop backend work.</p></div><p class="footnote">Delivery receipts, device trust, and offline reconciliation need a separate product contract.</p></div>`}
function screenstate(){let k=S.screenState;return heading('Workspace recovery',k==='loading'?'Loading saved work…':k==='offline'?'You’re disconnected.':'Cannot read the workspace.','Your current view has no fresh backend confirmation.')+`<section class="panel screenstate"><h2>${k==='loading'?'Reading the existing snapshot':k==='offline'?'Last known state is preserved':'Check the saved endpoint and workspace identity'}</h2><p class="muted">${k==='loading'?'Selection does not dispatch work.':k==='offline'?'The backend may still be executing. Reconnect checks the same stage; no automatic resend.':'A failure is not an empty inbox or a completed task.'}</p><div style="margin-top:22px">${b(k==='loading'?'Complete mock load':'Retry connection','recover','primary')} ${b('Connections','connections')}</div></section>`}
function render(){
 const previous=document.activeElement,focusAction=previous?.dataset?.action;
 if(!S.section)S.section=['attention','goals','brain'].includes(S.view)?S.view:'attention';
 if(['attention','goals','brain'].includes(S.view))S.section=S.view;
 const isGoal=['attention','goals','goal'].includes(S.view);
 $('#crumb').textContent=S.view==='brain'?'Halenote / Engineering':isGoal?'Halenote / '+(S.section==='attention'?'Attention':'Goals'):'Halenote / Workspace';
 $$('[data-nav]').forEach(x=>x.setAttribute('aria-current',x.dataset.nav===(isGoal?S.section:S.view)?'page':'false'));
 $('#goal-count').textContent=S.goals.length;
 $('#main').innerHTML=S.screenState==='normal'?(isGoal?refinedGoal():({brain,connections,export:exportView,library,mobile})[S.view]()):screenstate();
 $('#detail-actions').innerHTML=S.view==='brain'?b('Return to goal','goal-'+S.goal,'quiet')+b('Save source','save','quiet'):isGoal?b('Sources & details','tab-details','quiet'):b('Workspace','workspace-details','quiet');
 $('#items').innerHTML=contextItems();$('#list-heading').textContent=({'brain':'Project brain','attention':'Attention','goals':'All goals','connections':'Connections','export':'Workspace','library':'Design review','mobile':'Future concepts'})[isGoal?S.section:S.view]||'All goals';
 $('#list-total').textContent=S.view==='brain'?Object.keys(sources).length:isGoal?S.goals.length:'';
 $('#attention-count').textContent=S.goals.filter(x=>!['complete','running'].includes(x.state)).length;
 $('#backend-status').innerHTML=S.screenState==='normal'?'Backend connected':S.screenState==='loading'?'Checking backend':'Backend unconfirmed · status stale';
 document.querySelector('.composer-dock')?.remove();const composer=$('#main #chat-form');if(composer){const dock=document.createElement('div');dock.className='composer-dock';document.querySelector('.detail-pane').append(dock);dock.append(composer);}
 const controls=[...$('#main').querySelectorAll('details')].filter(d=>d.querySelector('summary')?.textContent.startsWith('Prototype controls'));
 $('#sim-tools').innerHTML=controls.map(d=>d.outerHTML).join('');controls.forEach(d=>d.remove());
 polishIcons();
 if(focusAction){const target=[...document.querySelectorAll('[data-action]')].find(el=>el.dataset.action===focusAction);if(target)target.focus();else $('#main').focus();}
}

function save(continueAfter=false){if(S.external||S.conflict){if(!S.conflict){S.base=S.loadedSource;S.displayedText=sources[S.source];S.displayed=S.incoming;S.conflict=true;}S.view='brain';close();render();notify('Save stopped: source revision changed. Your draft is retained.');return false;}sources[S.source]=S.draft;S.loadedSource=S.draft;S.dirty=false;notify('Source saved in the mock workspace.');if(continueAfter&&pending){const fn=pending;pending=null;close();fn()}else render();return true}
function capture(){modal('Capture a thought',`<p class="muted">Keep an idea with this brain. You can shape its task and next step in discussion.</p><form id="capture-form"><div class="field"><label for="thought">Your thought</label><textarea id="thought" required rows="3" placeholder="What do you want to move forward?"></textarea></div><button type="submit" class="primary">Keep thought & open goal →</button></form>`,b('Cancel','close'))}

async function hash(bytes){const d=await crypto.subtle.digest('SHA-256',bytes);return [...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function tar(files){const enc=new TextEncoder(),blocks=[];for(const [name,data] of Object.entries(files)){let h=new Uint8Array(512),dv=enc.encode(data);function put(offset,len,value){h.set(enc.encode(value).slice(0,len),offset)}put(0,100,name);put(100,8,'0000644\0');put(108,8,'0000000\0');put(116,8,'0000000\0');put(124,12,dv.length.toString(8).padStart(11,'0')+'\0');put(136,12,'00000000000\0');put(148,8,'        ');put(156,1,'0');put(257,6,'ustar\0');put(263,2,'00');let sum=h.reduce((a,b)=>a+b,0);put(148,8,sum.toString(8).padStart(6,'0')+'\0 ');blocks.push(h,dv,new Uint8Array((512-dv.length%512)%512))}blocks.push(new Uint8Array(1024));return new Blob(blocks,{type:'application/x-tar'})}
async function prepareArchive(){let files={};Object.entries(sources).forEach(([p,v])=>files['brain/'+p]=v);files['brain/attachments/sample.txt']='Synthetic local attachment.\n';for(let i=0;i<S.goals.length;i++){const x=S.goals[i];files[`brain/records/goal-${i+1}.md`]=`---\ntype: Goal\n---\n\n# ${x.title}\n\nSynthetic goal; state: ${x.state}.\n`;files[`brain/records/conversation-${i+1}.md`]=`# Conversation\n\n${x.messages.map(m=>m.role+': '+m.text).join('\n\n')}\n`;if(['result','complete'].includes(x.state)||x.prior.length)files[`brain/records/result-${i+1}.md`]=`# Launch-readiness checklist\n\nPreparation only. Build, install, and launch not performed.\n\nSources: [[README]], [[engineering/launch-readiness]]\n`;}exportManifest={schema:'tessera-knowledge-export/v1',prototype:true,execution_restored:false,files:await Promise.all(Object.entries(files).map(async([path,v])=>({path:path.slice(6),bytes:new TextEncoder().encode(v).length,revision:await hash(new TextEncoder().encode(v))}))),exclusions:['unsaved drafts','credential references and values','execution journals','indexes'],dependencies:[],note:'Synthetic prototype fixture only; no production exporter or provider called.'};files['manifest.json']=JSON.stringify(exportManifest,null,2)+'\n';exportBlob=tar(files)}

const previousAction=action;action=async function(a){if(a==='workspace-details'){modal('Halenote workspace','<p>Managed engineering-only brain.</p><div class="field"><label>Selected root</label><input readonly value="/synthetic/halenote-brain"></div><p class="small muted">Writable copy · alpha prototype. No production data or provider calls.</p>');return}if(a.startsWith('connection-focus-')){navigate('connections');setTimeout(()=>document.getElementById('ref-'+a.slice(17))?.focus(),0);return}await previousAction(a);if(a.startsWith('goal-')||a.startsWith('read-'))document.body.classList.remove('list-open');polishIcons();};
$('#list-toggle').onclick=()=>{document.body.classList.toggle('list-open');$('#list-toggle').setAttribute('aria-label',document.body.classList.contains('list-open')?'Show selected detail':'Show item list')};
document.querySelector('.topbar').insertAdjacentHTML('afterend','<nav class="mobile-workspace-nav" aria-label="Mobile workspace navigation">'+['attention','goals','brain','connections','export','library','mobile'].map(n=>`<button data-nav="${n}">${({attention:'Attention',goals:'Goals',brain:'Brain',connections:'Connections',export:'Export',library:'States',mobile:'Mobile concept'})[n]}</button>`).join('')+'<button data-action="mobile-tools">Prototype tools</button></nav>');
const actionWithWorkspace=action;action=async function(a){if(a==='mobile-tools'){modal('Prototype tools',`<p class="small muted">Synthetic data only. Provider calls are mocked.</p><div class="row wrap">${b('Toggle light/dark','mobile-theme')}${b('Toggle density','mobile-density')}${b('Demo guide','mobile-guide')}</div>`+$('#sim-tools').innerHTML);return}if(a==='mobile-theme'){$('#theme').click();return}if(a==='mobile-density'){$('#density').click();return}if(a==='mobile-guide'){close();$('#guide').click();return}await actionWithWorkspace(a)};
// Selection exposes the same detail on narrow screens without throwing away list context.
document.addEventListener('click',e=>{if(e.target.closest('.item[data-source],.item[data-action]'))document.body.classList.remove('list-open')});

document.addEventListener('click',e=>{let menu=document.querySelector('.prototype-tools');if(menu.open&&!menu.contains(e.target))menu.open=false});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').open&&document.querySelector('.prototype-tools').open){document.querySelector('.prototype-tools').open=false;document.querySelector('.prototype-tools>summary').focus();}});

render();
