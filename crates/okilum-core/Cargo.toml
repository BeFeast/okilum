[package]
name = "okilum-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
default = ["brain"]
brain = ["dep:tar"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
comrak = { version = "0.47", features = ["syntect"] }
# Existing locked parsers: block-only index and the same label casefold as comrak.
markdown = "1.0.0"
caseless = "0.2.2"
syntect = "5"
tantivy = "0.26"
# The same stemmers tantivy uses, driven per token by script (see analyzer.rs).
rust-stemmers = "1"
# For the index's date field: tantivy re-exports `time`, and parsing a
# frontmatter date needs the same version it stores.
time = { version = "0.3", features = ["macros", "parsing", "formatting"] }
walkdir = "2"
# Vault change watcher (#6). Version already in the lockfile via gpui.
notify = "7"
regex = "1"
roughr = "=0.14.0"
euclid = "0.22"
palette = "0.7"
# Canonical source/display projection boundaries; already pinned transitively.
unicode-segmentation = "1.13.3"
# Log viewer indexing (#602): line splitting and large-file mapping. Both
# are already in Cargo.lock through tantivy and gpui.
memchr = "2"
# Compressed logs (#1164), read-only. The same crates and versions the
# lockfile already builds (flate2 with the zlib-rs backend zip uses, zstd
# through tantivy, bzip2 on the pure-Rust libbz2-rs-sys backend).
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
zstd = "0.13"
bzip2 = "0.6"
memmap2 = "0.9"

# Exact source snapshots and durable operation receipts (AI Brain POC).
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
# ZIP archives in the Reader (#996). Already in Cargo.lock through velopack; only
# the zlib-rs deflate backend that flate2 already builds here.
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }


# Portable, independently extractable exact brain archives.
tar = { version = "0.4", optional = true }
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
# Reuse the existing HTTP runtime/channel versions for cancellable remote sessions.
tokio = { version = "1", features = ["rt", "sync", "macros", "time", "net"] }
async-channel = "2"

[dev-dependencies]
# Hand-written ZIP fixtures in archive.rs; already in Cargo.lock.
crc32fast = "1"
# An independent CSV parser for the log CSV export (#1387): the test reads the
# file back with code that did not write it.
csv = "1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization", "Win32_System_WindowsProgramming", "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_Shell"] }
