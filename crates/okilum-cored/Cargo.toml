[package]
name = "okilum-cored"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "okilum-cored"
path = "src/main.rs"

[dependencies]
okilum-core = { workspace = true, features = ["brain"] }
anyhow.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde.workspace = true
serde_json.workspace = true

okilum-brain = { path = "../okilum-brain" }

[dev-dependencies]
# Private writer state and temp directory per test process (#3271).
okilum-write-authority = { path = "../okilum-write-authority", features = ["test-isolation"] }
base64 = "0.22"
tempfile = "3"
sha2 = "0.10"
tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
