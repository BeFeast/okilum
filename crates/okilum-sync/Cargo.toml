[package]
name = "okilum-sync"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
okilum-write-authority = { path = "../okilum-write-authority" }
okilum-network-access = { path = "../okilum-network-access" }
anyhow = "1"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking"] }

[dev-dependencies]
# Private writer state and temp directory per test process (#3271).
okilum-write-authority = { path = "../okilum-write-authority", features = ["test-isolation"] }
tempfile = "3"
