[package]
name = "tessera-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
default = ["brain"]
brain = ["dep:tar"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
comrak = { version = "0.47", features = ["syntect"] }
syntect = "5"
tantivy = "0.26"
# The same stemmers tantivy uses, driven per token by script (see analyzer.rs).
rust-stemmers = "1"
# For the index's date field: tantivy re-exports `time`, and parsing a
# frontmatter date needs the same version it stores.
time = { version = "0.3", features = ["macros", "parsing"] }
walkdir = "2"
# Vault change watcher (#6). Version already in the lockfile via gpui.
notify = "7"
regex = "1"
roughr = "=0.14.0"
euclid = "0.22"
palette = "0.7"
# Canonical source/display projection boundaries; already pinned transitively.
unicode-segmentation = "1.13.3"

# Exact source snapshots and durable operation receipts (AI Brain POC).
sha2 = "0.10"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"


# Portable, independently extractable exact brain archives.
tar = { version = "0.4", optional = true }
url = "2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
