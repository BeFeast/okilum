[package]
name = "tessera-cored"
version = "0.1.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "tessera-cored"
path = "src/main.rs"

[dependencies]
tessera-core = { workspace = true, features = ["brain"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true

tessera-brain = { path = "../tessera-brain" }

[dev-dependencies]
base64 = "0.22"
tempfile = "3"
sha2 = "0.10"
tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
