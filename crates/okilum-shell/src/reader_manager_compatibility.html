<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Checking T3 compatibility</title>
<script>
// Keep unsupported syntax inside strings: a regex literal would prevent the
// capability check itself from parsing on Safari 15. No T3 code is loaded here.
(() => {
    let feature = 'negative lookbehind';
    try {
        const negative = new RegExp('(?<!a)b');
        if (!negative.test('b') || negative.test('ab')) throw new Error('incorrect matching');
        feature = 'positive lookbehind';
        const positive = new RegExp('(?<=a)b');
        if (!positive.test('ab') || positive.test('b')) throw new Error('incorrect matching');
        feature = 'named capture groups';
        const named = new RegExp('(?<name>b)').exec('b');
        if (!named || !named.groups || named.groups.name !== 'b') throw new Error('incorrect capture');
        window.ipc.postMessage('webkit-capability:supported');
    } catch (error) {
        window.ipc.postMessage('webkit-capability:unsupported:' + feature + ': ' + String(error));
    }
})();
</script>
</html>
