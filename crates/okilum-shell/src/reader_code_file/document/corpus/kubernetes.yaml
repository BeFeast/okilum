apiVersion: v1
kind: Namespace
metadata:
  name: okilum-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: okilum-demo
  labels: &labels
    app: gateway
    tier: edge
spec:
  replicas: 2
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      containers:
        - name: gateway
          image: ghcr.io/example/gateway:1.4.2
          ports:
            - containerPort: 80
          args: ["--log-level", "info"]
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
          env:
            - name: GREETING
              value: |
                Hello,
                world
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: okilum-demo
spec:
  type: ClusterIP
  selector: { app: gateway }
  ports:
    - port: 80
      targetPort: 80
