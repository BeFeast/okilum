name: CI
on:
  push:
    branches: [main]
  pull_request:
env:
  CARGO_TERM_COLOR: always
defaults:
  run:
    shell: bash
jobs:
  test: &test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    steps:
      - uses: actions/checkout@v4
      - &toolchain
        name: Install toolchain
        run: rustup show
      - name: Test
        run: cargo test --workspace --locked
  lint:
    <<: *test
    strategy:
      matrix:
        os: [ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - *toolchain
      - run: cargo clippy --workspace --all-targets -- -D warnings
