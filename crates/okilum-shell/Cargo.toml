[package]
name = "okilum-shell"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "okilum"
path = "src/main.rs"

[features]
default = ["brain"]
brain = ["okilum-core/brain"]
# Non-publishing Linux visual QA harness; excluded from shipping builds.
settings-ui-harness = []
# Non-publishing downloaded-update visual fixture; never starts an updater.
updater-ui-harness = []
# Non-publishing Project UI fixture; never registers OAuth clients or threads.
project-ui-harness = []

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
okilum-core = { workspace = true, default-features = false }
okilum-t3 = { path = "../okilum-t3" }
# Smart paste converters (#1611): HTML/RTF to Markdown, TSV, code fences, titles.
okilum-paste = { path = "../okilum-paste" }
gpui.workspace = true
gpui_platform.workspace = true
gpui-base = { path = "../../vendor/gpui-component/crates/base" }
gpui-component = { workspace = true, features = ["tree-sitter-languages"] }
gpui-kit-assets.workspace = true
# The Windows HLSL profile uses debug assertions; icons must still be portable.
rust-embed = { version = "8.12.0", features = ["debug-embed"] }
anyhow = "1"
raw-window-handle = { version = "0.6", features = ["std"] }
# Named in GPUI's Platform trait signatures, wrapped for #1121 and #1312; already locked through gpui.
futures = "0.3"
smallvec = "1"
async-channel = "2"
notify = "7"
url = "2"
# Names of downloaded pasted images (#1611); already locked through url.
percent-encoding = "2"
regex = "1"
resvg = "=0.45.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tiff"] }
# Inline PDF pages (#477). Exact pin: 0.x breaks often; an upgrade is a reviewed change.
hayro = "=0.8.0"
# Public release notes and explicit feedback use bounded HTTPS clients.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "multipart"] }
serde_json = "1"
serde_yaml = "0.9"
# Mermaid fences highlight as code (S7e, option C): rendered diagrams failed
# the visual gate. Same ABI as the highlighter's tree-sitter.
tree-sitter = "0.26"
tree-sitter-mermaid = "=0.2.0"
serde.workspace = true
sha2 = "0.10"
similar = { version = "=2.7.0", default-features = false }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
tempfile = "3"
time = { version = "0.3", features = ["formatting", "parsing", "local-offset"] }
# Search labels reuse the editor's grapheme and bidi geometry in production.
unicode-segmentation = "1.12.0"
unicode-bidi = "0.3.18"
unicode-linebreak = "0.1.5"
# Unpacks the bundled Lucide icon set (#1627); already in Cargo.lock via zip.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }

[dev-dependencies]
# Builds ZIP fixtures for the archive viewer tests (#1149); okilum-core already uses it.
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Reads the log CSV export back with a parser that did not write it (#1387).
csv = "1"
velopack = { version = "=1.2.161", features = ["public-utils"] }
gpui = { workspace = true, features = ["test-support"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
gpui_wgpu = { package = "gpui-pre-wgpu", version = "0.3.3" }

[target.'cfg(unix)'.dependencies]
signal-hook-registry = "1"

[target.'cfg(target_os = "linux")'.dependencies]
okilum-sync-controller = { path = "../okilum-sync-controller" }
wayland-client = "=0.31.15"
wayland-protocols-wlr = { version = "=0.3.12", features = ["client"] }
rustix = { version = "=1.1.4", features = ["event", "net", "pipe", "fs", "process"] }
# Already in the graph through GPUI's portal client; used for FileManager1.ShowItems (#612).
zbus = { version = "5.19", default-features = false, features = ["async-io"] }
# Already in the graph; caps glibc malloc arenas at startup (#1256).
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
gpui-wry = { path = "../../vendor/gpui-component/crates/webview" }
wry = { package = "lb-wry", version = "=0.53.3" }
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSPasteboard", "NSPasteboardItem", "NSAttributedString", "NSFont", "NSFontDescriptor", "NSParagraphStyle", "NSTextList"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSAttributedString", "NSData", "NSDictionary", "NSString", "NSFileManager", "NSURL", "NSError", "NSProcessInfo", "NSBundle", "NSRange", "NSValue"] }
rustix = { version = "=1.1.4", features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
dirs = "6"
velopack = "=1.2.161"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Threading"] }

[build-dependencies]
embed-resource = "=3.0.11"

[target.'cfg(target_os = "macos")'.dependencies.fsevent-sys]
version = "4.1"

[target.'cfg(target_os = "macos")'.dependencies.core-foundation-sys]
version = "0.8"
