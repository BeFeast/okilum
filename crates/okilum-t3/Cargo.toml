[package]
name = "okilum-t3"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Okilum's remote control for an area manager in T3 Code: ManagerGateway over T3's OAuth MCP endpoint."

# Every dependency is already in Cargo.lock: the same reqwest feature set
# okilum-sync-controller builds, and the hash/encoding crates okilum-core uses.
[dependencies]
anyhow = "1"
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
toml = "=0.8.23"
toml_edit = "=0.22.27"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
roxmltree = "=0.20.0"
url = "2"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
uuid = { version = "1", features = ["v4"] }
tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
