[package]
name = "okilum-sync-controller"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
# Explicitly selected only by the hosted disposable-runtime crash fixture.
first-sync-fixture = []

[dependencies]
okilum-write-authority = { path = "../okilum-write-authority" }
anyhow = "1"
base64 = "0.22"
sha2 = "0.10"
rustix = { version = "=1.1.4", features = ["process", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

okilum-sync = { path = "../okilum-sync" }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
url = "2"
xmltree = "0.11"
getrandom = "0.3"
globset = "=0.4.20"
ring = "=0.17.14"

[dev-dependencies]
okilum-core = { path = "../okilum-core", default-features = false }
tempfile = "3"

[build-dependencies]
cc = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSString", "NSError", "NSProcessInfo"] }
objc2-service-management = { version = "0.3.2", default-features = false, features = ["std", "objc2", "objc2-foundation", "SMAppService"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Reuse the Reader's native NTFS no-replace publication and retained ancestor handles.
okilum-core = { path = "../okilum-core", default-features = false }
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_TaskScheduler", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_IO", "Win32_Security", "Win32_Security_WinTrust", "Win32_Security_Cryptography", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }
