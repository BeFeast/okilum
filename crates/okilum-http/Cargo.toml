[package]
name = "okilum-http"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
updates = ["dep:velopack", "dep:serde_json"]

[dependencies]
velopack = { version = "=1.2.161", optional = true, features = ["public-utils"] }
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = ["rt", "net", "time", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "multipart", "stream"] }
url = "2"

[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "system-proxy"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization"] }


[dev-dependencies]
velopack = { version = "=1.2.161", features = ["public-utils", "helper-replacement-tests"] }
uuid = { version = "1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "tiff"] }
tempfile = "3"
zip = { version = "9.5", default-features = false }
