[package]
name = "okilum-shell-viewers"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# File viewers, shared viewer chrome, status line, split pane, segmented switch,
# find field, code/delimited/HAR/PDF/archive/canvas/drawing/image/audio/media/
# plain-text/thumbnail viewers, and copy/menu policies below the okilum app
# crate (#3238, epic #3241). Never depends on the app crate or `Reader`.

[features]
default = []
# Test seams the app crate's Reader-integration tests rely on. okilum-shell
# enables it as a dev-dependency only; `okilum --build-info` reports it and
# native_binary_guard.py refuses it.
test-support = []
data-view-native-harness = ["gpui/bench-support"]

[dependencies]
anyhow = "1"
async-channel = "2"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures = "0.3"
gpui = { package = "okilum-gpui", path = "../okilum-gpui" }
gpui-base = { path = "../../vendor/gpui-component/crates/base" }
gpui-component = { workspace = true, features = ["tree-sitter-languages"] }
hayro = "=0.8.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp"] }
log = "0.4"
okilum-core = { workspace = true, default-features = false }
okilum-shell-kit = { path = "../okilum-shell-kit" }
okilum-shell-platform = { path = "../okilum-shell-platform" }
okilum-shell-text = { path = "../okilum-shell-text" }
percent-encoding = "2"
regex = "1"
resvg = "=0.45.1"
rodio = { version = "=0.21.1", default-features = false, features = ["playback", "mp3", "wav", "flac", "vorbis", "mp4", "symphonia-alac"] }
serde.workspace = true
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tempfile = "3"
tree-sitter = "0.26"
unicode-bidi = "0.3.18"
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.12.0"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
webp = { version = "=0.3.1", default-features = false }

[dev-dependencies]
# Private writer state and temp directory per test process (#3271).
okilum-write-authority = { path = "../okilum-write-authority", features = ["test-isolation"] }
okilum-core = { workspace = true, features = ["test-support"] }
okilum-shell-kit = { path = "../okilum-shell-kit", features = ["test-support"] }
okilum-shell-platform = { path = "../okilum-shell-platform", features = ["test-support"] }
okilum-shell-text = { path = "../okilum-shell-text", features = ["test-support"] }
gpui = { package = "okilum-gpui", path = "../okilum-gpui", features = ["test-support"] }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
tar = "0.4"
zip = { version = "9.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
gpui_wgpu = { package = "gpui-pre-wgpu", version = "0.3.3" }
