[package]
name = "okilum-shell-brain"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

# Optional Unix AI Brain client and connector settings UI (#3236, epic #3241).
# Never depends on the app crate or `Reader`. On non-Unix targets this crate
# compiles empty with no Unix-only dependencies so `--workspace` stays clean.

[features]
default = []
# Test seams the app crate's integration tests rely on. okilum-shell enables it
# as a Unix dev-dependency only; `okilum --build-info` reports it and
# native_binary_guard.py refuses it.
test-support = []

[target.'cfg(unix)'.dependencies]
anyhow = "1"
base64 = "0.22"
gpui = { package = "okilum-gpui", path = "../okilum-gpui" }
gpui-base = { path = "../../vendor/gpui-component/crates/base" }
gpui-component = { workspace = true, features = ["tree-sitter-languages"] }
okilum-core = { workspace = true, features = ["brain"] }
okilum-shell-kit = { path = "../okilum-shell-kit", features = ["brain"] }
okilum-shell-platform = { path = "../okilum-shell-platform" }
okilum-shell-text = { path = "../okilum-shell-text" }
okilum-t3 = { path = "../okilum-t3" }
serde.workspace = true
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
similar = { version = "=2.7.0", default-features = false }
tempfile = "3"
time = { version = "0.3", features = ["formatting", "parsing", "local-offset"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(unix)'.dev-dependencies]
# Private writer state and temp directory per test process (#3271).
okilum-write-authority = { path = "../okilum-write-authority", features = ["test-isolation"] }
okilum-core = { workspace = true, features = ["brain", "test-support"] }
okilum-shell-kit = { path = "../okilum-shell-kit", features = ["brain", "test-support"] }
okilum-shell-platform = { path = "../okilum-shell-platform", features = ["test-support"] }
okilum-shell-text = { path = "../okilum-shell-text", features = ["test-support"] }
gpui = { package = "okilum-gpui", path = "../okilum-gpui", features = ["test-support"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
gpui_wgpu = { package = "gpui-pre-wgpu", version = "0.3.3" }
