[package]
name = "tessera-sync-controller"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1"
sha2 = "0.10"
rustix = { version = "=1.1.4", features = ["process", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tessera-sync = { path = "../tessera-sync" }
tempfile = "3"
