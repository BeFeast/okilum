[package]
name = "tessera-sync-controller"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1"
sha2 = "0.10"
rustix = { version = "=1.1.4", features = ["process", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

tessera-sync = { path = "../tessera-sync" }
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls"] }
url = "2"
xmltree = "0.11"
getrandom = "0.3"

[dev-dependencies]
tempfile = "3"
