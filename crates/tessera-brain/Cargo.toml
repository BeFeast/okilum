[package]
name = "tessera-brain"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
tessera-core = { workspace = true, features = ["brain"] }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml = "0.9"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "blocking"] }
tokio = { version = "1", features = ["rt", "sync", "macros", "time", "net"] }
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing"] }
tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }

regex = "1"

tar = "0.4"

# Filesystem events drive derived brain indexing; no periodic full scans.
notify = "7"
