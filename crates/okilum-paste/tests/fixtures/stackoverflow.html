<meta charset='utf-8'><div class="s-prose js-post-body" itemprop="text" style="font-family: -apple-system, BlinkMacSystemFont, &quot;Segoe UI Adjusted&quot;, &quot;Segoe UI&quot;, &quot;Liberation Sans&quot;, sans-serif;"><p style="margin-top: 0px;">Use <a href="https://doc.rust-lang.org/std/vec/struct.Vec.html#method.retain" rel="noreferrer"><code style="font-family: ui-monospace, &quot;Cascadia Mono&quot;, &quot;Segoe UI Mono&quot;, monospace;">Vec::retain</code></a>; it keeps the order:</p><pre class="lang-rust s-code-block" style="font-family: ui-monospace, &quot;Cascadia Mono&quot;, monospace;"><code class="hljs language-rust" data-highlighted="yes"><span class="hljs-keyword">let</span> <span class="hljs-keyword">mut</span> <span class="hljs-variable">v</span> = <span class="hljs-built_in">vec!</span>[<span class="hljs-number">1</span>, <span class="hljs-number">2</span>, <span class="hljs-number">3</span>];
v.<span class="hljs-title function_ invoke__">retain</span>(|&amp;x| x != <span class="hljs-number">2</span>);
</code></pre><blockquote><p>Retains only the elements specified by the predicate.</p></blockquote><p>See also <a href="/questions/26243025/remove-an-element-from-a-vector">this question</a> and the <em>*_mut</em> variants.</p><hr><p><sub>Edited for Rust 2024.</sub></p></div>
