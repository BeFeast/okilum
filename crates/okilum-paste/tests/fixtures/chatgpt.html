<meta charset="utf-8"><p data-start="0" data-end="62">Here’s a quick way to read a file in <strong data-start="35" data-end="45">Python</strong>:</p><pre class="overflow-visible!" data-start="64" data-end="160"><div class="contain-inline-size rounded-2xl relative bg-token-sidebar-surface-primary"><div class="flex items-center text-token-text-secondary px-4 py-2 text-xs font-sans justify-between h-9 bg-token-sidebar-surface-primary select-none rounded-t-2xl">python</div><div class="sticky top-9"><div class="absolute end-0 bottom-0 flex h-9 items-center pe-2"><div class="bg-token-bg-elevated-secondary text-token-text-secondary flex items-center gap-4 rounded-sm px-2 font-sans text-xs"><button class="flex gap-1 items-center select-none py-1" aria-label="Copy"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" class="icon-sm"><path d="M7 5C7"></path></svg>Copy code</button></div></div></div><div class="overflow-y-auto p-4" dir="ltr"><code class="whitespace-pre! language-python"><span><span class="hljs-keyword">with</span></span><span> </span><span><span class="hljs-built_in">open</span></span><span>(</span><span><span class="hljs-string">"notes.md"</span></span><span>) </span><span><span class="hljs-keyword">as</span></span><span> f:

</span></code></div></div></pre><p data-start="162" data-end="190">Key points:</p><ol data-start="192" data-end="300"><li data-start="192" data-end="240"><p data-start="195" data-end="240"><code data-start="195" data-end="201">with</code> closes the file for you.</p></li><li data-start="241" data-end="300"><p data-start="244" data-end="300">Use <code data-start="248" data-end="264">encoding="utf-8"</code> for non-ASCII text, e.g. <em>naïve</em> café.</p><ul><li>Works on Windows too</li></ul></li></ol>
