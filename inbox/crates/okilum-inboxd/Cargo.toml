[package]
name = "okilum-inboxd"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
okilum-sync = { path = "../../../crates/okilum-sync" }
okilum-inbox-domain = { path = "../okilum-inbox-domain" }
rusqlite = { version = "=0.37.0", features = ["bundled"] }
uuid.workspace = true
thiserror.workspace = true

serde.workspace = true
serde_json = "1"
sha2 = "0.10"
url = "2"
webauthn-rs = { version = "=0.5.3", default-features = false }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
webauthn-authenticator-rs = { version = "=0.5.3", default-features = false, features = ["softpasskey"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs"] }
