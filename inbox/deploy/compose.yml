name: okilum-inbox-qa
services:
  init:
    image: okilum-inbox-qa:local
    build:
      context: ../..
      dockerfile: inbox/deploy/Dockerfile
    user: "0:0"
    entrypoint: /bin/sh
    command: ["-ec", "install -d -o 1000 -g 1000 -m 0700 /data /backups; install -d -o 1000 -g 1000 -m 0750 /fixture-vault /fixture-vault/Projects /fixture-vault/Areas /fixture-vault/Resources /fixture-vault/Archives"]
    volumes:
      - data:/data
      - fixture:/fixture-vault
      - backups:/backups
  inbox:
    image: okilum-inbox-qa:local
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped
    ports:
      - "${INBOX_BIND_IP:-10.10.0.34}:8080:8080"
    environment:
      INBOX_ORIGIN: https://inbox-qa.oklabs.uk
      AI_ENDPOINT: ${AI_ENDPOINT:-}
      AI_MODEL: ${AI_MODEL:-}
    volumes:
      - data:/data
      - fixture:/fixture-vault
      - backups:/backups
      - ${CLIPROXY_CREDENTIAL_FILE:-/opt/okilum-inbox/secrets/cliproxy-key}:/run/credentials/cliproxy-key:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:24171/health"]
      interval: 15s
      timeout: 3s
      retries: 5
  ingress:
    image: nginx:1.28-alpine
    network_mode: service:inbox
    depends_on:
      inbox:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
volumes:
  data:
  fixture:
  backups:
