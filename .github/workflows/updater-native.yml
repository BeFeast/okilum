# Explicit worker refs only. The full native shell lanes remain unchanged.
name: updater-native
on:
  push:
    branches: ['updater-native/**']
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '4'
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  OKILUM_SOURCE_COMMIT: ${{ github.sha }}
concurrency:
  group: updater-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sparkle:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact source and native runner
        env:
          SOURCE: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE"
          test "$(uname -m)" = arm64
          rustc -Vv
      - name: Run signed Sparkle negative control and full lifecycle matrix
        run: |
          archive="$RUNNER_TEMP/Sparkle-2.10.0.tar.xz"
          python3 scripts/updater/sparkle.py fetch "$archive"
          python3 scripts/updater/sparkle.py prepare --archive "$archive" --destination vendor/sparkle
          export DYLD_FRAMEWORK_PATH="$PWD/vendor/sparkle"
          python3 scripts/ci/sparkle-freshness/negative_control.py "$archive"
          python3 scripts/ci/sparkle-freshness/run.py "$archive"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-sparkle-restart-evidence
          path: ${{ runner.temp }}/sparkle-freshness-evidence/
          if-no-files-found: error
          retention-days: 7
  icon:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          python3 -m venv "$RUNNER_TEMP/icon-env"
          "$RUNNER_TEMP/icon-env/bin/pip" install CairoSVG==2.8.2
          "$RUNNER_TEMP/icon-env/bin/python" scripts/windows-icon.py crates/okilum-shell/assets/brand/app-icon-light.svg target/windows-dist/okilum.ico
      - uses: actions/upload-artifact@v4
        with:
          name: updater-windows-icon
          path: target/windows-dist/okilum.ico
          if-no-files-found: error
          retention-days: 1
  native-rust:
    needs: icon
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - name: Keep source and vendor patches in LF format
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
            vendor/gpui-component/
            vendor/comrak-0.47.0/
          key: updater-native-v1-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'scripts/vendor-setup.sh', 'scripts/patches/*.diff', '.github/workflows/updater-native.yml') }}-${{ github.sha }}
          restore-keys: |
            updater-native-v1-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'scripts/vendor-setup.sh', 'scripts/patches/*.diff', '.github/workflows/updater-native.yml') }}-
      - uses: actions/download-artifact@v4
        with:
          name: updater-windows-icon
          path: target/windows-dist
      - name: Verify exact source and prepare native dependencies
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$OKILUM_SOURCE_COMMIT"
          bash scripts/vendor-setup.sh
          bash scripts/vendor-setup.sh --verify
          if [[ "$RUNNER_OS" = macOS ]]; then
            test "$(uname -m)" = arm64
            archive="$RUNNER_TEMP/Sparkle-2.10.0.tar.xz"
            python3 scripts/updater/sparkle.py fetch "$archive"
            python3 scripts/updater/sparkle.py prepare --archive "$archive" --destination vendor/sparkle
            echo "DYLD_FRAMEWORK_PATH=$PWD/vendor/sparkle" >> "$GITHUB_ENV"
          fi
      - name: Run native updater, window restoration and final editor guards
        shell: bash
        run: |
          if [[ "$RUNNER_OS" = Windows ]]; then
            OKILUM_WINDOWS_ICON="$(cygpath -w "$PWD/target/windows-dist/okilum.ico")"
            export OKILUM_WINDOWS_ICON
          fi
          filters=(updater:: reader_update_restart::tests:: reader_editor::tests::update_restart_refuses_unprotected_single_file_then_preserves_latest_draft)
          if [[ "$RUNNER_OS" = macOS ]]; then
            filters+=(reader_editor::tests::update_install_post_verification_protects_latest_edits_and_refuses_failure)
          fi
          for filter in "${filters[@]}"; do
            cargo test --locked -p okilum-shell --bin okilum "$filter" -- --list | tee "$RUNNER_TEMP/updater-tests.txt"
            grep -q ': test$' "$RUNNER_TEMP/updater-tests.txt"
            cargo test --locked -p okilum-shell --bin okilum "$filter" -- --nocapture --test-threads=1
          done
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
            vendor/gpui-component/
            vendor/comrak-0.47.0/
          key: ${{ steps.cache.outputs.cache-primary-key }}
