name: sync-v2-HTML-guide-before-after
on:
  push:
    branches: ['sync-v2-docs-html/**']
permissions:
  contents: read
jobs:
  html:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install the existing Help checker media dependency
        run: sudo bash scripts/ci/hosted-ubuntu-apt.sh ffmpeg
      - name: Prepare pinned browser automation
        run: |
          python3 -m venv "$RUNNER_TEMP/help-browser"
          "$RUNNER_TEMP/help-browser/bin/pip" install playwright==1.56.0
          cp scripts/ci/sync-docs-html.py "$RUNNER_TEMP/help-capture.py"
      - name: Capture both changed real HTML sections and verify offline Help
        run: |
          google-chrome --version
          "$RUNNER_TEMP/help-browser/bin/python" "$RUNNER_TEMP/help-capture.py" "$RUNNER_TEMP/html-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-v2-HTML-Help-before-after
          path: ${{ runner.temp }}/html-evidence
          if-no-files-found: error
          retention-days: 5
