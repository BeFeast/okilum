# Forgejo linux-release `release` (#2927): the beta Arch package, built and
# validated on a hosted runner instead of a homelab `ubuntu-latest` runner
# (Okilum left baldr, Oleg 14.11). The pushed commit is the current workflow
# ("tooling") commit; its write-once ref names the exact product source, the
# Forgejo build number (5000 + run number) and the QA harness choice. The
# product is checked out separately, so historical `inputs.source` and pinned
# retry builds use today's orchestration and the old tree's own build scripts.
# The Forgejo bridge waiter stages this artifact as `arch-publication`.
# No cache, signing, publication or Forgejo secrets.
name: forgejo-arch-release
on:
  push:
    branches: ['forgejo-arch-release-pr/**', 'forgejo-arch-qa-pr/**',
               'forgejo-arch-pinned-pr/**', 'forgejo-arch-pinned-qa-pr/**']
permissions:
  contents: read
concurrency:
  group: forgejo-arch-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  arch-release:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel@sha256:51dd3d24f7fba779e7c471caeee7804c50e8c134ad948e19685a1c83a42facc3
    # Observed hosted Arch builds: 13-31 min (forgejo-arch, November 2026).
    timeout-minutes: 45
    steps:
      - name: Install Arch build and packaging tools
        run: |
          pacman -Syu --noconfirm --needed nodejs git python curl cmake clang mold \
            wayland libxkbcommon libxkbcommon-x11 fontconfig freetype2 libxcb alsa-lib \
            vulkan-icd-loader librsvg desktop-file-utils xorg-server-xvfb xorg-xauth xdotool vulkan-swrast dbus
      - name: Check out the workflow tooling
        uses: actions/checkout@v4
        with:
          path: tooling
          persist-credentials: false
      - name: Read the build number and product source from the write-once ref
        id: build
        run: |
          git config --global --add safe.directory '*'
          test "$(git -C tooling rev-parse HEAD)" = "$GITHUB_SHA"
          python tooling/scripts/releases/arch_handoff.py ref --ref "$GITHUB_REF_NAME" --sha "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Check out the exact product source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.build.outputs.source }}
          path: product
          persist-credentials: false
      - name: Prepare build user
        run: useradd -m builder
      - name: Build package as an unprivileged user
        working-directory: product
        env:
          BUILD: ${{ steps.build.outputs.build }}
          HARNESS: ${{ steps.build.outputs.harness }}
          SOURCE: ${{ steps.build.outputs.source }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE"
          chown -R builder:builder "$PWD" /home/builder
          runuser -u builder -- env OKILUM_SETTINGS_UI_HARNESS="$HARNESS" OKILUM_BUILD_VERSION="$BUILD" bash scripts/arch/build.sh
          # Publication reads the built commit from here, not from the run (#1040).
          runuser -u builder -- git -C "$PWD" rev-parse HEAD > dist/arch/release-source.txt
      - name: Validate package and install without changing MIME defaults
        working-directory: product
        run: |
          desktop-file-validate scripts/arch/okilum.desktop
          pacman -U --noconfirm dist/arch/okilum-*.pkg.tar.zst
          okilum --help
          if ldd /usr/bin/okilum | grep 'not found'; then exit 1; fi
          python -m unittest discover -s scripts/arch -p 'test_*.py'
          xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- bash scripts/arch/smoke-x11.sh
      - uses: actions/upload-artifact@v4
        with:
          name: arch-release
          path: |
            product/dist/arch/*.pkg.tar.zst
            product/dist/arch/release-source.txt
          retention-days: 3
          if-no-files-found: error
