name: T3 nightly contract (report only)
'on':
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: t3-contract-nightly
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Official nightly bootstrap and upstream schema comparison
        id: probe
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/t3-contract-target
        continue-on-error: true
        run: python3 scripts/t3-contract/nightly.py run --output "$RUNNER_TEMP/t3-contract-report"
      - name: Open or update the single drift incident
        if: always() && steps.probe.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/t3-contract/nightly.py report --output "$RUNNER_TEMP/t3-contract-report"
      - name: Retain version, schema and complete diff (never server home/logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t3-contract-report
          path: ${{ runner.temp }}/t3-contract-report/
          if-no-files-found: error
          retention-days: 14
      - name: Report observation outcome
        if: always()
        run: |
          python3 - "$RUNNER_TEMP/t3-contract-report/result.json" "$GITHUB_STEP_SUMMARY" <<'PY'
          import json,sys
          from pathlib import Path
          result=json.loads(Path(sys.argv[1]).read_text())
          with open(sys.argv[2], 'a') as summary:
              summary.write('## T3 nightly contract (report only)\n\n```json\n'+json.dumps(result,indent=2)+'\n```\n')
          PY
