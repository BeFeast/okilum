# Forgejo excalidraw-compat (nightly, non-blocking): check Excalidraw writer
# output with the Obsidian plugin's own loader, on a hosted runner instead of
# the `docker` label that also matched baldr (Oleg 14.11).
# Test-only oracle: the AGPL-3.0 plugin source is fetched at test time (pinned
# commit, sha256-verified) and is not committed, packaged, uploaded or
# distributed. This job uploads no artifacts and uses no secrets or caches.
name: forgejo-excalidraw
on:
  push:
    branches: ['forgejo-excalidraw-pr/**']
permissions:
  contents: read
concurrency:
  group: forgejo-excalidraw-${{ github.ref }}
  cancel-in-progress: false
jobs:
  excalidraw:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_INCREMENTAL: '0'
      RUSTFLAGS: '-C link-arg=-fuse-ld=mold'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Oracle paths outside the checkout
        run: |
          echo "ORACLE_DIR=$RUNNER_TEMP/excalidraw-oracle" >> "$GITHUB_ENV"
          echo "OKILUM_EXCALIDRAW_DUMP=$RUNNER_TEMP/excalidraw-dump" >> "$GITHUB_ENV"
      - name: Install build tools
        timeout-minutes: 10
        run: |
          sudo bash scripts/ci/hosted-ubuntu-apt.sh build-essential cmake pkg-config curl git mold
          node --version
      - name: Verify pinned Rust toolchain
        run: |
          rustc -Vv
          cargo --version
      # Cargo resolves the whole workspace, and okilum-shell points at vendor.
      - name: Resolve pinned workspace path dependencies
        run: |
          scripts/vendor-setup.sh
          scripts/vendor-setup.sh --verify
      - name: Writer tests, keeping every checked file
        run: cargo test -p okilum-core --test excalidraw_write
      - name: Fetch and verify the plugin (sha256), build the oracle
        working-directory: scripts/excalidraw-compat
        run: |
          set -euo pipefail
          ./fetch-plugin.sh "$ORACLE_DIR/fetch"
          npm ci --no-audit --no-fund
          node build.mjs "$ORACLE_DIR/fetch/plugin" "$ORACLE_DIR/oracle.cjs"
      - name: Load writer output with the plugin's own loader
        working-directory: scripts/excalidraw-compat
        run: node check.cjs "$ORACLE_DIR/oracle.cjs" "$OKILUM_EXCALIDRAW_DUMP"
      - name: Remove fetched plugin sources
        if: always()
        run: rm -rf "$ORACLE_DIR/fetch/plugin" "$ORACLE_DIR/oracle.cjs"
