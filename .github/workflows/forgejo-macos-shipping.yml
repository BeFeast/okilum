# Signing inputs must be separately approved/provisioned. Missing credentials stop
# before Cargo; tests/merge do not authorize secret/key-holder mutations.
name: forgejo-macos-shipping
run-name: Mac shipping Forgejo ${{ inputs.producer }} attempt ${{ inputs.attempt }}
on:
  workflow_dispatch:
    inputs:
      verify_only:
        description: 'Exact maintainer-authorized PR validation artifact; NEVER publish'
        default: 'false'
      verify_pr:
        default: ''
      verify_evidence:
        description: 'Protected bridge admission digest, bound to write-once GitHub attestation tag'
        default: ''
      source:
        required: true
      build:
        required: true
      producer:
        required: true
      producer_number:
        required: true
      attempt:
        required: true
      signing_identity:
        required: true
      notary_profile:
        required: true
env:
  VERIFY_ONLY: ${{ inputs.verify_only }}
  HOSTED_VERIFY: ${{ inputs.verify_only }}
  VERIFY_SOURCE: ${{ inputs.source }}
  VERIFY_PR: ${{ inputs.verify_pr }}
  VERIFY_EVIDENCE: ${{ inputs.verify_evidence }}
  PRODUCER: ${{ inputs.producer }}
  VERIFY_GITHUB_TOKEN: ${{ github.token }}
permissions:
  contents: read
concurrency:
  # Beta shipping runs share one group: a newer main push supersedes an
  # unfinished older one (its Forgejo producer was already cancelled), and the
  # always() keychain cleanup still runs on cancellation. Verify-only PR
  # artifacts keep a per-source group and always finish.
  group: macos-shipping-${{ inputs.verify_only == 'true' && inputs.source || 'beta' }}
  cancel-in-progress: ${{ inputs.verify_only != 'true' }}
jobs:
  shipping:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare explicitly scoped ephemeral signing keychain
        env:
          PRODUCT_SOURCE: ${{ inputs.source }}
          OKILUM_SIGNING_IDENTITY: ${{ inputs.signing_identity }}
          OKILUM_NOTARY_PROFILE: ${{ inputs.notary_profile }}
          OKILUM_MAC_CERT_SHA256: ${{ secrets.OKILUM_MAC_CERT_SHA256 }}
          OKILUM_MAC_DEVELOPER_ID_P12: ${{ secrets.OKILUM_MAC_DEVELOPER_ID_P12 }}
          OKILUM_MAC_DEVELOPER_ID_PASSWORD: ${{ secrets.OKILUM_MAC_DEVELOPER_ID_PASSWORD }}
          OKILUM_MAC_NOTARY_APPLE_ID: ${{ secrets.OKILUM_MAC_NOTARY_APPLE_ID }}
          OKILUM_MAC_NOTARY_PASSWORD: ${{ secrets.OKILUM_MAC_NOTARY_PASSWORD }}
          OKILUM_MAC_NOTARY_TEAM: ${{ secrets.OKILUM_MAC_NOTARY_TEAM }}
        run: |
          cp scripts/releases/macos-keychain.py "$RUNNER_TEMP/okilum-keychain-cleanup.py"
          python3 scripts/releases/macos-keychain.py setup
      - name: Validate source and approved signing capability before compilation
        env:
          PRODUCT_SOURCE: ${{ inputs.source }}
          SHIPPING_BUILD: ${{ inputs.build }}
          PRODUCER: ${{ inputs.producer }}
          PRODUCER_NUMBER: ${{ inputs.producer_number }}
          PRODUCER_ATTEMPT: ${{ inputs.attempt }}
          OKILUM_SIGNING_IDENTITY: ${{ inputs.signing_identity }}
          OKILUM_NOTARY_PROFILE: ${{ inputs.notary_profile }}
        run: |
          if [ "$VERIFY_ONLY" = true ]; then
            python3 -c 'import sys,os; sys.path.insert(0,"scripts/releases"); from macos_verify_authorization import authorize; authorize(dict(os.environ))'
          else
            python3 scripts/releases/macos-hosted.py preflight
          fi
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            ~/.cache/okilum-macos/reader-arm64/
          key: beta-macos-v2-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'scripts/patches/*.diff') }}
      - name: Build, sign and notarize exact product source
        env:
          PRODUCT_SOURCE: ${{ inputs.source }}
          SHIPPING_BUILD: ${{ inputs.build }}
          PRODUCER: ${{ inputs.producer }}
          PRODUCER_NUMBER: ${{ inputs.producer_number }}
          PRODUCER_ATTEMPT: ${{ inputs.attempt }}
          OKILUM_SIGNING_IDENTITY: ${{ inputs.signing_identity }}
          OKILUM_NOTARY_PROFILE: ${{ inputs.notary_profile }}
          SPARKLE_PUBLIC_ED_KEY: TH/Jc6vRfSSFtR3R2rLqBGBnFylMUWdKJ6dr18Ys8CY=
        run: |
          if [ "$VERIFY_ONLY" = true ]; then
            python3 scripts/ci/macos-native-verify.py
          else
            python3 scripts/releases/macos-hosted.py build
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.verify_only == 'true' && 'macos-verify' || 'macos-shipping' }}-${{ inputs.source }}-${{ inputs.build }}
          path: ${{ inputs.verify_only == 'true' && format('{0}/native-verify/*', runner.temp) || 'dist/shipping-download/*' }}
          if-no-files-found: error
          retention-days: 7
      - name: Remove ephemeral signing material
        if: always()
        continue-on-error: true
        run: |
          if [ -f "$RUNNER_TEMP/okilum-keychain-cleanup.py" ]; then
            python3 "$RUNNER_TEMP/okilum-keychain-cleanup.py" cleanup || {
              echo "::warning::Ephemeral signing cleanup failed; hosted runner disposal will remove remaining material"
              exit 1
            }
          fi
