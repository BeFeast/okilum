# Compatibility entrypoint: consumes required CI bytes; never compiles.
name: forgejo-linux-binary
on:
  push:
    branches: ['forgejo-linux-binary-pr/**']
permissions:
  contents: read
  actions: read
jobs:
  linux-binary:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install runtime verification tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zstd libvulkan1 libxkbcommon-x11-0 libxcb1 libwayland-client0
      - name: Reuse required Linux production payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/github-linux.py resolve
      - uses: actions/upload-artifact@v4
        with:
          name: linux-qa-reuse-${{ github.sha }}
          path: |
            dist/linux-production/payload/okilum
            dist/linux-production/receipt.json
            dist/linux-production/delivery.jsonl
          retention-days: 3
          if-no-files-found: error
