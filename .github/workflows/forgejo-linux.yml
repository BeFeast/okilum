# Permanent Forgejo PR/main lane. Disposable signing only; no live publication.
name: forgejo-linux
on:
  push:
    branches: [main, 'forgejo-linux-pr/**']
  schedule:
    - cron: '5 22 * * 2,6'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forgejo-linux-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux-checks:
    if: github.ref != 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # The vendored gpui-kit tests (scripts/ci/vendor-tests.sh) add ~25 min when they run.
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install system libraries
        timeout-minutes: 10
        run: |
          sudo bash scripts/ci/hosted-ubuntu-apt.sh \
            build-essential cmake pkg-config curl git mold zstd gnupg gpgv \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig-dev libfreetype-dev libxcb1-dev
      - name: Verify pinned toolchain
        run: |
          rustc -Vv
          cargo clippy --version
          cargo fmt --version
      - name: Prepare pinned vendor
        run: |
          scripts/vendor-setup.sh
          scripts/vendor-setup.sh --verify
      # Consume the existing public-ci main baseline, never add per-PR target
      # archives to the shared 10 GiB budget. Missing cache is a normal cold build.
      - name: Restore existing main Cargo cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'scripts/vendor-setup.sh', 'scripts/patches/*.diff') }}
      - name: Verify acceptance instrument failure controls
        run: python3 scripts/appimage/test_update_acceptance.py
      - name: Run full Linux gate
        run: bash scripts/ci/check-linux.sh

  # One source-pinned product build; both distributions consume its exact bytes.
  appimage:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '4'
      # linuxdeploy's ELF rewriting overlaps mold 1.0.3's early relocation table.
      # Use GNU bfd for this portable artifact; other Linux lanes keep their linker.
      RUSTFLAGS: '-C link-arg=-fuse-ld=bfd'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Ubuntu 22.04 build dependencies
        timeout-minutes: 10
        run: |
          sudo bash scripts/ci/hosted-ubuntu-apt.sh \
            build-essential cmake pkg-config curl git mold file patchelf gpgv \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig-dev libfreetype-dev libxcb1-dev libvulkan1
      - uses: actions/cache@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'schedule'
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: beta-appimage-v2-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'scripts/patches/*.diff') }}
      - name: Build exact-source AppImage once
        if: github.event_name != 'schedule'
        run: bash scripts/appimage/build.sh
      - name: Reuse original main AppImage for nightly acceptance
        if: github.event_name == 'schedule'
        env:
          MIRROR_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYREUSE'
          import os, sys, tempfile
          from pathlib import Path
          sys.path.insert(0, 'scripts/releases')
          import appimage_handoff as handoff
          api = handoff.artifact.transport.GitHub()
          with tempfile.TemporaryDirectory() as temporary:
              transfer = Path(temporary)
              handoff.stage(api, os.environ['GITHUB_SHA'], transfer,
                  lambda aid: handoff.artifact.download(api.token, aid))
              handoff.unpack(transfer, Path('dist/appimage'))
              Path('dist/retained').mkdir(parents=True, exist_ok=True)
              Path('dist/retained/acceptance.json').write_bytes((transfer / 'acceptance.json').read_bytes())
          PYREUSE
      # Deliver bytes before compatibility testing; failed smoke is visible evidence.
      - uses: actions/upload-artifact@v4
        id: producer
        with:
          name: linux-appimage-${{ github.sha }}
          path: |
            dist/appimage/Okilum-x86_64.AppImage
            dist/appimage/SHA256SUMS
            dist/appimage/provenance.json
            dist/appimage/bundled-libraries.txt
          retention-days: 7
          if-no-files-found: error
      - name: Verify AppImage package
        run: |
          cd dist/appimage
          sha256sum -c SHA256SUMS
          chmod +x Okilum-x86_64.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ./Okilum-x86_64.AppImage --help
      - name: Verify unchanged AppImage on clean Ubuntu and Fedora
        if: github.ref != 'refs/heads/main' || github.event_name != 'push'
        run: |
          set -euo pipefail
          mkdir -p dist/appimage/evidence
          for image in ubuntu:24.04 fedora:44; do
            docker run --rm --network bridge \
              -v /etc/ssl/certs/ca-certificates.crt:/ci-ca-certificates.crt:ro \
              -v "$PWD/dist/appimage:/artifact:ro" -v "$PWD:/source:ro" \
              "$image" bash /source/scripts/appimage/smoke.sh \
              2>&1 | tee "dist/appimage/evidence/${image//:/-}.log"
          done
      - name: Verify signed AppImage installation with disposable CI key
        if: github.ref != 'refs/heads/main' || github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          APPIMAGE_ARTIFACT_ID: ${{ steps.producer.outputs.artifact-id }}
          APPIMAGE_RETAINED_RECEIPT: ${{ github.event_name == 'schedule' && 'dist/retained/acceptance.json' || '' }}
        run: |
          set -euo pipefail
          python3 scripts/releases/appimage_ci.py dist/appimage \
            2>&1 | tee dist/appimage/evidence/signature-install.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-appimage-evidence-${{ github.sha }}
          path: dist/appimage/evidence/
          retention-days: 7
          if-no-files-found: warn

  linux:
    needs: [linux-checks, appimage]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run full Linux gate
        env:
          CHECKS: ${{ needs.linux-checks.result }}
          APPIMAGE: ${{ needs.appimage.result }}
        run: python3 scripts/ci/gate-step.py --name 'Run full Linux gate' -- bash -c 'if [ "$GITHUB_REF" = refs/heads/main ] && [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then test "$CHECKS" = skipped; else test "$CHECKS" = success; fi; test "$APPIMAGE" = success'
