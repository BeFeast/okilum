# Permanent Forgejo PR/main lane. Disposable signing only; no live publication.
name: forgejo-linux
on:
  # Forgejo creates the write-once forgejo-linux-pr/hourly-<source> ref for each
  # main push beta (the name predates push betas); its push starts the producer.
  push:
    branches: ['forgejo-linux-pr/**']
  schedule:
    - cron: '5 22 * * 2,6'
  workflow_dispatch:
    inputs:
      source:
        description: 'Optional exact main source requested by the Forgejo beta producer'
        default: ''
permissions:
  contents: read
concurrency:
  # One group per ref. Every write-once beta ref has its own group, so a newer
  # main push never cancels the producer of an older one: each Forgejo push beta
  # runs to completion in parallel (manager 13.11) and the publisher files an
  # older build as archive-only. A re-push of a PR proxy ref still supersedes.
  group: forgejo-linux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  select:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.select.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
          HOURLY_SOURCE: ${{ inputs.source }}
          NIGHTLY: ${{ github.event.schedule == '5 22 * * 2,6' }}
        run: |
          if [ "$NIGHTLY" = true ]; then echo 'build=true' >> "$GITHUB_OUTPUT";
          else python3 scripts/releases/hourly_beta.py linux; fi

  linux-checks:
    if: (github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/forgejo-linux-pr/hourly-')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # The vendored gpui-kit tests (scripts/ci/vendor-tests.sh) add ~25 min when they run.
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install system libraries
        timeout-minutes: 10
        run: |
          sudo bash scripts/ci/hosted-ubuntu-apt.sh \
            build-essential cmake pkg-config curl git mold zstd python3-venv gnupg gpgv \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig-dev libfreetype-dev libxcb1-dev libasound2-dev
      - name: Verify pinned toolchain
        run: |
          rustc -Vv
          cargo clippy --version
          cargo fmt --version
      - name: Prepare pinned vendor
        run: |
          scripts/vendor-setup.sh
          scripts/vendor-setup.sh --verify
      # Consume the existing public-ci main baseline, never add per-PR target
      # archives to the shared 10 GiB budget. Missing cache is a normal cold build.
      - name: Restore existing main Cargo cache
        uses: actions/cache/restore@v4
        continue-on-error: true
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'scripts/vendor-setup.sh', 'scripts/patches/*.diff') }}
      - name: Verify acceptance instrument failure controls
        run: python3 scripts/appimage/test_update_acceptance.py
      - name: Prepare isolated Python test dependencies
        run: bash scripts/ci/setup-python-tests.sh
      - name: Run full Linux gate
        run: bash scripts/ci/check-linux.sh

  # One source-pinned product build; both distributions consume its exact bytes.
  appimage:
    needs: select
    if: needs.select.outputs.build == 'true'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    outputs:
      artifact-id: ${{ steps.producer.outputs.artifact-id }}
    # Keep this env identical to beta-appimage-cache.yml: rust-cache keys on it.
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '4'
      # linuxdeploy's ELF rewriting overlaps mold 1.0.3's early relocation table.
      # Use GNU bfd for this portable artifact; other Linux lanes keep their linker.
      RUSTFLAGS: '-C link-arg=-fuse-ld=bfd'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Ubuntu 22.04 build dependencies
        timeout-minutes: 10
        run: |
          sudo bash scripts/ci/hosted-ubuntu-apt.sh \
            build-essential cmake pkg-config curl git mold file patchelf gpgv \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig-dev libfreetype-dev libxcb1-dev libasound2-dev libvulkan1
      # Beta producers run on write-once forgejo-linux-pr/hourly-<sha> refs, whose
      # own cache scope is never reused. They restore the registry-dependency
      # cache that beta-appimage-cache.yml saves on main (any branch may read
      # main's caches) and never save (10 GB repo quota, #2881). rust-cache keeps
      # only registry/git dependencies: workspace and vendored path crates always
      # compile from this checkout, so a restore can never stand in for product code.
      # A Cargo.lock change falls back to the newest entry for the same toolchain/env.
      - uses: Swatinem/rust-cache@v2
        if: github.event.schedule != '5 22 * * 2,6'
        with:
          shared-key: beta-appimage-v1
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build exact-source AppImage once
        if: github.event.schedule != '5 22 * * 2,6'
        run: bash scripts/appimage/build.sh
      - name: Reuse original main AppImage for nightly acceptance
        if: github.event.schedule == '5 22 * * 2,6'
        env:
          MIRROR_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYREUSE'
          import os, sys, tempfile
          from pathlib import Path
          sys.path.insert(0, 'scripts/releases')
          import appimage_handoff as handoff
          api = handoff.artifact.transport.GitHub()
          with tempfile.TemporaryDirectory() as temporary:
              transfer = Path(temporary)
              handoff.stage(api, os.environ['GITHUB_SHA'], transfer,
                  lambda aid: handoff.artifact.download(api.token, aid))
              handoff.unpack(transfer, Path('dist/appimage'))
              Path('dist/retained').mkdir(parents=True, exist_ok=True)
              Path('dist/retained/acceptance.json').write_bytes((transfer / 'acceptance.json').read_bytes())
          PYREUSE
      # Deliver bytes before compatibility testing; failed smoke is visible evidence.
      - uses: actions/upload-artifact@v4
        id: producer
        with:
          name: linux-appimage-${{ github.sha }}
          path: |
            dist/appimage/Okilum-x86_64.AppImage
            dist/appimage/SHA256SUMS
            dist/appimage/provenance.json
            dist/appimage/bundled-libraries.txt
          retention-days: 7
          if-no-files-found: error
      - name: Verify AppImage package
        run: |
          cd dist/appimage
          sha256sum -c SHA256SUMS
          chmod +x Okilum-x86_64.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 ./Okilum-x86_64.AppImage --help
      # A pushed beta ref runs these two checks in appimage-acceptance instead, so
      # the Forgejo bridge can take the bytes once this job completes. They stay
      # the beta gate: publication waits for them (appimage_handoff.acceptance).
      # PR proxies, dispatches and nightly keep them here.
      - name: Verify unchanged AppImage on clean Ubuntu and Fedora
        if: (github.ref != 'refs/heads/main' || github.event_name == 'workflow_dispatch' || github.event.schedule == '5 22 * * 2,6') && !(github.event_name == 'push' && startsWith(github.ref, 'refs/heads/forgejo-linux-pr/hourly-'))
        run: |
          set -euo pipefail
          mkdir -p dist/appimage/evidence
          for image in ubuntu:24.04 fedora:44; do
            docker run --rm --network bridge \
              -v /etc/ssl/certs/ca-certificates.crt:/ci-ca-certificates.crt:ro \
              -v "$PWD/dist/appimage:/artifact:ro" -v "$PWD:/source:ro" \
              "$image" bash /source/scripts/appimage/smoke.sh \
              2>&1 | tee "dist/appimage/evidence/${image//:/-}.log"
          done
      - name: Verify signed AppImage installation with disposable CI key
        if: (github.ref != 'refs/heads/main' || github.event_name == 'workflow_dispatch' || github.event.schedule == '5 22 * * 2,6') && !(github.event_name == 'push' && startsWith(github.ref, 'refs/heads/forgejo-linux-pr/hourly-'))
        env:
          GH_TOKEN: ${{ github.token }}
          APPIMAGE_ARTIFACT_ID: ${{ steps.producer.outputs.artifact-id }}
          APPIMAGE_RETAINED_RECEIPT: ${{ github.event.schedule == '5 22 * * 2,6' && 'dist/retained/acceptance.json' || '' }}
        run: |
          set -euo pipefail
          python3 scripts/releases/appimage_ci.py dist/appimage \
            2>&1 | tee dist/appimage/evidence/signature-install.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-appimage-evidence-${{ github.sha }}
          path: dist/appimage/evidence/
          retention-days: 7
          if-no-files-found: warn

  # Same two checks on the same uploaded bytes for a pushed beta ref, while the
  # Forgejo bridge already takes them. Beta gate: Forgejo publishes only after
  # this job succeeded (appimage_handoff.py await-acceptance). Job and step names
  # are part of that contract.
  appimage-acceptance:
    needs: appimage
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/forgejo-linux-pr/hourly-')
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: linux-appimage-${{ github.sha }}
          path: dist/appimage
      - name: Verify unchanged AppImage on clean Ubuntu and Fedora
        run: |
          set -euo pipefail
          cd dist/appimage
          sha256sum -c SHA256SUMS
          chmod +x Okilum-x86_64.AppImage
          cd ../..
          mkdir -p dist/appimage/evidence
          for image in ubuntu:24.04 fedora:44; do
            docker run --rm --network bridge \
              -v /etc/ssl/certs/ca-certificates.crt:/ci-ca-certificates.crt:ro \
              -v "$PWD/dist/appimage:/artifact:ro" -v "$PWD:/source:ro" \
              "$image" bash /source/scripts/appimage/smoke.sh \
              2>&1 | tee "dist/appimage/evidence/${image//:/-}.log"
          done
      - name: Verify signed AppImage installation with disposable CI key
        env:
          GH_TOKEN: ${{ github.token }}
          APPIMAGE_ARTIFACT_ID: ${{ needs.appimage.outputs.artifact-id }}
        run: |
          set -euo pipefail
          python3 scripts/releases/appimage_ci.py dist/appimage \
            2>&1 | tee dist/appimage/evidence/signature-install.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-appimage-acceptance-evidence-${{ github.sha }}
          path: dist/appimage/evidence/
          retention-days: 7
          if-no-files-found: warn

  linux:
    needs: [select, linux-checks, appimage]
    if: always() && needs.select.outputs.build == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run full Linux gate
        env:
          CHECKS: ${{ needs.linux-checks.result }}
          APPIMAGE: ${{ needs.appimage.result }}
        run: python3 scripts/ci/gate-step.py --name 'Run full Linux gate' -- bash -ec 'if { [ "$GITHUB_REF" = refs/heads/main ] || [[ "$GITHUB_REF" = refs/heads/forgejo-linux-pr/hourly-* ]]; } && [ "$GITHUB_EVENT_NAME" != workflow_dispatch ]; then test "$CHECKS" = skipped; else test "$CHECKS" = success; fi; test "$APPIMAGE" = success'
