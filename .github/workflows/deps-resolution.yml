name: deps-resolution
on:
  push:
    branches: ['deps-resolution/**']
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare the unchanged vendor trees
        run: |
          bash scripts/vendor-setup.sh
          bash scripts/vendor-setup.sh --verify
      - name: Resolve only named compatible updates
        run: python3 deps-resolve.py
      - uses: actions/upload-artifact@v4
        with:
          name: resolved-lockfiles
          path: |
            Cargo.lock
            inbox/Cargo.lock
          if-no-files-found: error
