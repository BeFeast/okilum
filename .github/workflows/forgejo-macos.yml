# Trusted same-repository Forgejo PR heads only. External GitHub PRs use ci.yml.
# No Forgejo token, signing identity, publishing or access to the private LAN.
name: forgejo-macos

on:
  push:
    branches: ['forgejo-pr/**']
  workflow_dispatch:

permissions:
  contents: read

# Trusted PR refs remain immediate. Main beta signs through forgejo-macos-shipping;
# the former hourly main tick could not reach Forgejo admission and never built.
concurrency:
  group: forgejo-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select:
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.select.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/releases/hourly_beta.py macos

  macos:
    needs: select
    if: needs.select.outputs.build == 'true'
    runs-on: ${{ vars.OKILUM_GITHUB_MACOS_RUNNER || 'macos-15' }} # Unset restores the free lane.
    # Release tests run alongside the production/Sparkle job below (#2829).
    # Cold serial production + test compilation exceeded the bridge runner cap.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify native runner
        run: test "$(uname -m)" = arm64
      # Caches from unique sibling forgejo-pr refs are invisible to each other.
      # Only main writes the shared baseline; PRs consume it without duplicating GBs.
      - name: Restore native Cargo cache
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            ~/.cache/okilum-macos/reader-arm64/
          key: forgejo-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'scripts/ci/check-macos.sh', 'scripts/vendor-setup.sh', 'scripts/patches/*.diff') }}
          # An older main cache still holds most compiled dependencies; cargo rebuilds
          # only what changed. Without it nearly every PR built from scratch (#1074).
          restore-keys: |
            forgejo-native-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Compile Reader and run quick native regressions
        id: native
        shell: bash
        run: python3 scripts/ci/gate-step.py --name 'Compile Reader and run quick native regressions' -- bash scripts/ci/check-macos.sh tests
      - name: Save shared native Cargo cache
        if: github.ref == 'refs/heads/main' && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            ~/.cache/okilum-macos/reader-arm64/
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Save native thumbnail evidence
        if: always() && steps.native.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: native-thumbnail-evidence
          path: ${{ runner.temp }}/thumbnail-evidence/
      - name: Save Sparkle lifecycle evidence
        if: always() && steps.native.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: native-sparkle-freshness-evidence
          path: ${{ runner.temp }}/sparkle-freshness-evidence/
          if-no-files-found: warn

  production:
    needs: select
    if: needs.select.outputs.build == 'true'
    runs-on: ${{ vars.OKILUM_GITHUB_MACOS_RUNNER || 'macos-15' }} # Unset restores the free lane.
    # Independent cold production build; same release profile and source.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify native runner
        run: test "$(uname -m)" = arm64
      # Caches from unique sibling forgejo-pr refs are invisible to each other.
      # Only main writes the shared baseline; PRs consume it without duplicating GBs.
      - name: Restore native Cargo cache
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            ~/.cache/okilum-macos/reader-arm64/
          key: forgejo-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'scripts/ci/check-macos.sh', 'scripts/vendor-setup.sh', 'scripts/patches/*.diff') }}
          # An older main cache still holds most compiled dependencies; cargo rebuilds
          # only what changed. Without it nearly every PR built from scratch (#1074).
          restore-keys: |
            forgejo-native-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Compile production Reader and verify Sparkle lifecycle
        id: native
        shell: bash
        run: python3 scripts/ci/gate-step.py --name 'Compile production Reader and verify Sparkle lifecycle' -- bash scripts/ci/check-macos.sh production
      - name: Save Sparkle lifecycle evidence
        if: always() && steps.native.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: production-sparkle-freshness-evidence
          path: ${{ runner.temp }}/sparkle-freshness-evidence/
          if-no-files-found: warn
