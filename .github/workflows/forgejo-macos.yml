# Trusted same-repository Forgejo PR heads only. External GitHub PRs use ci.yml.
# No Forgejo token, signing identity, publishing or access to the private LAN.
name: forgejo-macos

on:
  push:
    branches: [main, 'forgejo-pr/**']

permissions:
  contents: read

# main runs only refresh the shared native cache. A running refresh is not cancelled:
# when every merge cancelled it, the cache was never saved and PRs built cold. Only
# the newest pending main run waits behind it. forgejo-pr/* refs are unique per PR
# head, so PR checks are never cancelled here.
concurrency:
  group: forgejo-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-15 # GitHub's standard public-repository arm64 runner.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify native runner
        run: test "$(uname -m)" = arm64
      # Caches from unique sibling forgejo-pr refs are invisible to each other.
      # Only main writes the shared baseline; PRs consume it without duplicating GBs.
      - name: Restore native Cargo cache
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            ~/.cache/okilum-macos/reader-arm64/
          key: forgejo-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'scripts/ci/check-macos.sh', 'scripts/vendor-setup.sh', 'scripts/patches/*.diff') }}
          # An older main cache still holds most compiled dependencies; cargo rebuilds
          # only what changed. Without it nearly every PR built from scratch (#1074).
          restore-keys: |
            forgejo-native-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Compile Reader and run quick native regressions
        id: native
        if: github.ref != 'refs/heads/main' || steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash scripts/ci/check-macos.sh
      - name: Save shared native Cargo cache
        if: github.ref == 'refs/heads/main' && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            ~/.cache/okilum-macos/reader-arm64/
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Save native thumbnail evidence
        if: always() && steps.native.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: native-thumbnail-evidence
          path: ${{ runner.temp }}/thumbnail-evidence/
