# Trusted same-repository Forgejo PR heads only. External GitHub PRs use ci.yml.
# No Forgejo token, signing identity, publishing or access to the private LAN.
name: forgejo-macos

on:
  push:
    branches: [main, 'forgejo-pr/**']

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15 # GitHub's standard public-repository arm64 runner.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify native runner
        run: test "$(uname -m)" = arm64
      # Caches from unique sibling forgejo-pr refs are invisible to each other.
      # Only main writes the shared baseline; PRs consume it without duplicating GBs.
      - name: Restore native Cargo cache
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            ~/.cache/tessera-macos/1.96.1-arm64/
          key: forgejo-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'scripts/ci/check-macos.sh', 'scripts/vendor-setup.sh', 'scripts/patches/*.diff') }}
      - name: Compile Reader and run quick native regressions
        id: native
        if: github.ref != 'refs/heads/main' || steps.native-cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash scripts/ci/check-macos.sh
      - name: Save shared native Cargo cache
        if: github.ref == 'refs/heads/main' && steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            ~/.cache/tessera-macos/1.96.1-arm64/
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Save native thumbnail evidence
        if: always() && steps.native.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: native-thumbnail-evidence
          path: ${{ runner.temp }}/thumbnail-evidence/
