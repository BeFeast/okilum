# #1662: same-runner shipped input A/B; measurement-only scroll is report-only.
name: forgejo-perf-linux
on:
  push:
    branches: ['forgejo-perf-linux-pr/**']
  workflow_dispatch:
    inputs:
      calibration_runs:
        description: 'Paired gate runs on the same main/PR binaries (calibration only)'
        type: choice
        options: ['1', '2', '3', '4', '5']
        default: '1'
permissions:
  contents: read
  actions: read
concurrency:
  group: forgejo-perf-linux-${{ github.ref }}
  cancel-in-progress: false
jobs:
  perf-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '4'
      RUSTFLAGS: '-C link-arg=-fuse-ld=mold'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build and runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential cmake pkg-config curl git mold zstd \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig-dev libfreetype-dev libxcb1-dev libvulkan1 mesa-vulkan-drivers \
            xvfb xdotool x11-apps xclip dbus
      - name: Prepare pinned vendor
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          rustc -Vv
          scripts/vendor-setup.sh
          scripts/vendor-setup.sh --verify
      - name: Validate editor collector and budgets
        run: python3 -m unittest discover -s scripts/perf/editor -p 'test_*.py'
      - name: Record CPU and runner identity
        run: |
          python3 -c 'import json,sys; sys.path.insert(0,"scripts/perf/editor"); import ab; print(json.dumps(ab.hardware(),indent=2))' > "$RUNNER_TEMP/ab-hardware.json"
      - name: Pin main and build both unpatched release binaries
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          main_sha=$(git rev-parse origin/main)
          python3 scripts/perf/editor/build-ab.py "$main_sha" "$RUNNER_TEMP/ab-binaries"
      - name: Build the measurement-only scroll binary
        continue-on-error: true
        run: |
          scripts/perf/build-linux-trace.sh "$RUNNER_TEMP/trace"
          (cd "$RUNNER_TEMP/trace" && sha256sum okilum > SHA256SUMS)
      - name: Start the software display
        run: |
          Xvfb :99 -screen 0 1366x768x24 >/dev/null 2>&1 &
          sleep 2
      - name: Run the scroll frame-cost guard
        id: legacy-scroll
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 scripts/perf/scroll/gen-notes.py "$RUNNER_TEMP/notes" --check
          export DISPLAY=:99
          dbus-run-session -- python3 scripts/perf/scroll/linux/scroll-trace.py \
            "$RUNNER_TEMP/trace/okilum" "$RUNNER_TEMP/run" "$RUNNER_TEMP/notes" \
            reader:big-head-320.md reader:big-24k.md
          python3 scripts/perf/scroll/analyze.py --md "$RUNNER_TEMP/run/reader-big-head-320" "$RUNNER_TEMP/run/reader-big-24k"
          python3 scripts/perf/scroll/budget.py "$RUNNER_TEMP/run/reader-big-head-320" "$RUNNER_TEMP/run/reader-big-24k"
      - name: Report informational scroll results
        if: always()
        env:
          LEGACY_RESULT: ${{ steps.legacy-scroll.outcome }}
        run: |
          echo "Scroll: **${LEGACY_RESULT:-skipped}**, report-only measurement build, not shipped. Input A/B uses separate unpatched binaries." >> "$GITHUB_STEP_SUMMARY"
      - name: Check editor latency and the baseline ratchet
        env:
          CALIBRATION_RUNS: ${{ inputs.calibration_runs || '1' }}
        run: |
          set -euo pipefail
          export DISPLAY=:99
          case "$CALIBRATION_RUNS" in 1|2|3|4|5) ;; *) exit 2;; esac
          for calibration_pass in $(seq 1 "$CALIBRATION_RUNS"); do
            timeout --signal=TERM --kill-after=5s 600s dbus-run-session -- \
              python3 scripts/perf/editor/ab.py "$RUNNER_TEMP/ab-binaries/main/okilum" \
              "$RUNNER_TEMP/ab-binaries/pr/okilum" "$RUNNER_TEMP/editor/pass-$calibration_pass"
          done
          echo "Consecutive green input A/B runs: **$CALIBRATION_RUNS**, identical pinned main/PR binaries in this job." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-linux-${{ github.sha }}
          path: |
            ${{ runner.temp }}/run/**/trace.log
            ${{ runner.temp }}/run/**/summary.txt
            ${{ runner.temp }}/run/**/wheel-*.txt
            ${{ runner.temp }}/run/**/app.log
            ${{ runner.temp }}/editor/**
            ${{ runner.temp }}/ab-binaries/main/**
            ${{ runner.temp }}/ab-binaries/pr/**
            ${{ runner.temp }}/ab-binaries/pair.json
            ${{ runner.temp }}/ab-hardware.json
            ${{ runner.temp }}/trace/okilum
            ${{ runner.temp }}/trace/BUILD.txt
            ${{ runner.temp }}/trace/SHA256SUMS
          retention-days: 7
          if-no-files-found: warn
