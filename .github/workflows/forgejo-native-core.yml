name: forgejo-native-core
'on':
  push:
    branches:
    - forgejo-native-core-pr/**
permissions:
  contents: read
concurrency:
  group: forgejo-native-core-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
    - name: Keep checkout and vendor patches in LF format
      shell: bash
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Diagnose patch line endings
      shell: bash
      run: |
        git config --show-origin core.autocrlf
        git ls-files --eol scripts/patches
        if LC_ALL=C grep -l $'\r' scripts/patches/*.diff; then
          echo '::error::CRLF detected in vendor patches; checkout must preserve LF'
          exit 1
        fi
    - run: bash scripts/vendor-setup.sh
    - shell: pwsh
      env:
        PKG: okilum-core
        FEATURES: ''
        FILTER: windows_
      run: |
        Get-Content rust-toolchain.toml; rustup show active-toolchain; if ($LASTEXITCODE) { exit $LASTEXITCODE }; rustc -Vv; if ($LASTEXITCODE) { exit $LASTEXITCODE }
        $a = @('test', '--locked', '-p', $env:PKG); if ($env:FEATURES) { $a += @('--features', $env:FEATURES) }; if ($env:FILTER) { $a += $env:FILTER }; $a += @('--', '--nocapture', '--test-threads=1'); & cargo @a; exit $LASTEXITCODE
      name: Run native tests
    # #1120: a note that is not valid UTF-8 must not block links between readable notes. The
    # core integration test scans a real vault; the shell test loads it in a Reader and follows
    # the link. Compiling the shell tests is the long part of this step.
    - shell: pwsh
      run: |
        # The shell's build script embeds an icon; this lane only runs tests, so a minimal one will do.
        python scripts/ci/test-icon.py "$env:RUNNER_TEMP\test.ico"; if ($LASTEXITCODE) { exit $LASTEXITCODE }
        $env:OKILUM_WINDOWS_ICON = "$env:RUNNER_TEMP\test.ico"
        cargo test --locked -p okilum-core --test prepared_links a_non_utf8_note_leaves_links_between_readable_notes_working -- --nocapture --test-threads=1 --exact; if ($LASTEXITCODE) { exit $LASTEXITCODE }
        # --exact needs the module path; a name that matches nothing would "pass" with zero tests.
        # #1188: the hover and the click must agree in such a vault (the test reads the same states).
        foreach ($shell in @(
          # #848: Enter and paste in a CRLF note insert CRLF; Undo restores the bytes.
          'input_newline_tests::crlf_enter_paste_and_undo_preserve_document_bytes',
          'input_newline_tests::crlf_exact_clipboard_and_undo_preserve_document_bytes',
          'document_link_landing_tests::one_non_utf8_note_does_not_block_links_between_readable_notes',
          'document_link_landing_tests::hover_and_navigation_agree_in_a_vault_with_a_non_utf8_note_also_on_a_warm_start',
          'prepared_links::tests::the_first_click_on_a_link_opens_it_after_a_word_selection',
          # #1269: an okilum: link's line lands, cold and in a running window (verbatim roots).
          'reader_open::entry_tests::line_links_land_on_the_line_cold_and_in_a_running_window',
          # #1271: Enter opens and Esc cancels the link confirmation.
          'reader_open::entry_tests::link_confirmation_answers_enter_and_escape'
        )) {
          $found = & cargo test --locked -p okilum-shell --bins $shell -- --list --exact 2>$null
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not ($found -match ': test$')) { throw "the shell link test was not found: $shell" }
          cargo test --locked -p okilum-shell --bins $shell -- --nocapture --test-threads=1 --exact; if ($LASTEXITCODE) { exit $LASTEXITCODE }
        }
        # #1248: the .stignore offer (CRLF files and paths are where Windows differs); list first.
        foreach ($filter in @(
          @('okilum-core', '--lib', 'syncthing_ignore::'),
          @('okilum-shell', '--bins', 'reader_stignore::'),
          @('okilum-shell', '--bins', 'reader_settings::tests::settings_files_shows_the_syncthing')
        )) {
          $found = & cargo test --locked -p $filter[0] $filter[1] $filter[2] -- --list 2>$null
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if (-not ($found -match ': test$')) { throw "no test matches $($filter[2])" }
          cargo test --locked -p $filter[0] $filter[1] $filter[2] -- --nocapture --test-threads=1; if ($LASTEXITCODE) { exit $LASTEXITCODE }
        }
      name: Run link tests with a non-UTF-8 note
