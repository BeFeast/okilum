name: Windows native diagnostics
on:
  workflow_dispatch:
    inputs:
      package: {required: true, default: okilum-sync-controller}
      features: {required: false, default: ''}
      test-filter: {description: 'One test-name substring, not multiple filters or extra flags', required: false, default: ''}
permissions: {contents: read}
concurrency: {group: 'windows-native-${{ github.ref }}', cancel-in-progress: true}
jobs:
  icon:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Generate the standard Windows icon
        run: |
          python3 -m venv "$RUNNER_TEMP/icon-env"
          "$RUNNER_TEMP/icon-env/bin/pip" install CairoSVG==2.8.2
          "$RUNNER_TEMP/icon-env/bin/python" scripts/windows-icon.py crates/okilum-shell/assets/brand/app-icon-light.svg "$RUNNER_TEMP/okilum.ico"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-native-icon
          path: ${{ runner.temp }}/okilum.ico
          retention-days: 1
          if-no-files-found: error
  native:
    needs: icon
    if: startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main' && inputs.package != 'okilum-http-health'
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Keep checkout and vendor patches in LF format
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
      - name: Diagnose patch line endings
        shell: bash
        run: |
          git config --show-origin core.autocrlf
          git ls-files --eol scripts/patches
          if LC_ALL=C grep -l $'\r' scripts/patches/*.diff; then
            echo '::error::CRLF detected in vendor patches; checkout must preserve LF'
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: windows-native-icon
          path: ${{ runner.temp }}/windows-native-icon
      - name: Export the Windows build icon
        shell: pwsh
        run: |
          $icon = Join-Path $env:RUNNER_TEMP 'windows-native-icon/okilum.ico'
          "OKILUM_WINDOWS_ICON=$icon" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: bash scripts/vendor-setup.sh
      - shell: pwsh
        env: {PKG: '${{ inputs.package }}', FEATURES: '${{ inputs.features }}', FILTER: '${{ inputs.test-filter }}'}
        run: |
          Get-Content rust-toolchain.toml; rustup show active-toolchain; if ($LASTEXITCODE) { exit $LASTEXITCODE }; rustc -Vv; if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $a = @('test', '--locked', '-p', $env:PKG); if ($env:FEATURES) { $a += @('--features', $env:FEATURES) }; if ($env:FILTER) { $a += $env:FILTER }; $a += @('--', '--nocapture', '--test-threads=1'); & cargo @a; exit $LASTEXITCODE
      - name: Build the Windows network regression companion
        if: inputs.package == 'okilum-http'
        shell: pwsh
        run: cargo build --locked -p okilum-http --example network_probe
      - name: Upload exact-source network regression companion
        if: inputs.package == 'okilum-http'
        uses: actions/upload-artifact@v4
        with:
          name: windows-network-${{ github.sha }}
          path: target/debug/examples/network_probe.exe
          retention-days: 3

      - name: Native updater transport inspection controls
        if: inputs.package == 'okilum-http' && contains(inputs.features, 'updates')
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p okilum-http --features updates --example updater_probe
          cd scripts/qa/windows-network
          export MSYS_NO_PATHCONV=1
          openssl req -x509 -newkey rsa:2048 -nodes -keyout root.key -out root.pem -days 1 -subj '/CN=Okilum hosted updater root' -addext 'basicConstraints=critical,CA:TRUE'
          openssl req -newkey rsa:2048 -nodes -keyout leaf.key -out leaf.csr -subj '/CN=updater.okilum.test'
          printf 'subjectAltName=DNS:updater.okilum.test,DNS:localhost\nextendedKeyUsage=serverAuth\n' > leaf.ext
          openssl x509 -req -in leaf.csr -CA root.pem -CAkey root.key -CAcreateserial -out leaf.pem -days 1 -extfile leaf.ext
          openssl x509 -in root.pem -outform DER -out root.cer
      - name: Run Windows OS trust and system proxy positive controls
        if: inputs.package == 'okilum-http' && contains(inputs.features, 'updates')
        shell: pwsh
        run: ./scripts/qa/windows-network/controls.ps1
      - uses: actions/upload-artifact@v4
        if: always() && inputs.package == 'okilum-http' && contains(inputs.features, 'updates')
        with:
          name: updater-network-${{ github.sha }}
          path: updater-network-receipt/
          retention-days: 7

  health:
    if: inputs.package == 'okilum-http-health'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Preserve vendor patch line endings
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-native-icon
          path: ${{ runner.temp }}/windows-native-icon
      - name: Export the Windows build icon
        shell: pwsh
        run: |
          $icon = Join-Path $env:RUNNER_TEMP 'windows-native-icon/okilum.ico'
          "OKILUM_WINDOWS_ICON=$icon" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: bash scripts/vendor-setup.sh
      - name: Test production Feedback model and GET public health endpoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p network-receipt
          printf 'source=%s\nrunner=%s\n' "$GITHUB_SHA" "$RUNNER_OS" > network-receipt/identity.txt
          cargo test --locked -p okilum-http -- --test-threads=1
          cargo run --locked -p okilum-http --example network_probe -- health https://pomoi.co/healthz network-receipt/pomoi.txt
          cargo run --locked -p okilum-http --example network_probe -- health https://feedback.befeast.com/healthz network-receipt/alternate.txt
          cat network-receipt/*.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: feedback-network-${{ matrix.os }}-${{ github.sha }}
          path: network-receipt/
          retention-days: 7
