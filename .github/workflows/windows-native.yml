# Diagnostic-ref-only replacement of an already registered dispatch workflow.
# No push trigger. This ref has no native/Cargo/producer/upload job.
name: Claim visibility metadata 1431 R3
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: claim-metadata-1431-r3-${{ github.ref }}
  cancel-in-progress: false
jobs:
  claim-metadata:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'BeFeast/okilum' &&
      github.ref == 'refs/heads/diagnostic/1431-claim-metadata-r3-20261019' &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
          lfs: false
      - name: Read allowlisted claim metadata only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/ci/claim-metadata-probe.py
