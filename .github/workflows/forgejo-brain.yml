name: forgejo-brain
'on':
  push:
    branches:
    - forgejo-brain-pr/**
permissions:
  contents: read
concurrency:
  group: forgejo-brain-${{ github.ref }}
  cancel-in-progress: false
jobs:
  brain:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
      RUSTFLAGS: -C link-arg=-fuse-ld=mold
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Install build tools
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends \
          build-essential cmake pkg-config curl git mold
    - name: Install Rust
      run: |
        curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
        echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
    - name: Resolve pinned workspace path dependencies
      run: |
        scripts/vendor-setup.sh
        scripts/vendor-setup.sh --verify
    - uses: actions/cache/restore@v4
      continue-on-error: true
      with:
        path: |-
          ~/.cargo/registry/
          ~/.cargo/git/
          target/
        key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'scripts/vendor-setup.sh',
          'scripts/patches/*.diff') }}
    - name: Run Brain tests
      run: cargo test -p tessera-brain -p tessera-cored --no-fail-fast
