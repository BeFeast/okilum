# Public package history and synthetic databases only; no release or installation authority.
name: storage-compat
on:
  push:
    branches: ['storage-compat/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: storage-compat-${{ github.ref }}
  cancel-in-progress: true
jobs:
  zip:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - name: Preserve vendor patch line endings
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: storage-compat-zip-v1
          cache-on-failure: true
      - name: Verify exact source and vendor
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash scripts/vendor-setup.sh
          bash scripts/vendor-setup.sh --verify
      - name: Run archive and staged updater extraction controls
        shell: bash
        run: |
          cargo test --locked -p okilum-core --lib archive::tests:: -- --nocapture
          python3 scripts/ci/zip-compat-controls.py
      - name: Apply checksum-verified historical Full and real Delta packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/ci/windows-historical-update.py
          exit $LASTEXITCODE
  inbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: inbox
          shared-key: storage-compat-inbox-v1
      - name: Verify exact source and legacy fixture checksums
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cd inbox/crates/okilum-inboxd/tests/fixtures/legacy-inbox
          sha256sum -c SHA256SUMS
      - name: Lint and test the complete Inbox workspace including WAL recovery
        working-directory: inbox
        run: |
          cargo fmt --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
