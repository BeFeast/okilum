# Public synthetic acceptance only; no signing secrets or publication.
name: sync-v2-signed-beta-Mac-receive-UI
on:
  push:
    branches: ['sync-v2-mac-beta/**']
permissions:
  contents: read
jobs:
  fresh-receiving:
    runs-on: macos-26
    timeout-minutes: 50
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '4'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      OKILUM_QA_DISPOSABLE_HOST: github-hosted-macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare native desktop tooling and public acceptance inputs
        run: |
          test "$RUNNER_OS" = macOS
          test "$(uname -m)" = arm64
          mkdir -p "$RUNNER_TEMP/sync-v2-evidence" "$RUNNER_TEMP/sync-v2-tools"
          cp scripts/ci/sync-v2-beta-accept.py scripts/ci/qa_mac_peer.rs scripts/ci/sync-v2-beta-delivery.json "$RUNNER_TEMP/sync-v2-tools/"
          swiftc scripts/ci/sync-v2-beta-desktop.swift -o "$RUNNER_TEMP/sync-v2-tools/desktop"
          if ! command -v ffmpeg >/dev/null; then brew install ffmpeg; fi
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: agent-macos-sync-v1
      - name: Build the real headless Controller peer from the delivered source
        run: |
          git checkout --detach 3123a1b46a2078c3e3393830db776144df674657
          test "$(git rev-parse HEAD)" = 3123a1b46a2078c3e3393830db776144df674657
          bash scripts/vendor-setup.sh
          bash scripts/vendor-setup.sh --verify
          cp "$RUNNER_TEMP/sync-v2-tools/qa_mac_peer.rs" crates/okilum-sync-controller/tests/qa_mac_peer.rs
          cargo test --locked -p okilum-sync-controller --test qa_mac_peer --no-run --message-format=json > "$RUNNER_TEMP/peer-artifacts.jsonl"
          python3 - <<'PY'
          import json,os,pathlib,shutil
          rows=[json.loads(line) for line in pathlib.Path(os.environ['RUNNER_TEMP'],'peer-artifacts.jsonl').read_text().splitlines() if line.startswith('{')]
          bins=[r['executable'] for r in rows if r.get('reason')=='compiler-artifact' and r.get('executable') and r['target']['name']=='qa_mac_peer']
          assert len(bins)==1,bins
          shutil.copy2(bins[0],pathlib.Path(os.environ['RUNNER_TEMP'],'sync-v2-tools/qa-peer'))
          PY
      - name: Probe bundled peer executable identity with genuine signed fixtures
        run: |
          "$RUNNER_TEMP/sync-v2-tools/qa-peer" --exact bundled_peer_executable_identity --nocapture
      - name: Verify actual signed-beta fresh UI pairing and both-way transport
        run: |
          python3 -u "$RUNNER_TEMP/sync-v2-tools/sync-v2-beta-accept.py" \
            "$RUNNER_TEMP/sync-v2-tools/sync-v2-beta-delivery.json" \
            "$RUNNER_TEMP/sync-v2-tools/desktop" \
            "$RUNNER_TEMP/sync-v2-tools/qa-peer" \
            "$RUNNER_TEMP/sync-v2-evidence"
      - name: Upload selected synthetic screenshots, video and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-v2-signed-beta-Mac-receive-UI
          path: |
            ${{ runner.temp }}/sync-v2-evidence/0*.png
            ${{ runner.temp }}/sync-v2-evidence/failure*.png
            ${{ runner.temp }}/sync-v2-evidence/failure-details-ocr.json
            ${{ runner.temp }}/sync-v2-evidence/native-folder-path.json
            ${{ runner.temp }}/sync-v2-evidence/native-folder-picker-ocr.json
            ${{ runner.temp }}/sync-v2-evidence/fixture-stop.json
            ${{ runner.temp }}/sync-v2-evidence/runtime-observations.jsonl
            ${{ runner.temp }}/sync-v2-evidence/sync-failures.json
            ${{ runner.temp }}/sync-v2-evidence/failure.txt
            ${{ runner.temp }}/sync-v2-evidence/failure-state.json
            ${{ runner.temp }}/sync-v2-evidence/launchctl-before-cleanup.txt
            ${{ runner.temp }}/sync-v2-evidence/raw-pairing.mp4
            ${{ runner.temp }}/sync-v2-evidence/fresh-Mac-beta-pairing.mp4
            ${{ runner.temp }}/sync-v2-evidence/acceptance-receipt.json
            ${{ runner.temp }}/sync-v2-evidence/cleanup.json
            ${{ runner.temp }}/sync-v2-evidence/events.json
            ${{ runner.temp }}/sync-v2-evidence/video-segments.json
            ${{ runner.temp }}/sync-v2-evidence/release.json
            ${{ runner.temp }}/sync-v2-evidence/build-info.txt
            ${{ runner.temp }}/sync-v2-evidence/signature-summary.txt
            ${{ runner.temp }}/sync-v2-evidence/recorder.log
          if-no-files-found: error
          retention-days: 5
