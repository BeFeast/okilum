# Explicit issue-scoped native regression refs; no release or signing work.
name: manifests-native
on:
  push:
    branches: ['manifests-native/**', 'service-layout-native/**', 'code-operations-native/**', 'settings-caption-native/**']
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '4'
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  OKILUM_SOURCE_COMMIT: ${{ github.sha }}
concurrency:
  group: manifests-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  icon:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          python3 -m venv "$RUNNER_TEMP/icon-env"
          "$RUNNER_TEMP/icon-env/bin/pip" install CairoSVG==2.8.2
          "$RUNNER_TEMP/icon-env/bin/python" scripts/windows-icon.py crates/okilum-shell/assets/brand/app-icon-light.svg target/windows-dist/okilum.ico
      - uses: actions/upload-artifact@v4
        with:
          name: updater-windows-icon
          path: target/windows-dist/okilum.ico
          if-no-files-found: error
          retention-days: 1
  native-rust:
    needs: icon
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - name: Keep source and vendor patches in LF format
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
            vendor/gpui-component/
            vendor/comrak-0.47.0/
          key: manifests-native-v1-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'scripts/vendor-setup.sh', 'scripts/patches/*.diff', '.github/workflows/manifests-native.yml') }}-${{ github.sha }}
          restore-keys: |
            manifests-native-v1-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'scripts/vendor-setup.sh', 'scripts/patches/*.diff', '.github/workflows/manifests-native.yml') }}-
            quote-native-v1-${{ runner.os }}-
            keymap-native-v1-${{ runner.os }}-
            math-native-v1-${{ runner.os }}-
            updater-native-v1-${{ runner.os }}-
      - uses: actions/download-artifact@v4
        with:
          name: updater-windows-icon
          path: target/windows-dist
      - name: Verify exact source and prepare native dependencies
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$OKILUM_SOURCE_COMMIT"
          bash scripts/vendor-setup.sh
          bash scripts/vendor-setup.sh --verify
          if [[ "$RUNNER_OS" = macOS ]]; then
            test "$(uname -m)" = arm64
            archive="$RUNNER_TEMP/Sparkle-2.10.0.tar.xz"
            python3 scripts/updater/sparkle.py fetch "$archive"
            python3 scripts/updater/sparkle.py prepare --archive "$archive" --destination vendor/sparkle
            echo "DYLD_FRAMEWORK_PATH=$PWD/vendor/sparkle" >> "$GITHUB_ENV"
          fi
      - name: Run native source, storage and code operation regressions
        shell: bash
        run: |
          if [[ "$RUNNER_OS" = Windows ]]; then
            OKILUM_WINDOWS_ICON="$(cygpath -w "$PWD/target/windows-dist/okilum.ico")"
            export OKILUM_WINDOWS_ICON
          fi
          for filter in issue1859_ projects::create:: service_layout:: service2772_; do
            cargo test --locked -p okilum-t3 "$filter" -- --list | tee "$RUNNER_TEMP/manifests-tests.txt"
            grep -q ': test$' "$RUNNER_TEMP/manifests-tests.txt"
            cargo test --locked -p okilum-t3 "$filter" -- --nocapture --test-threads=1
          done
          python3 scripts/manifests/check.py
          cargo test --locked -p okilum-core service_metadata_tests:: -- --nocapture --test-threads=1
          for filter in code_operations:: json_view::; do
            cargo test --locked -p okilum-core "$filter" -- --list | tee "$RUNNER_TEMP/code-core-tests.txt"
            grep -q ': test$' "$RUNNER_TEMP/code-core-tests.txt"
            cargo test --locked -p okilum-core "$filter" -- --nocapture --test-threads=1
          done
          filters=(reader_project_create::tests:: reader_service_storage::tests:: service2772_ code2771_ issue2755_ issue2770_ window_chrome_settings_about_ about_keeps_each_reader_owner_and_reuses_only_its_own_window owned_settings_center_reuse_escape_and_close_with_owner)
          # reader_settings_sync::tests is cfg(all(test, unix)); keep its
          # focused-field commit controls mandatory on Mac, never empty on Windows.
          if [[ "$RUNNER_OS" = macOS ]]; then
            filters+=(settings_2487_)
          fi
          for filter in "${filters[@]}"; do
            cargo test --locked -p okilum-shell --bin okilum "$filter" -- --list | tee "$RUNNER_TEMP/updater-tests.txt"
            grep -q ': test$' "$RUNNER_TEMP/updater-tests.txt"
            cargo test --locked -p okilum-shell --bin okilum "$filter" -- --nocapture --test-threads=1
          done
          if [[ "$RUNNER_OS" = Windows ]]; then
            python3 scripts/ci/manifests-check.py
          fi
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' }}
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
            vendor/gpui-component/
            vendor/comrak-0.47.0/
          key: ${{ steps.cache.outputs.cache-primary-key }}
