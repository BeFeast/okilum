# Native functional controls only; no release/install/signing authority.
name: updater-helper-compat
on:
  push:
    paths:
      - 'scripts/velopack/**'
      - 'scripts/velopack-setup.py'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'crates/okilum-shell/src/updater/**'
      - 'crates/okilum-http/tests/*helper*'
      - 'crates/okilum-http/tests/zip_compat.rs'
      - 'scripts/ci/updater-helper-controls.py'
      - '.github/workflows/updater-helper-compat.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: updater-helper-compat-${{ github.sha }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - name: Preserve vendor patch line endings
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: storage-compat-zip-v1
          cache-on-failure: true
      - name: Verify exact source and vendor
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          bash scripts/vendor-setup.sh
          bash scripts/vendor-setup.sh --verify
      - name: Run native helper recovery, admission, metadata and failure controls
        shell: bash
        run: python scripts/ci/updater-helper-controls.py
      - name: Apply real checksum-verified historical Full and Delta packages
        shell: pwsh
        run: |
          python scripts/ci/windows-historical-update.py
          exit $LASTEXITCODE
