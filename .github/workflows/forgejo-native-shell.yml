name: forgejo-native-shell
# #1110 / AGENTS 9a: the first-run Reader tests (start screen → choose a vault →
# a window always exists) on native Windows for every code PR. The shell needs
# the build-only icon, made on Linux exactly as for the Windows release lane.
'on':
  push:
    branches:
    - forgejo-native-shell-pr/**
permissions:
  contents: read
concurrency:
  group: forgejo-native-shell-${{ github.ref }}
  cancel-in-progress: false
jobs:
  icon:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - run: |
        python3 -m venv /tmp/icon-env
        /tmp/icon-env/bin/pip install CairoSVG==2.8.2
        /tmp/icon-env/bin/python scripts/windows-icon.py crates/okilum-shell/assets/brand/app-icon-light.svg target/windows-dist/okilum.ico
    - uses: actions/upload-artifact@v4
      with:
        name: windows-icon
        path: target/windows-dist/okilum.ico
        retention-days: 1
        if-no-files-found: error
  native:
    needs: icon
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      CARGO_INCREMENTAL: '0'
    steps:
    - name: Keep checkout and vendor patches in LF format
      shell: bash
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        name: windows-icon
        path: target/windows-dist
    - run: bash scripts/vendor-setup.sh
    - shell: pwsh
      env:
        FILTER: first_run
      run: |
        $env:OKILUM_WINDOWS_ICON = Join-Path $env:GITHUB_WORKSPACE 'target/windows-dist/okilum.ico'
        rustup show active-toolchain; if ($LASTEXITCODE) { exit $LASTEXITCODE }
        $a = @('test', '--locked', '-p', 'okilum-shell', '--bins', $env:FILTER)
        # Positive control: a renamed test must not leave this lane running nothing.
        $list = & cargo @a -- --list; if ($LASTEXITCODE) { exit $LASTEXITCODE }
        $list
        if (-not ($list | Select-String ': test$')) { Write-Error "No test matches $env:FILTER"; exit 1 }
        & cargo @a -- --nocapture --test-threads=1; exit $LASTEXITCODE
      name: Run native tests
