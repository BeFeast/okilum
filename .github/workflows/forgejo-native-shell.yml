name: forgejo-native-shell
# #1110 / AGENTS 9a: the first-run Reader tests (start screen → choose a vault →
# a window always exists) on native Windows for every code PR. The shell needs
# the build-only icon, made on Linux exactly as for the Windows release lane.
'on':
  push:
    branches:
    - forgejo-native-shell-pr/**
permissions:
  contents: read
concurrency:
  group: forgejo-native-shell-${{ github.ref }}
  cancel-in-progress: false
jobs:
  icon:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - run: |
        python3 -m venv /tmp/icon-env
        /tmp/icon-env/bin/pip install CairoSVG==2.8.2
        /tmp/icon-env/bin/python scripts/windows-icon.py crates/okilum-shell/assets/brand/app-icon-light.svg target/windows-dist/okilum.ico
    - uses: actions/upload-artifact@v4
      with:
        name: windows-icon
        path: target/windows-dist/okilum.ico
        retention-days: 1
        if-no-files-found: error
  native:
    needs: icon
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      CARGO_INCREMENTAL: '0'
    steps:
    - name: Keep checkout and vendor patches in LF format
      shell: bash
      run: |
        git config --global core.autocrlf false
        git config --global core.eol lf
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        name: windows-icon
        path: target/windows-dist
    - run: bash scripts/vendor-setup.sh
    - name: Compile all Windows workspace test targets
      shell: pwsh
      run: |
        $env:OKILUM_WINDOWS_ICON = Join-Path $env:GITHUB_WORKSPACE 'target/windows-dist/okilum.ico'
        cargo test --locked --workspace --no-run
        exit $LASTEXITCODE
    - name: Run portable Brain transports and the read-only CLI on Windows
      shell: pwsh
      run: |
        cargo test --locked -p okilum-brain -p okilum-cored -- --test-threads=1
        exit $LASTEXITCODE
    - name: Run Windows clipboard provider regression
      shell: pwsh
      run: |
        $env:OKILUM_WINDOWS_ICON = Join-Path $env:GITHUB_WORKSPACE 'target/windows-dist/okilum.ico'
        # The test executable has libtest's main; the bounded reader must run
        # the ordinary same-source app main. This is test support, not a QA
        # production artifact or a second package build.
        cargo build --locked -p okilum-shell --bin okilum --no-default-features
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        $env:OKILUM_TEST_CLIPBOARD_EXECUTABLE = Join-Path $env:GITHUB_WORKSPACE 'target/debug/okilum.exe'
        $clipboardResult = 0
        foreach ($filter in @('windows_clipboard', 'windows_note_clipboard', 'note_paste::router::tests::', 'note_paste::title::tests::')) {
          $list = & cargo test --locked -p okilum-shell --bin okilum $filter -- --list
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $list
          if (-not ($list | Select-String ': test$')) {
            Write-Host "::error::No clipboard regression matched $filter"
            $clipboardResult = 1
            continue
          }
          cargo test --locked -p okilum-shell --bin okilum $filter -- --nocapture --test-threads=1
          if ($LASTEXITCODE) { $clipboardResult = 1 }
        }
        cargo test --locked -p okilum-paste
        if ($LASTEXITCODE) { $clipboardResult = 1 }
        exit $clipboardResult
    - shell: pwsh
      env:
        FILTER: first_run
      run: |
        $env:OKILUM_WINDOWS_ICON = Join-Path $env:GITHUB_WORKSPACE 'target/windows-dist/okilum.ico'
        rustup show active-toolchain; if ($LASTEXITCODE) { exit $LASTEXITCODE }
        $a = @('test', '--locked', '-p', 'okilum-shell', '--bins', $env:FILTER)
        # Positive control: a renamed test must not leave this lane running nothing.
        $list = & cargo @a -- --list; if ($LASTEXITCODE) { exit $LASTEXITCODE }
        $list
        if (-not ($list | Select-String ': test$')) { Write-Error "No test matches $env:FILTER"; exit 1 }
        & cargo @a -- --nocapture --test-threads=1; exit $LASTEXITCODE
      name: Run native tests
    - shell: pwsh
      env:
        FILTER: shaped_line_cache
      run: |
        $env:OKILUM_WINDOWS_ICON = Join-Path $env:GITHUB_WORKSPACE 'target/windows-dist/okilum.ico'
        rustup show active-toolchain; if ($LASTEXITCODE) { exit $LASTEXITCODE }
        $a = @('test', '--locked', '-p', 'okilum-shell', '--bins', $env:FILTER)
        # Positive control: a renamed test must not leave this lane running nothing.
        $list = & cargo @a -- --list; if ($LASTEXITCODE) { exit $LASTEXITCODE }
        $list
        if (-not ($list | Select-String ': test$')) { Write-Error "No test matches $env:FILTER"; exit 1 }
        & cargo @a -- --nocapture --test-threads=1; exit $LASTEXITCODE
      # #1312: the shaped-line cache over the right-to-left repair equals the
      # shaper on Windows (the order text_platform.rs installs).
      name: Run native text tests

    - name: Run updater progress and restart regressions
      shell: pwsh
      run: |
        $env:OKILUM_WINDOWS_ICON = Join-Path $env:GITHUB_WORKSPACE 'target/windows-dist/okilum.ico'
        cargo test --locked -p okilum-shell --bin okilum updater:: -- --nocapture --test-threads=1
        exit $LASTEXITCODE

    - name: Run uninstall Sync identity regression
      shell: pwsh
      run: |
        # #3109: the Velopack hook stops Sync first and keeps Okilum\Sync on NTFS.
        $env:OKILUM_WINDOWS_ICON = Join-Path $env:GITHUB_WORKSPACE 'target/windows-dist/okilum.ico'
        $list = & cargo test --locked -p okilum-shell --bin okilum app_footprint::tests:: -- --list
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        $list
        # FIX FIRST on #3112: junctions, 8.3 names and dangling links are resolved or refused.
        foreach ($name in @(
            'windows_hook_stops_sync_first_and_keeps_its_identity_in_the_state_root',
            'windows_hook_removes_nothing_when_sync_cannot_be_stopped',
            'windows_hook_removes_nothing_when_a_path_cannot_be_resolved',
            'windows_hook_refuses_a_dangling_junction_root',
            'windows_junctioned_local_app_data_keeps_sync_identity',
            'windows_junctioned_roots_are_never_followed',
            'windows_dangling_junction_refuses_the_plan',
            'windows_short_names_match_their_long_spelling')) {
          if (-not ($list | Select-String "${name}: test$")) {
            Write-Error "Windows uninstall control $name was not discovered"; exit 1
          }
        }
        cargo test --locked -p okilum-shell --bin okilum app_footprint::tests:: -- --nocapture --test-threads=1
        exit $LASTEXITCODE

    - name: Run owned non-modal tool regressions
      shell: pwsh
      run: |
        $env:OKILUM_WINDOWS_ICON = Join-Path $env:GITHUB_WORKSPACE 'target/windows-dist/okilum.ico'
        $list = & cargo test --locked -p okilum-shell --bin okilum owned_ -- --list
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        $list
        if (-not ($list | Select-String 'windows_owned_tool_.*: test$')) {
          Write-Error 'Native HWND ownership regression did not match'; exit 1
        }
        cargo test --locked -p okilum-shell --bin okilum owned_ -- --nocapture --test-threads=1
        exit $LASTEXITCODE

    - name: Run own-window capture regressions
      shell: pwsh
      run: |
        # #1502: PrintWindow on our own HWND, GDI and the GPUI-style
        # DirectComposition swap chain, plus the Feedback button route.
        $env:OKILUM_WINDOWS_ICON = Join-Path $env:GITHUB_WORKSPACE 'target/windows-dist/okilum.ico'
        foreach ($filter in @('own_window_capture', 'feedback1502_')) {
          $list = & cargo test --locked -p okilum-shell --bin okilum $filter -- --list
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $list
          if (-not ($list | Select-String ': test$')) { Write-Error "No test matches $filter"; exit 1 }
          cargo test --locked -p okilum-shell --bin okilum $filter -- --nocapture --test-threads=1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
        }
        $list = & cargo test --locked -p okilum-shell --bin okilum own_window_capture_reads_direct_composition_swap_chain -- --list
        if (-not ($list | Select-String ': test$')) { Write-Error 'DirectComposition control did not match'; exit 1 }

    - name: Run exact update window restoration and dirty single-file regressions
      shell: pwsh
      run: |
        $env:OKILUM_WINDOWS_ICON = Join-Path $env:GITHUB_WORKSPACE 'target/windows-dist/okilum.ico'
        foreach ($filter in @('reader_update_restart::tests::', 'reader_editor::tests::update_restart_refuses_unprotected_single_file_then_preserves_latest_draft')) {
          $list = & cargo test --locked -p okilum-shell --bin okilum $filter -- --list
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $list
          if (-not ($list | Select-String ': test$')) { Write-Error "No test matches $filter"; exit 1 }
          cargo test --locked -p okilum-shell --bin okilum $filter -- --nocapture --test-threads=1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
        }
