# Diagnostic only: fixed five paired runs on one hosted Windows VM.
name: data-view-native
on:
  push:
    branches: ['data-view-native/**']
permissions:
  contents: read
  actions: read
jobs:
  paired-reader:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43209282518
          name: toolbar-main-baseline-windows
          path: inputs/main
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43208354080
          name: code-toolbar-release-windows-binary
          path: inputs/toolbar
      - name: Compare five fixed pairs without changing any budget
        run: python scripts/ci/paired-reader-budget.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-reader-budget
          path: diagnostics/paired-reader
          if-no-files-found: error
          retention-days: 7
