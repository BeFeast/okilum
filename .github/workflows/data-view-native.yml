# Explicit issue-scoped native regression refs; no release or signing work.
name: data-view-native
on:
  push:
    branches: ['data-view-native/**']
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '4'
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  OKILUM_SOURCE_COMMIT: ${{ github.sha }}
concurrency:
  group: data-view-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  icon:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          python3 -m venv "$RUNNER_TEMP/icon-env"
          "$RUNNER_TEMP/icon-env/bin/pip" install CairoSVG==2.8.2
          "$RUNNER_TEMP/icon-env/bin/python" scripts/windows-icon.py crates/okilum-shell/assets/brand/app-icon-light.svg target/windows-dist/okilum.ico
      - uses: actions/upload-artifact@v4
        with:
          name: updater-windows-icon
          path: target/windows-dist/okilum.ico
          if-no-files-found: error
          retention-days: 1
  native-rust:
    needs: icon
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - name: Keep source and vendor patches in LF format
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
            vendor/gpui-component/
            vendor/comrak-0.47.0/
          key: data-view-native-v1-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'scripts/vendor-setup.sh', 'scripts/patches/*.diff', '.github/workflows/data-view-native.yml') }}-${{ github.sha }}
          restore-keys: |
            data-view-native-v1-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml', 'crates/**/Cargo.toml', 'scripts/vendor-setup.sh', 'scripts/patches/*.diff', '.github/workflows/data-view-native.yml') }}-
            data-view-native-v1-${{ runner.os }}-
            embeds-native-v1-${{ runner.os }}-
            quote-native-v1-${{ runner.os }}-
            keymap-native-v1-${{ runner.os }}-
            math-native-v1-${{ runner.os }}-
            updater-native-v1-${{ runner.os }}-
      - uses: actions/download-artifact@v4
        with:
          name: updater-windows-icon
          path: target/windows-dist
      - name: Verify exact source and prepare native dependencies
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "$OKILUM_SOURCE_COMMIT"
          bash scripts/vendor-setup.sh
          bash scripts/vendor-setup.sh --verify
          if [[ "$RUNNER_OS" = macOS ]]; then
            test "$(uname -m)" = arm64
            archive="$RUNNER_TEMP/Sparkle-2.10.0.tar.xz"
            python3 scripts/updater/sparkle.py fetch "$archive"
            python3 scripts/updater/sparkle.py prepare --archive "$archive" --destination vendor/sparkle
            echo "DYLD_FRAMEWORK_PATH=$PWD/vendor/sparkle" >> "$GITHUB_ENV"
          fi
      - name: Build real native app without GPUI test support
        id: native_build
        shell: bash
        run: |
          if [[ "$RUNNER_OS" = Windows ]]; then
            export OKILUM_WINDOWS_ICON="$(cygpath -w "$PWD/target/windows-dist/okilum.ico")"
          fi
          cargo build --locked -p okilum-shell --bin okilum --features data-view-native-harness
      - name: Observe native event loop and system clipboard with 32 MiB files
        shell: bash
        run: |
          binary=target/debug/okilum
          if [[ "$RUNNER_OS" = Windows ]]; then binary="$binary.exe"; fi
          export OKILUM_CODE_TIMING=1
          if [[ "$RUNNER_OS" = macOS ]]; then export DIAG_2825_XCTRACE="$RUNNER_TEMP/dv.trace"; fi
          set +e
          python3 scripts/ci/data-view-native-app.py "$binary"
          status=$?
          if [[ "$RUNNER_OS" = macOS ]]; then
            mkdir -p "$RUNNER_TEMP/dv-export"
            xcrun xctrace export --input "$RUNNER_TEMP/dv.trace" --toc > "$RUNNER_TEMP/dv-export/toc.xml" || true
            xcrun xctrace export --input "$RUNNER_TEMP/dv.trace" --xpath '/trace-toc/run[@number="1"]/data/table[@schema="time-profile"]' > "$RUNNER_TEMP/dv-export/time-profile.xml" || true
            ls -la "$RUNNER_TEMP/dv-export"
          fi
          exit $status
      - name: Observe native table independently of the data-view probe
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        shell: bash
        run: |
          binary=target/debug/okilum
          if [[ "$RUNNER_OS" = Windows ]]; then binary="$binary.exe"; fi
          python3 scripts/ci/data-table-native-app.py "$binary"
      - name: Exercise file Edit through the real native Reader
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        shell: bash
        run: |
          binary=target/debug/okilum
          if [[ "$RUNNER_OS" = Windows ]]; then binary="$binary.exe"; fi
          if [[ "$RUNNER_OS" = Windows ]]; then
            for c in "/c/Program Files (x86)/Windows Kits/10/Debuggers/x64/cdb.exe" "/c/Program Files/Windows Kits/10/Debuggers/x64/cdb.exe"; do
              if [[ -x "$c" ]]; then export DIAG_2825_CDB="$(cygpath -w "$c")"; fi
            done
            echo "DIAG_2825_CDB=${DIAG_2825_CDB:-missing}"
            ls "/c/Program Files (x86)/Windows Kits/10/" || true
          fi
          python3 scripts/ci/reader-viewer-native-app.py "$binary"
      - name: Exercise Reader Tree on the native debug main stack
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        shell: bash
        run: |
          binary=target/debug/okilum
          if [[ "$RUNNER_OS" = Windows ]]; then binary="$binary.exe"; fi
          python3 scripts/ci/code-toolbar-native-app.py "$binary" --smoke
      - name: Retain native frame diagnostics before Rust controls
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: code-toolbar-debug-${{ runner.os }}
          path: |
            ${{ runner.temp }}/code-toolbar-native-app.log
            ${{ runner.temp }}/code-toolbar-native-receipt.json
          if-no-files-found: ignore
          retention-days: 7
      # A known app-probe failure must not hide independent Rust regressions.
      # The failed probe still fails the job; no threshold or reserve changes.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: data-view-native-${{ runner.os }}
          path: |
            ${{ runner.temp }}/data-view-native-app.log
            ${{ runner.temp }}/data-table-native-app.log
            ${{ runner.temp }}/reader-viewer-native-app.log
            ${{ runner.temp }}/dv-export/
            target/file-edit-toolbar-controls/
            ${{ runner.temp }}/code-toolbar-native-app.log
            ${{ runner.temp }}/code-toolbar-native-receipt.json
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
            vendor/gpui-component/
            vendor/comrak-0.47.0/
          key: ${{ steps.cache.outputs.cache-primary-key }}

  windows-atlas:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Preserve exact vendor patch bytes
        shell: bash
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-atlas-upload-v1
          cache-on-failure: true
      - name: Prepare checksum-pinned DirectX backend
        shell: bash
        run: |
          bash scripts/vendor-setup.sh
          bash scripts/vendor-setup.sh --verify
      - name: Exercise real WARP uploads and five compiled runtime controls
        shell: bash
        run: python3 scripts/ci/windows-atlas-upload.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-atlas-upload-controls
          path: target/windows-atlas-upload-controls/
          if-no-files-found: ignore
          retention-days: 7


