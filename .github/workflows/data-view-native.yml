# Diagnostic-only ref: main 0c497f17 with label timing, no toolbar changes.
name: data-view-native
on:
  push:
    branches: ['data-view-native/2810-main-baseline-*']
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
  CARGO_BUILD_JOBS: '4'
  OKILUM_SOURCE_COMMIT: ${{ github.sha }}
  CARGO_TARGET_DIR: target/code-toolbar-release
jobs:
  icon:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: |
          python3 -m venv "$RUNNER_TEMP/icon-env"
          "$RUNNER_TEMP/icon-env/bin/pip" install CairoSVG==2.8.2
          "$RUNNER_TEMP/icon-env/bin/python" scripts/windows-icon.py crates/okilum-shell/assets/brand/app-icon-light.svg target/windows-dist/okilum.ico
      - uses: actions/upload-artifact@v4
        with:
          name: updater-windows-icon
          path: target/windows-dist/okilum.ico
          if-no-files-found: error
          retention-days: 1
  baseline:
    needs: icon
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/cache/restore@v4
        id: baseline_cache
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/code-toolbar-release/
          key: toolbar-main-baseline-${{ github.sha }}
          restore-keys: |
            toolbar-main-baseline-
            code-toolbar-release-v1-Windows-
      - uses: actions/download-artifact@v4
        with:
          name: updater-windows-icon
          path: target/windows-dist
      - name: Build instrumented main without toolbar step 5
        shell: bash
        run: |
          test "$(git merge-base HEAD 0c497f1731ae6f45499b60c63daffeb787772d15)" = 0c497f1731ae6f45499b60c63daffeb787772d15
          bash scripts/vendor-setup.sh
          bash scripts/vendor-setup.sh --verify
          export OKILUM_WINDOWS_ICON="$(cygpath -w "$PWD/target/windows-dist/okilum.ico")"
          cargo build --locked --release -p okilum-shell --bin okilum --features data-view-native-harness
          target/code-toolbar-release/release/okilum.exe --build-info
      - uses: actions/upload-artifact@v4
        with:
          name: toolbar-main-baseline-windows
          path: target/code-toolbar-release/release/okilum.exe
          if-no-files-found: error
          retention-days: 3
      - name: Package unchanged native build inputs for VM-only atlas experiment
        shell: bash
        run: python scripts/ci/toolbar-baseline-capsule.py
      - uses: actions/upload-artifact@v4
        with:
          name: toolbar-main-baseline-build-inputs
          path: |
            ${{ runner.temp }}/toolbar-baseline-workspace.tar.gz
            ${{ runner.temp }}/toolbar-baseline-cargo.tar.gz
          compression-level: 0
          if-no-files-found: error
          retention-days: 3
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() && steps.baseline_cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/code-toolbar-release/
          key: ${{ steps.baseline_cache.outputs.cache-primary-key }}
