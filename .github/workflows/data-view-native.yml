# Diagnostic only: capture scheduling around the retained legacy executable.
name: data-view-native
on:
  push:
    branches: ['data-view-native/**']
permissions:
  contents: read
  actions: read
jobs:
  scheduling:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 43208354080
          name: code-toolbar-release-windows-binary
          path: inputs/toolbar
      - name: Capture kernel scheduling without changing the frame gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force diagnostics/scheduling | Out-Null
          $env:RUNNER_TEMP = "$pwd/diagnostics/scheduling"
          $env:OKILUM_SOURCE_COMMIT = '4f4049ac78ef16d605f689e5d52fa7f0296c47fa'
          python scripts/ci/observe-native-priority.py *> diagnostics/scheduling/runner.log
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-scheduling
          path: diagnostics/scheduling
          if-no-files-found: error
          retention-days: 7
