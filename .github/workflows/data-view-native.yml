# Diagnostic only: capture scheduling around the timestamp-instrumented legacy executable.
name: data-view-native
on:
  push:
    branches: ['data-view-native/**']
permissions:
  contents: read
  actions: read
env:
  CARGO_BUILD_JOBS: '4'
  CARGO_INCREMENTAL: '0'
  CARGO_TARGET_DIR: target/code-toolbar-release
  OKILUM_SOURCE_COMMIT: ${{ github.sha }}
jobs:
  icon:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m venv "$RUNNER_TEMP/icon-env"
          "$RUNNER_TEMP/icon-env/bin/pip" install CairoSVG==2.8.2
          "$RUNNER_TEMP/icon-env/bin/python" scripts/windows-icon.py crates/okilum-shell/assets/brand/app-icon-light.svg target/windows-dist/okilum.ico
      - uses: actions/upload-artifact@v4
        with:
          name: updater-windows-icon
          path: target/windows-dist/okilum.ico
  scheduling:
    needs: icon
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/code-toolbar-release/
          key: code-toolbar-release-v1-Windows-wall-markers-${{ github.sha }}
          restore-keys: code-toolbar-release-v1-Windows-
      - uses: actions/download-artifact@v4
        with:
          name: updater-windows-icon
          path: target/windows-dist
      - name: Build only timestamp-instrumented legacy Reader
        shell: bash
        run: |
          bash scripts/vendor-setup.sh
          bash scripts/vendor-setup.sh --verify
          export OKILUM_WINDOWS_ICON="$(cygpath -w "$PWD/target/windows-dist/okilum.ico")"
          cargo build --locked --release -p okilum-shell --bin okilum --features data-view-native-harness
      - name: Capture kernel scheduling without changing the frame gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force diagnostics/scheduling | Out-Null
          Get-Command wpr.exe,xperf.exe,wpaexporter.exe -ErrorAction SilentlyContinue | Format-List *
          wpr.exe -profiles
          wpr.exe -profiledetails GeneralProfile
          wpr.exe -start GeneralProfile -filemode
          if ($LASTEXITCODE) { throw 'Could not start WPR' }
          try {
            $env:RUNNER_TEMP = "$pwd/diagnostics/scheduling"
            # Source is inherited from the exact build above.
            python scripts/ci/code-toolbar-native-app.py target/code-toolbar-release/release/okilum.exe *> diagnostics/scheduling/runner.log
            $nativeExit = $LASTEXITCODE
          } finally {
            wpr.exe -stop diagnostics/scheduling/reader.etl
          }
          Set-Content diagnostics/scheduling/runner-exit.txt $nativeExit
          tracerpt.exe diagnostics/scheduling/reader.etl -of XML -o diagnostics/scheduling/reader.xml -y
          if ($LASTEXITCODE) { throw 'Could not decode ETW' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-scheduling
          path: diagnostics/scheduling
          if-no-files-found: error
          retention-days: 7
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/code-toolbar-release/
          key: code-toolbar-release-v1-Windows-wall-markers-${{ github.sha }}
