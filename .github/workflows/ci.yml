# Public CI on GitHub for external pull requests: fmt, clippy and Reader tests on Linux.
# No secrets, no signing, no releases — releases are built by the primary Forgejo CI.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential cmake pkg-config curl git \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfontconfig-dev libfreetype-dev libxcb1-dev
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Vendor gpui-component (pinned revision + patches)
        run: |
          scripts/vendor-setup.sh
          scripts/vendor-setup.sh --verify
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/
            ~/.cargo/git/
            target/
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'scripts/vendor-setup.sh', 'scripts/patches/*.diff') }}
      - name: rustfmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Reader tests
        run: cargo test -p tessera-core -p tessera-shell
